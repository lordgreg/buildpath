# Gate thresholds: what a player needs at each step.
#
# `calibrated: false` until P3 proves these against must-pass and must-fail
# reference builds (PLAN-BUILDS.md §8). Until then every page that shows a
# number also says "uncalibrated".
schemaVersion: 1
calibrated: false
# Elemental resistances must reach this after the game's per-act penalty.
resistanceFloor: 75
checkpoints:
  until-12:
    # Nothing is capped in act 1, and the penalty leaves most players negative.
    resists: false
    life: 250
    dps: 300
  until-28:
    # Still not realistic to cap in act 3; defence is life and not standing still.
    resists: false
    life: 700
    dps: 1500
  until-68:
    life: 2000
    maxHit: 2000
    dps: 8000
  maps-early:
    life: 3000
    ehp: 8000
    maxHit: 4000
    dps: 20000
  maps-red:
    life: 4500
    ehp: 12000
    maxHit: 6000
    dps: 80000
  pinnacle:
    # Pinnacle bosses hit with chaos; capping it is part of being ready.
    chaosResist: 75
    life: 5000
    ehp: 14000
    maxHit: 7000
    dps: 150000
