# Gate thresholds: what a player needs at each step.
#
# `calibrated: true` once P3's must-pass and must-fail sets pass in both
# directions (PLAN-BUILDS.md §8). The verifier also checks that the committed
# calibration report matches these thresholds, so the flag alone is not enough.
schemaVersion: 1
calibrated: true
# Elemental resistances must reach this after the game's per-act penalty.
resistanceFloor: 75
checkpoints:
  until-12:
    # Nothing is capped in act 1, and the penalty leaves most players negative.
    # Damage floors follow the gems a level-12 character can actually hold
    # (level 1-2, not level 4), so they are much lower than the endgame gates.
    resists: false
    life: 250
    # Measured: a minion build does 99 DPS here, a 3-link bow 37. A floor that
    # only a build with six bodies can clear gates on archetype, not on being
    # playable, so it sits below both.
    dps: 25
  until-28:
    # Still not realistic to cap in act 3; defence is life and not standing still.
    resists: false
    life: 700
    dps: 350
  until-68:
    life: 2000
    maxHit: 2000
    dps: 8000
  maps-early:
    life: 3000
    ehp: 8000
    maxHit: 4000
    dps: 20000
  maps-red:
    life: 4500
    ehp: 12000
    maxHit: 6000
    # A 4-link with the eldritch implicits now clears the old 80k floor on the
    # Deadeye, so the floor moves to where "a 4-link at T16" fails again. All
    # three must-pass seeds clear 120k (lowest: Deadeye at 141k).
    dps: 120000
  pinnacle:
    # Pinnacle bosses hit with chaos; capping it is part of being ready.
    chaosResist: 75
    life: 5000
    ehp: 14000
    maxHit: 7000
    dps: 150000
