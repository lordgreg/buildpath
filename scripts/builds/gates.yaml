# Gate thresholds: what a player needs at each checkpoint.
#
# `calibrated: false` until P3 proves these against must-pass and must-fail
# reference builds (PLAN-BUILDS.md §8). Until then every page that shows a
# number also says "uncalibrated".
schemaVersion: 1
calibrated: false
# Elemental resistances must reach 75% after the game's per-act penalty.
resistanceFloor: 75
checkpoints:
  act5:
    life: 700
    dps: 150
  act10:
    life: 1500
    dps: 1000
  maps-early:
    life: 3000
    ehp: 8000
    maxHit: 4000
    dps: 20000
  maps-red:
    life: 4500
    ehp: 12000
    maxHit: 6000
    dps: 80000
  pinnacle:
    life: 5000
    ehp: 14000
    maxHit: 7000
    dps: 150000
