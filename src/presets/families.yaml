schemaVersion: 1
families:
  - id: caster
    name: Caster
    summary: Intelligence bases, spells and an energy-shield shield.
    attributes: [int]
    armourTags: [int_armour]
    jewelTag: intjewel
    # Iron Ring's physical attack implicit is useless for spell casters, and
    # Bone Ring's implicit only helps minions.
    excludedBases: [Iron Ring, Bone Ring]
    weapon:
      itemClasses: [Wand]
    offhand:
      itemClasses: [Shield]
      tags: [int_armour]
  - id: minion
    name: Minion
    summary: Minion wand and shield, armour/ES hybrid bases.
    attributes: [int]
    armourTags: [int_armour, str_int_armour]
    jewelTag: intjewel
    # Cloth Belt's stun/block recovery is useless for a summoner, as are the
    # life and mana regen amulet bases and Iron Ring's physical attack implicit.
    excludedBases: [Cloth Belt, Coral Amulet, Marble Amulet, Blue Pearl Amulet, Iron Ring]
    # Leather Belt's life implicit is the only belt a summoner wants; the other
    # belt implicits (phys, stun duration, strength) are wasted on minions.
    belt:
      itemClasses: [Belt]
      bases: [Leather Belt]
    weapon:
      itemClasses: [Wand]
      tags: [weapon_can_roll_minion_modifiers]
    offhand:
      itemClasses: [Shield]
      tags: [focus_can_roll_minion_modifiers]
  - id: bow
    name: Bow
    summary: Evasion bases, bow and quiver.
    attributes: [dex]
    armourTags: [dex_armour]
    jewelTag: dexjewel
    # Bone Ring's implicit only helps minions.
    excludedBases: [Bone Ring]
    # Moonstone Ring's cast speed implicit is a caster stat; a rare can still
    # roll life and resists, so only the normal and magic drops are hidden.
    excludedMagicBases: [Moonstone Ring]
    weapon:
      itemClasses: [Bow]
    offhand:
      itemClasses: [Quiver]
  - id: melee
    name: Melee
    summary: Strength bases, one-hander and shield by default.
    attributes: [str]
    armourTags: [str_armour]
    jewelTag: strjewel
    # Chain Belt's energy-shield implicit is dead on a strength armour build,
    # and Bone Ring's implicit only helps minions.
    excludedBases: [Chain Belt, Bone Ring]
    # Paua Ring's mana implicit and Moonstone Ring's cast speed implicit are
    # caster bases; a rare can still roll life and resists, so only the normal
    # and magic drops are hidden.
    excludedMagicBases: [Paua Ring, Moonstone Ring]
    weapon:
      itemClasses: [One Hand Sword]
    offhand:
      itemClasses: [Shield]
      tags: [str_shield]
  - id: hybrid
    name: Hybrid
    summary: Dexterity/intelligence bases, claw and shield.
    attributes: [dex, int]
    armourTags: [dex_int_armour]
    jewelTag: dexjewel
    # Bone Ring's implicit only helps minions.
    excludedBases: [Bone Ring]
    # Moonstone Ring's cast speed implicit is a caster stat; a rare can still
    # roll life and resists, so only the normal and magic drops are hidden.
    excludedMagicBases: [Moonstone Ring]
    weapon:
      itemClasses: [Claw]
    offhand:
      itemClasses: [Shield]
      tags: [dex_int_shield]