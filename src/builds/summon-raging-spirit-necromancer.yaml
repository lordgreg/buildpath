schemaVersion: 1
season: covens
wickerman:
  profile: minion
stepPlan: srs
id: summon-raging-spirit-necromancer
name: Summon Raging Spirit Necromancer
class: Witch
ascendancyId: necromancer
family: minion
mainSkill: Summon Raging Spirit
summary: >-
  League-start minion build that trades skeletons for a swarm of raging
  spirits. The spirits are temporary, aggressive and scale with minion damage,
  so the same budget caster gear that proves the skeleton build proves this one.
  No required unique.

dad: true

pros:
  - { weight: 3, text: "No required unique; gem levels and minion stats carry the damage." }
  - { weight: 3, text: "The spirits seek enemies on their own, so clear does not need precise aiming." }
  - { weight: 2, text: "Aggressive minions keep damage uptime high while you move." }
  - { weight: 2, text: "Uses the same caster budget as the skeleton build, so gear is easy to reuse." }
  - { weight: 2, text: "A strong boss setup once the spirits are stacked." }
  - { weight: 1, text: "Offering and corpse setup rewards planning but is not mandatory early." }
cons:
  - { weight: 3, text: "The spirits expire, so damage falls off if you stop casting." }
  - { weight: 3, text: "You are fragile when the minion wall breaks or you are caught alone." }
  - { weight: 2, text: "Clear speed is slower than a bow build." }
  - { weight: 2, text: "Many gems compete for slots and links." }
  - { weight: 2, text: "Minion AI can waste the swarm on a single tanky rare." }
  - { weight: 1, text: "Leveling is clunky before the first minion notables." }

ratings:
  tankiness: 5
  singleTarget: 8
  clear: 6
  cost: 9

guide:
  summary:
    text: >-
      Summon Raging Spirit Necromancer is a league-start minion build that
      measures {{gates.maps-red.metrics.dps|dps}} at red maps and
      {{gates.endgame-pinnacle.metrics.dps|dps}} at pinnacle. The spirits seek enemies on their
      own, the caster gear is shared with the skeleton build, and no unique is
      required.
    facts: [mainSkill, ascendancyId, gates.maps-red.metrics.dps, gates.endgame-pinnacle.metrics.dps]
    signed: { by: maintainer, at: "2026-11-26T00:00:00Z" }
  leveling:
    text: >-
      Level with raging spirits and a minion damage support; they are available
      early and keep moving while you do. The first checkpoint measures
      {{gates.leveling-1-12.metrics.life|int}} life and {{gates.leveling-1-12.metrics.dps|dps}} damage;
      the second measures {{gates.leveling-12-28.metrics.dps|dps}}. A mana flask covers the
      repeated casts.
    facts: [gates.leveling-1-12.metrics.life, gates.leveling-1-12.metrics.dps, gates.leveling-12-28.metrics.dps]
  maps:
    text: >-
      At red maps the build measures {{gates.maps-red.metrics.dps|dps}} damage,
      {{gates.maps-red.metrics.ehp|int}} effective life and
      {{gates.maps-red.metrics.maxHit|int}} physical max hit. Keep the spirits between
      you and the pack, cap elemental resistances, and let the filter hide the
      rest.
    facts: [gates.maps-red.metrics.dps, gates.maps-red.metrics.ehp, gates.maps-red.metrics.maxHit]
  bossing:
    text: >-
      Pinnacle measures {{gates.endgame-pinnacle.metrics.dps|dps}} damage with
      {{gates.endgame-pinnacle.metrics.ehp|int}} effective life and
      {{gates.endgame-pinnacle.metrics.maxHit|int}} physical max hit. Refresh the swarm before
      the burst, keep Flesh Offering up, and recast after every phase change.
    facts: [gates.endgame-pinnacle.metrics.dps, gates.endgame-pinnacle.metrics.ehp, gates.endgame-pinnacle.metrics.maxHit]

minionCount: 10

tree:
  targets:
    - minions deal increased damage
    - minions have increased attack speed
    - minions have increased maximum life
    - increased maximum life
    - increased skill effect duration
    - increased fire damage

# Steps (PLAN-BUILDS.md §9.3). Each step is read and measured at its `level`;
# the pre-refactor checkpoints survive as `aliases`, so old links still land.
steps:
  leveling:
    sub:
      - id: leveling-1-12
        level: 12
        main: Summon Raging Spirit
        measure: true
        aliases: [until-12]
        gems:
          - slot: Body Armour
            gems:
              - Summon Raging Spirit
              - Minion Damage
              - Added Fire Damage
          - slot: Weapon 1
            gems:
              - Flame Dash
              - Arcane Surge
          - slot: Helmet
            gems:
              - Clarity
          - slot: Boots
            gems:
              - Raise Zombie
        flasks:
          - slot: life
            name: Medium Life Flask
            note: Small until level 3.
          - slot: mana
            name: Small Mana Flask
            note: Spirits are expensive early.
          - slot: utility
            name: Quicksilver Flask
            note: Act 2 quest reward.
      - id: leveling-12-28
        level: 28
        main: Summon Raging Spirit
        trigger: { from: 12 }
        measure: true
        aliases: [until-28]
        gems:
          - slot: Body Armour
            gems:
              - Summon Raging Spirit
              - Minion Damage
              - Melee Physical Damage
              - Minion Speed
          - slot: Weapon 1
            gems:
              - Flesh Offering
              - Desecrate
          - slot: Helmet
            gems:
              - Clarity
              - Convocation
          - slot: Boots
            gems:
              - Flame Dash
              - Arcane Surge
        flasks:
          - slot: life
            name: Giant Life Flask
            note: Drops from level 24.
          - slot: mana
            name: Greater Mana Flask
            note: Drops from level 12.
          - slot: utility
            name: Amethyst Flask
            note: Chaos resistance.
          - slot: utility
            name: Quicksilver Flask
            note: Movement.
      - id: leveling-38-68
        level: 68
        main: Summon Raging Spirit
        trigger: { from: 28 }
        measure: true
        aliases: [until-68]
        gems:
          - slot: Body Armour
            gems:
              - Summon Raging Spirit
              - Minion Damage
              - Melee Physical Damage
              - Multistrike
              - Feeding Frenzy
              - Minion Speed
          - slot: Weapon 1
            gems:
              - Flesh Offering
              - Generosity
          - slot: Helmet
            gems:
              - Desecrate
          - slot: Gloves
            gems:
              - name: Cast when Damage Taken
                maxLevel: 5
                note: Level 1-5 only.
              - Immortal Call
          - slot: Boots
            gems:
              - Flame Dash
              - Arcane Surge
        flasks:
          - slot: life
            name: Divine Life Flask
            note: Instant prefix.
          - slot: mana
            name: Hallowed Mana Flask
            note: Drops from level 42.
          - slot: utility
            name: Quartz Flask
            note: Phasing.
          - slot: utility
            name: Amethyst Flask
            note: Chaos resistance.
          - slot: utility
            name: Quicksilver Flask
            note: Movement.
  maps:
    sub:
      - id: maps-white
        level: 80
        main: Summon Raging Spirit
        trigger: { from: 68 }
        measure: true
        aliases: [maps-early]
        gems: &id001
          - slot: Body Armour
            gems:
              - Summon Raging Spirit
              - Minion Damage
              - Melee Physical Damage
              - Multistrike
              - Feeding Frenzy
              - Minion Life
          - slot: Weapon 1
            gems:
              - Flesh Offering
              - Generosity
          - slot: Helmet
            gems:
              - Desecrate
          - slot: Gloves
            gems:
              - name: Cast when Damage Taken
                maxLevel: 5
                note: Level 1-5 only.
              - Immortal Call
          - slot: Boots
            gems:
              - Flame Dash
              - Arcane Surge
        flasks: &id002
          - slot: life
            name: Divine Life Flask
            note: Keep the instant prefix.
          - slot: mana
            name: Eternal Mana Flask
            note: Drops from level 65.
          - slot: utility
            name: Quartz Flask
            note: Phasing.
          - slot: utility
            name: Amethyst Flask
            note: Chaos resistance.
          - slot: utility
            name: Quicksilver Flask
            note: Movement.
      - id: maps-red
        level: 90
        main: Summon Raging Spirit
        trigger: { from: 80 }
        measure: true
        gems: *id001
        flasks: *id002
  endgame:
    sub:
      - id: endgame-pinnacle
        level: 96
        main: Summon Raging Spirit
        trigger: { from: 90 }
        measure: true
        aliases: [pinnacle]
        gems: *id001
        flasks: *id002

ascendancyOrder:
  - { node: mindless-aggression, lab: 1 }
  - { node: commander-of-darkness, lab: 2 }
  - { node: mistress-of-sacrifice, lab: 3 }
  - { node: bone-barrier, lab: 4 }

bandit: kill-all
