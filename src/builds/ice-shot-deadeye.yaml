schemaVersion: 1
season: covens
wickerman:
  profile: cold-bow
stepPlan: ice-shot
id: ice-shot-deadeye
name: Ice Shot Deadeye
class: Ranger
ascendancyId: deadeye
family: bow
mainSkill: Ice Shot
summary: >-
  Cold bow build with the same league-start shell as Lightning Arrow. Ice Shot
  converts physical damage to cold, freezes the first pack, and turns a rare
  bow into the main damage slot. No required unique.

pros:
  - { weight: 3, text: "Fast freeze clear" }
  - { weight: 3, text: "No required unique" }
  - { weight: 2, text: "Freeze is defence" }
  - { weight: 2, text: "Scales into red maps" }
  - { weight: 1, text: "Safe ranged play" }

cons:
  - { weight: 3, text: "Evasion can fail" }
  - { weight: 3, text: "Needs single-target investment" }
  - { weight: 2, text: "Expensive crit gear" }
  - { weight: 2, text: "Cold penetration costs" }
  - { weight: 1, text: "Mana issues while leveling" }

ratings:
  tankiness: 4
  singleTarget: 7
  clear: 10
  cost: 7

guide:
  summary:
    text: >-
      Ice Shot Deadeye is a cold bow build that measures
      {{gates.maps-red.metrics.dps|dps}} at red maps and {{gates.endgame-pinnacle.metrics.dps|dps}} at
      pinnacle. Freeze is the defensive layer, the rare bow is the damage slot,
      and no unique is required.
    facts: [mainSkill, ascendancyId, gates.maps-red.metrics.dps, gates.endgame-pinnacle.metrics.dps]
    signed: { by: "maintainer", at: "2026-11-27T00:00:00Z" }
  leveling:
    text: >-
      Level with Ice Shot and added cold, then add the critical supports as
      they unlock. The first checkpoint measures {{gates.leveling-1-12.metrics.life|int}}
      life and {{gates.leveling-1-12.metrics.dps|dps}} damage; the second measures
      {{gates.leveling-12-28.metrics.dps|dps}}. Keep a mana flask until leech and reduced cost
      are online.
    facts: [gates.leveling-1-12.metrics.life, gates.leveling-1-12.metrics.dps, gates.leveling-12-28.metrics.dps]
  maps:
    text: >-
      At red maps the build measures {{gates.maps-red.metrics.dps|dps}} damage,
      {{gates.maps-red.metrics.ehp|int}} effective life and
      {{gates.maps-red.metrics.maxHit|int}} physical max hit. Freeze the first pack,
      keep the bow current, and cap the elemental resistances.
    facts: [gates.maps-red.metrics.dps, gates.maps-red.metrics.ehp, gates.maps-red.metrics.maxHit]
  bossing:
    text: >-
      Pinnacle measures {{gates.endgame-pinnacle.metrics.dps|dps}} damage with
      {{gates.endgame-pinnacle.metrics.ehp|int}} effective life and
      {{gates.endgame-pinnacle.metrics.maxHit|int}} physical max hit. Keep the mark up and fire
      from outside the boss's slam range; the freeze is a bonus, not a plan.
    facts: [gates.endgame-pinnacle.metrics.dps, gates.endgame-pinnacle.metrics.ehp, gates.endgame-pinnacle.metrics.maxHit]

gearProfile: bow

tree:
  targets:
    - increased cold damage
    - increased damage with bows
    - increased projectile damage
    - increased maximum life
    - increased attack speed
    - increased critical strike chance
    - critical strike multiplier
    - increased elemental damage

# Steps (PLAN-BUILDS.md §9.3). Each step is read and measured at its `level`;
# the pre-refactor checkpoints survive as `aliases`, so old links still land.
steps:
  leveling:
    sub:
      - id: leveling-1-12
        level: 12
        main: Ice Shot
        measure: true
        gems:
          - slot: Body Armour
            gems:
              - Ice Shot
              - Added Cold Damage
              - Faster Attacks
          - slot: Weapon 1
            gems:
              - Sniper's Mark
              - Flame Dash
          - slot: Helmet
            gems:
              - Precision
          - slot: Boots
            gems:
              - Clarity
        flasks:
          - slot: life
            name: Medium Life Flask
            note: Small until level 3, then medium.
          - slot: mana
            name: Small Mana Flask
            note: Ice Shot is mana-hungry before leech.
          - slot: utility
            name: Quicksilver Flask
            note: Act 2 quest reward.
      - id: leveling-12-28
        level: 28
        main: Ice Shot
        trigger: { from: 12 }
        measure: true
        gems:
          - slot: Body Armour
            gems:
              - Ice Shot
              - Added Cold Damage
              - Faster Attacks
              - Increased Critical Strikes
          - slot: Weapon 1
            gems:
              - Sniper's Mark
              - Herald of Ice
          - slot: Helmet
            gems:
              - Precision
              - Hatred
          - slot: Boots
            gems:
              - Grace
        flasks:
          - slot: life
            name: Giant Life Flask
            note: Drops from level 24.
          - slot: mana
            name: Greater Mana Flask
            note: Drops from level 12.
          - slot: utility
            name: Diamond Flask
            note: Lucky crits, from level 27.
          - slot: utility
            name: Quicksilver Flask
            note: Movement, not damage.
          - slot: utility
            name: Amethyst Flask
            note: Chaos resistance from level 18.
      - id: leveling-28-38
        level: 38
        main: Ice Shot
        trigger: { from: 28 }
        points: 42
        measure: true
        watch: >-
          Elemental Damage with Attacks replaces Faster Attacks in the four-link. Grace, Flame
          Dash and Cast when Damage Taken with Immortal Call come online; the fifth link waits for
          68 and the sixth for red maps.
        gems:
          - slot: Body Armour
            gems:
              - Ice Shot
              - Added Cold Damage
              - Elemental Damage with Attacks
              - Increased Critical Strikes
          - slot: Weapon 1
            gems:
              - Sniper's Mark
              - Herald of Ice
          - slot: Helmet
            gems:
              - Grace
              - Precision
          - slot: Gloves
            gems:
              - name: Cast when Damage Taken
                maxLevel: 5
                note: Level 1-5 only.
              - Immortal Call
          - slot: Boots
            gems:
              - Flame Dash
        flasks:
          - slot: life
            name: Giant Life Flask
            note: Drops from level 24.
          - slot: mana
            name: Greater Mana Flask
            note: Drops from level 12.
          - slot: utility
            name: Diamond Flask
            note: Lucky crits, from level 27.
          - slot: utility
            name: Quicksilver Flask
            note: Movement, not damage.
          - slot: utility
            name: Amethyst Flask
            note: Chaos resistance from level 18.
      - id: leveling-38-68
        level: 68
        main: Ice Shot
        trigger: { from: 38, link: 5 }
        measure: true
        gems:
          - slot: Body Armour
            gems:
              - Ice Shot
              - Added Cold Damage
              - Elemental Damage with Attacks
              - Increased Critical Strikes
              - Faster Attacks
          - slot: Weapon 1
            gems:
              - Sniper's Mark
              - Herald of Ice
          - slot: Helmet
            gems:
              - Grace
              - Precision
          - slot: Gloves
            gems:
              - name: Cast when Damage Taken
                maxLevel: 5
                note: Level 1-5 only.
              - Immortal Call
          - slot: Boots
            gems:
              - Flame Dash
        flasks:
          - slot: life
            name: Divine Life Flask
            note: Instant prefix.
          - slot: mana
            name: Hallowed Mana Flask
            note: Drops from level 42.
          - slot: utility
            name: Diamond Flask
            note: Lucky crits.
          - slot: utility
            name: Silver Flask
            note: Onslaught.
          - slot: utility
            name: Quartz Flask
            note: Phasing.
  maps:
    sub:
      - id: maps-white
        level: 80
        main: Ice Shot
        trigger: { from: 68 }
        measure: true
        gems:
          - slot: Body Armour
            gems:
              - Ice Shot
              - Added Cold Damage
              - Elemental Damage with Attacks
              - Increased Critical Strikes
              - Increased Critical Damage
          - slot: Weapon 1
            gems:
