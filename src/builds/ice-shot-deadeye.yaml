        level: 96
        main: Ice Shot
        trigger: { from: 90 }
        measure: true
        gems:
          - slot: Body Armour
            gems:
              - Ice Shot
              - Added Cold Damage
              - Elemental Damage with Attacks
              - Increased Critical Strikes
              - Increased Critical Damage
              - Faster Attacks
          - slot: Weapon 1
