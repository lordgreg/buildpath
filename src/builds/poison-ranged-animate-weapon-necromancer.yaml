schemaVersion: 1
season: covens
wickerman:
  profile: minion
stepPlan: poison-animate-weapon
id: poison-ranged-animate-weapon-necromancer
name: Poison Ranged Animate Weapons
class: Witch
ascendancyId: necromancer
family: minion
mainSkill: Animate Weapon of Ranged Arms
flagship: false
gateProfile: dad
summary: >-
  Animate Weapon of Ranged Arms turns dropped ranged weapons into a poison
  firing line: each animated bow keeps shooting while you move, and the
  Necromancer shell keeps the swarm alive. The build needs no unique, only
  weapons on the ground and a Necromancer to command them.

pros:
  - { weight: 3, text: "Weapons fire while you move" }
  - { weight: 3, text: "Poison keeps ticking" }
  - { weight: 2, text: "Minion scaling, not gear" }
  - { weight: 2, text: "No required unique" }
  - { weight: 1, text: "Safer than melee minions" }

cons:
  - { weight: 3, text: "Needs ranged weapons" }
  - { weight: 3, text: "Weapons expire" }
  - { weight: 2, text: "Poison needs ramp" }
  - { weight: 2, text: "Minion AI" }
  - { weight: 1, text: "Slow clear" }

ratings:
  tankiness: 6
  singleTarget: 8
  clear: 7
  cost: 8

gearProfile: bow
minionCount: 8

tree:
  targets:
    - minions deal increased damage
    - minions have increased attack speed
    - minion damage
    - increased skill effect duration
    - minions have increased maximum life
    - increased maximum life

# Steps (PLAN-BUILDS.md §9.3). Each step is read and measured at its `level`;
# the pre-refactor checkpoints survive as `aliases`, so old links still land.
steps:
  leveling:
    sub:
      - id: leveling-1-12
        level: 12
        main: Animate Weapon
        measure: true
        gems:
          - slot: Body Armour
            gems:
              - Animate Weapon
              - Minion Damage
              - Chance to Poison
          - slot: Weapon 1
            gems:
              - Summon Skeletons
          - slot: Helmet
            gems:
              - Clarity
          - slot: Boots
            gems:
              - Flame Dash
              - Arcane Surge
        flasks:
          - slot: life
            name: Medium Life Flask
            note: Small until level 3.
          - slot: mana
            name: Small Mana Flask
            note: Animating is expensive early.
          - slot: utility
            name: Quicksilver Flask
            note: Act 2 quest reward.
      - id: leveling-12-28
        level: 28
        main: Animate Weapon
        trigger: { from: 12 }
        measure: true
        gems:
          - slot: Body Armour
            gems:
              - Animate Weapon
              - Minion Damage
              - Chance to Poison
              - Minion Speed
          - slot: Weapon 1
            gems:
              - Flesh Offering
              - Desecrate
          - slot: Shield
            gems:
              - Determination
              - Clarity
          - slot: Boots
            gems:
              - Flame Dash
              - Arcane Surge
        flasks:
          - slot: life
            name: Giant Life Flask
            note: Drops from level 24.
          - slot: mana
            name: Greater Mana Flask
            note: Drops from level 12.
          - slot: utility
            name: Amethyst Flask
            note: Chaos resistance from level 18.
          - slot: utility
            name: Quicksilver Flask
            note: Movement, not damage.
      - id: leveling-28-38
        level: 38
        main: Animate Weapon
        trigger: { from: 28 }
        points: 42
        measure: true
        watch: >-
          Vile Toxins replaces Minion Speed in the four-link. Cast when Damage Taken with Immortal
          Call comes online; the fifth link waits for 68 and the sixth for red maps.
        gems:
          - slot: Body Armour
            gems:
              - Animate Weapon
              - Minion Damage
              - Chance to Poison
              - Vile Toxins
          - slot: Weapon 1
            gems:
              - Flesh Offering
              - Desecrate
          - slot: Shield
            gems:
              - Determination
              - Clarity
          - slot: Gloves
            gems:
              - name: Cast when Damage Taken
                maxLevel: 5
                note: 'Level 1-5 only: higher levels need bigger hits before it triggers.'
              - Immortal Call
          - slot: Boots
            gems:
              - Flame Dash
              - Arcane Surge
        flasks:
          - slot: life
            name: Giant Life Flask
            note: Drops from level 24.
          - slot: mana
            name: Greater Mana Flask
            note: Drops from level 12.
          - slot: utility
            name: Amethyst Flask
            note: Chaos resistance from level 18.
          - slot: utility
            name: Quicksilver Flask
            note: Movement, not damage.
      - id: leveling-38-68
        level: 68
        main: Animate Weapon
        trigger: { from: 38, link: 5 }
        measure: true
        gems:
          - slot: Body Armour
            gems:
              - Animate Weapon
              - Minion Damage
              - Chance to Poison
              - Vile Toxins
              - Deadly Ailments
          - slot: Weapon 1
            gems:
              - Flesh Offering
              - Desecrate
          - slot: Shield
            gems:
              - Determination
              - Clarity
          - slot: Gloves
            gems:
              - name: Cast when Damage Taken
                maxLevel: 5
                note: 'Level 1-5 only: higher levels need bigger hits before it triggers.'
              - Immortal Call
          - slot: Boots
            gems:
              - Flame Dash
              - Arcane Surge
        flasks:
          - slot: life
            name: Divine Life Flask
            note: Drops from level 60; instant prefix.
          - slot: mana
            name: Hallowed Mana Flask
            note: Drops from level 42.
          - slot: utility
            name: Granite Flask
            note: Armour against physical hits.
          - slot: utility
            name: Quartz Flask
            note: Phasing through your own minions.
          - slot: utility
            name: Amethyst Flask
            note: Chaos resistance until it is capped.
  maps:
    sub:
      - id: maps-white
        level: 80
        main: Animate Weapon
        trigger: { from: 68 }
        measure: true
        gems:
          - slot: Body Armour
            gems:
              - Animate Weapon
              - Minion Damage
              - Chance to Poison
              - Vile Toxins
              - Deadly Ailments
          - slot: Weapon 1
            gems:
              - Flesh Offering
              - Desecrate
          - slot: Shield
            gems:
              - Determination
              - Clarity
          - slot: Gloves
            gems:
              - name: Cast when Damage Taken
                maxLevel: 5
                note: 'Level 1-5 only: higher levels need bigger hits before it triggers.'
              - Immortal Call
          - slot: Boots
            gems:
              - Flame Dash
              - Arcane Surge
        flasks:
          - slot: life
            name: Divine Life Flask
            note: Instant prefix.
          - slot: mana
            name: Hallowed Mana Flask
            note: Drops from level 42.
          - slot: utility
            name: Granite Flask
            note: Armour against physical hits.
          - slot: utility
            name: Quartz Flask
            note: Phasing through your own minions.
          - slot: utility
            name: Amethyst Flask
            note: Chaos resistance until it is capped.
      - id: maps-red
        level: 90
        main: Animate Weapon of Ranged Arms
        trigger: { from: 80, skill: Animate Weapon of Ranged Arms }
        measure: true
        gems: &id001
          - slot: Body Armour
            gems:
              - Animate Weapon of Ranged Arms
              - Minion Damage
              - Chance to Poison
              - Vile Toxins
              - Deadly Ailments
              - Unbound Ailments
          - slot: Weapon 1
            gems:
              - Flesh Offering
              - Desecrate
          - slot: Shield
            gems:
              - Determination
              - Clarity
          - slot: Gloves
            gems:
              - name: Cast when Damage Taken
                maxLevel: 5
                note: 'Level 1-5 only: higher levels need bigger hits before it triggers.'
              - Immortal Call
          - slot: Boots
            gems:
              - Flame Dash
              - Arcane Surge
        flasks: &id002
          - slot: life
            name: Divine Life Flask
            note: Keep the instant prefix.
          - slot: mana
            name: Eternal Mana Flask
            note: Drops from level 65.
          - slot: utility
            name: Granite Flask
            note: Armour against physical hits.
          - slot: utility
            name: Quartz Flask
            note: Phasing through your own minions.
          - slot: utility
            name: Amethyst Flask
            note: Chaos resistance for pinnacle bosses.
  endgame:
    sub:
      - id: endgame-pinnacle
        level: 96
        main: Animate Weapon of Ranged Arms
        trigger: { from: 90 }
        measure: true
        gems: *id001
        flasks: *id002

ascendancyOrder:
  - { node: mindless-aggression, lab: 1 }
  - { node: unnatural-strength, lab: 2 }
  - { node: plaguebringer, lab: 3 }
  - { node: commander-of-darkness, lab: 4 }

bandit: kill-all
pantheon:
  major: lunaris
  minor: gruthkul
  note: Gruthkul reduces the physical hits that catch a summoner in a bad position.
uniques:
  core: []
  optional: []

guide:
  summary:
    text: >-
      Poison Ranged Animate Weapons measure {{gates.maps-red.metrics.dps|dps}} at
      red maps and {{gates.endgame-pinnacle.metrics.dps|dps}} at pinnacle. The animated
      bows poison from range while you position, and the build needs no unique.
    facts: [mainSkill, ascendancyId, gates.maps-red.metrics.dps, gates.endgame-pinnacle.metrics.dps]
  leveling:
    text: >-
      Level the melee Animate Weapon through the campaign and into white maps.
      Animate Weapon of Ranged Arms is transfigured, so it only arrives from the
      Divine Font or from trade, and the guide recommends the swap only then.
      The first checkpoint measures {{gates.leveling-1-12.metrics.life|int}} life and
      {{gates.leveling-1-12.metrics.dps|dps}} damage; the second measures
      {{gates.leveling-12-28.metrics.dps|dps}}.
    facts: [gates.leveling-1-12.metrics.life, gates.leveling-1-12.metrics.dps, gates.leveling-12-28.metrics.dps]
  maps:
    text: >-
      At red maps the build measures {{gates.maps-red.metrics.dps|dps}} damage,
      {{gates.maps-red.metrics.ehp|int}} effective life and
      {{gates.maps-red.metrics.maxHit|int}} physical max hit. Animate the first
      pack's bows, then keep the swarm moving with Flesh Offering.
    facts: [gates.maps-red.metrics.dps, gates.maps-red.metrics.ehp, gates.maps-red.metrics.maxHit]
  bossing:
    text: >-
      Pinnacle measures {{gates.endgame-pinnacle.metrics.dps|dps}} damage with
      {{gates.endgame-pinnacle.metrics.ehp|int}} effective life and
      {{gates.endgame-pinnacle.metrics.maxHit|int}} physical max hit. Stack the bows
      before the burst, refresh Flesh Offering, and recast Animate Weapon when
      the oldest ones expire.
    facts: [gates.endgame-pinnacle.metrics.dps, gates.endgame-pinnacle.metrics.ehp, gates.endgame-pinnacle.metrics.maxHit]
changelog:
  - season: covens
    date: "2026-11-26"
    notes:
      - "First guide for the Covens league."
  - season: covens
    date: "2026-11-27"
    notes:
      - "A 28-38 step now shows the four-link and the gems that unlock at 38; the fifth link waits for 68 and the sixth for red maps."
