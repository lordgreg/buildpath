schemaVersion: 1
id: summon-skeletons-necromancer
name: Summon Skeletons Necromancer
class: Witch
ascendancyId: necromancer
family: minion
mainSkill: Summon Skeletons
summary: >-
  League-start minion build. Skeletons do the damage, so a bad weapon is not a
  brick: cap your resistances, keep your minions alive, and the damage arrives
  with the gem levels. No required uniques, which is why it is the first build
  the pipeline proves.

leveling:
  brackets:
    - until: 12
      skills:
        - Raise Zombie
        - Summon Skeletons
    - until: 28
      skills:
        - Summon Skeletons
        - Summon Raging Spirit
        - Raise Zombie
    - until: 68
      skills:
        - Summon Skeletons
        - Summon Raging Spirit
        - Flesh Offering
    - until: 100
      skills:
        - Summon Skeletons
        - Flesh Offering
        - Desecrate

minionCount: 6

tree:
  targets:
    - minions deal increased damage
    - minions deal
    - minion damage
    - minions have increased attack speed
    - maximum life

skillGroups:
  - slot: Weapon 1
    gems:
      - Flesh Offering
      - Generosity
  - slot: Shield
    gems:
      - Clarity
      - Convocation
  - slot: Helmet
    gems:
      - Desecrate
  - slot: Gloves
    gems:
      - Cast when Damage Taken
      - Immortal Call
  - slot: Boots
    gems:
      - Flame Dash
      - Faster Casting
      - Arcane Surge
  - slot: Body Armour
    gems:
      - Summon Skeletons
      - Minion Damage
      - Multistrike
      - Melee Physical Damage
      - Brutality
      - Feeding Frenzy

ascendancyOrder:
  - node: mindless-aggression
    lab: 1
  - node: unnatural-strength
    lab: 2
  - node: mistress-of-sacrifice
    lab: 3
  - node: commander-of-darkness
    lab: 4

flasks:
  leveling:
    - { slot: life, name: "Small Life Flask", note: "Whatever drops. Replace it as it falls behind, do not reroll it." }
    - { slot: utility, name: "Small Mana Flask", note: "You will need it: skeletons are expensive early." }
    - { slot: utility, name: "Quicksilver Flask", note: "Act 2 quest reward. Until then, walk." }
  maps:
    - { slot: life, name: "Divine Life Flask", note: "Instant recovery on the prefix." }
    - { slot: utility, name: "Quicksilver Flask", note: "Adrenaline suffix when you can craft it." }
    - { slot: utility, name: "Granite Flask", note: "Armour against physical hits." }
    - { slot: utility, name: "Amethyst Flask", note: "Chaos resistance while it is short." }
    - { slot: utility, name: "Quartz Flask", note: "Phasing, so your minions block the doorway instead of you." }
  endgame:
    - { slot: life, name: "Divine Life Flask", note: "Keep the instant prefix." }
    - { slot: utility, name: "Quicksilver Flask", note: "Adrenaline." }
    - { slot: utility, name: "Granite Flask", note: "Iron Skin suffix." }
    - { slot: utility, name: "Jade Flask", note: "Evasion against attack-based bosses." }
    - { slot: utility, name: "Amethyst Flask", note: "Swap for a damage flask once chaos resistance is capped." }

bandit: kill-all

pantheon:
  major: lunaris
  minor: gruthkul
  note: Swap the major to Solaris for pinnacle bosses with physical slams.

uniques:
  core: []
  optional: []
