schemaVersion: 1
id: summon-skeletons-necromancer
name: Summon Skeletons Necromancer
class: Witch
ascendancyId: necromancer
family: minion
mainSkill: Summon Skeletons
summary: >-
  League-start minion build. Skeletons do the damage, so a bad weapon is not a
  brick: cap your resistances, keep your minions alive, and the damage arrives
  with the gem levels. No required uniques, which is why it is the first build
  the pipeline proves.

minionCount: 6

tree:
  targets:
    - minions deal increased damage
    - minions deal
    - minion damage
    - minions have increased attack speed
    - maximum life

leveling:
  brackets:
    - until: 12
      skills:
        - Raise Zombie
        - Summon Skeletons
      skillGroups:
        - slot: Body Armour
          gems:
            - Summon Skeletons
            - Minion Damage
        - slot: Weapon 1
          gems:
            - Summon Raging Spirit
        - slot: Shield
          gems:
            - Clarity
        - slot: Helmet
          gems:
            - Flesh Offering
        - slot: Gloves
          gems:
            - Raise Zombie
        - slot: Boots
          gems:
            - Flame Dash
            - Arcane Surge
      flasks:
        - { slot: life, name: "Medium Life Flask", note: "Small until level 3, then medium." }
        - { slot: mana, name: "Small Mana Flask", note: "Skeletons are expensive early." }
        - { slot: utility, name: "Quicksilver Flask", note: "Act 2 quest reward." }

    - until: 28
      skills:
        - Summon Skeletons
        - Summon Raging Spirit
        - Flesh Offering
      skillGroups:
        - slot: Body Armour
          gems:
            - Summon Skeletons
            - Minion Damage
            - Melee Physical Damage
            - Minion Speed
        - slot: Weapon 1
          gems:
            - Flesh Offering
            - Desecrate
        - slot: Helmet
          gems:
            - Summon Raging Spirit
        - slot: Gloves
          gems:
            - Raise Zombie
        - slot: Shield
          gems:
            - Clarity
            - Convocation
        - slot: Boots
          gems:
            - Flame Dash
            - Faster Casting
            - Arcane Surge
      flasks:
        - { slot: life, name: "Giant Life Flask", note: "Drops from level 24; medium is too small by now." }
        - { slot: mana, name: "Greater Mana Flask", note: "Drops from level 12." }
        - { slot: utility, name: "Amethyst Flask", note: "Chaos resistance from level 18." }
        - { slot: utility, name: "Quicksilver Flask", note: "Movement, not damage." }

    - until: 68
      skills:
        - Summon Skeletons
        - Flesh Offering
        - Desecrate
      skillGroups:
        - slot: Body Armour
          gems:
            - Summon Skeletons
            - Minion Damage
            - Multistrike
            - Melee Physical Damage
            - Brutality
            - Feeding Frenzy
        - slot: Weapon 1
          gems:
            - Flesh Offering
            - Generosity
        - slot: Shield
          gems:
            - Clarity
            - Convocation
        - slot: Helmet
          gems:
            - Desecrate
        - slot: Gloves
          gems:
            - { name: Cast when Damage Taken, maxLevel: 5, note: "Level 1-5 only: higher levels need bigger hits before it triggers." }
            - Immortal Call
        - slot: Boots
          gems:
            - Flame Dash
            - Faster Casting
            - Arcane Surge
      flasks:
        - { slot: life, name: "Divine Life Flask", note: "Drops from level 60; instant prefix." }
        - { slot: mana, name: "Hallowed Mana Flask", note: "Drops from level 42." }
        - { slot: utility, name: "Granite Flask", note: "Armour against physical hits." }
        - { slot: utility, name: "Quartz Flask", note: "Phasing through your own minions." }
        - { slot: utility, name: "Amethyst Flask", note: "Chaos resistance until it is capped." }

    - until: 100
      skills:
        - Summon Skeletons
        - Flesh Offering
        - Desecrate
      skillGroups:
        - slot: Body Armour
          gems:
            - Summon Skeletons
            - Minion Damage
            - Multistrike
            - Melee Physical Damage
            - Brutality
            - Feeding Frenzy
        - slot: Weapon 1
          gems:
            - Flesh Offering
            - Generosity
        - slot: Shield
          gems:
            - Clarity
            - Convocation
        - slot: Helmet
          gems:
            - Desecrate
        - slot: Gloves
          gems:
            - { name: Cast when Damage Taken, maxLevel: 5, note: "Level 1-5 only: higher levels need bigger hits before it triggers." }
            - Immortal Call
        - slot: Boots
          gems:
            - Flame Dash
            - Faster Casting
            - Arcane Surge
      flasks:
        - { slot: life, name: "Divine Life Flask", note: "Keep the instant prefix." }
        - { slot: mana, name: "Eternal Mana Flask", note: "Drops from level 65." }
        - { slot: utility, name: "Granite Flask", note: "Iron Skin suffix." }
        - { slot: utility, name: "Jade Flask", note: "Evasion against attack-based bosses." }
        - { slot: utility, name: "Amethyst Flask", note: "Swap for a damage flask once chaos is capped." }

ascendancyOrder:
  - node: mindless-aggression
    lab: 1
  - node: unnatural-strength
    lab: 2
  - node: mistress-of-sacrifice
    lab: 3
  - node: commander-of-darkness
    lab: 4

bandit: kill-all

pantheon:
  major: lunaris
  minor: gruthkul
  note: Swap the major to Solaris for pinnacle bosses with physical slams.

uniques:
  core: []
  optional: []
