schemaVersion: 1
season: covens
wickerman:
  profile: minion
stepPlan: skeletons
id: summon-skeletons-necromancer
name: Summon Skeletons Necromancer
class: Witch
ascendancyId: necromancer
family: minion
mainSkill: Summon Skeletons
summary: >-
  League-start minion build. Skeletons do the damage, so a bad weapon is not a
  brick: cap your resistances, keep your minions alive, and the damage arrives
  with the gem levels. No required uniques, which is why it is the first build
  the pipeline proves.

dad: true

pros:
  - { weight: 3, text: "No required uniques; the league-start gear is the gear the guide shows." }
  - { weight: 3, text: "Cheap to start: gem levels carry damage, not an expensive weapon." }
  - { weight: 3, text: "Minions take the hits, so a mistake is usually recoverable." }
  - { weight: 2, text: "Damage scales cleanly with gem levels and minion supports." }
  - { weight: 2, text: "Good sustained damage against bosses that stay in one place." }
  - { weight: 1, text: "Gear slots are flexible; resistances and life are the only hard requirements." }
cons:
  - { weight: 3, text: "Minion AI and positioning decide fights more than your own aim." }
  - { weight: 3, text: "You are fragile when the minion wall breaks or you are caught alone." }
  - { weight: 2, text: "Clear speed is slower than a bow or a well-geared melee build." }
  - { weight: 2, text: "Offerings need corpses, so the damage rotation has setup." }
  - { weight: 2, text: "Many gems compete for slots and links." }
  - { weight: 1, text: "Leveling with skeletons is clunky before the first minion notables." }

ratings:
  tankiness: 5
  singleTarget: 9
  clear: 5
  cost: 9

guide:
  summary:
    text: >-
      Summon Skeletons Necromancer is a league-start minion build that measures
      {{gates.maps-red.metrics.dps|dps}} at red maps and {{gates.endgame-pinnacle.metrics.dps|dps}} at
      pinnacle. Gem levels and minion supports carry the damage, the skeletons
      take the hits, and no unique is required.
    facts: [mainSkill, ascendancyId, gates.maps-red.metrics.dps, gates.endgame-pinnacle.metrics.dps]
    signed: { by: maintainer, at: "2026-11-26T00:00:00Z" }
  leveling:
    text: >-
      Level with skeletons and a minion damage support, then keep the swarm
      between you and the pack. The first checkpoint measures
      {{gates.leveling-1-12.metrics.life|int}} life and {{gates.leveling-1-12.metrics.dps|dps}} damage;
      the second measures {{gates.leveling-12-28.metrics.dps|dps}}. A mana flask covers the
      expensive early summons.
    facts: [gates.leveling-1-12.metrics.life, gates.leveling-1-12.metrics.dps, gates.leveling-12-28.metrics.dps]
  maps:
    text: >-
      At red maps the build measures {{gates.maps-red.metrics.dps|dps}} damage,
      {{gates.maps-red.metrics.ehp|int}} effective life and
      {{gates.maps-red.metrics.maxHit|int}} physical max hit. Keep the skeletons
      between you and the pack, cap elemental resistances, and let the filter
      hide the rest.
    facts: [gates.maps-red.metrics.dps, gates.maps-red.metrics.ehp, gates.maps-red.metrics.maxHit]
  bossing:
    text: >-
      Pinnacle measures {{gates.endgame-pinnacle.metrics.dps|dps}} damage with
      {{gates.endgame-pinnacle.metrics.ehp|int}} effective life and
      {{gates.endgame-pinnacle.metrics.maxHit|int}} physical max hit. Refresh the skeletons
      before the burst, keep Flesh Offering up, and move when the boss turns.
    facts: [gates.endgame-pinnacle.metrics.dps, gates.endgame-pinnacle.metrics.ehp, gates.endgame-pinnacle.metrics.maxHit]

minionCount: 6

tree:
  targets:
    - minions deal increased damage
    - minions deal
    - minion damage
    - minions have increased attack speed
    - maximum life

# Steps (PLAN-BUILDS.md §9.3). Each step is read and measured at its `level`;
# the pre-refactor checkpoints survive as `aliases`, so old links still land.
steps:
  leveling:
    sub:
      - id: leveling-1-12
        level: 12
        main: Raise Zombie
        grade: B
        measure: true
        aliases: [until-12]
        gems:
          - slot: Body Armour
            gems:
              - Summon Skeletons
              - Minion Damage
          - slot: Weapon 1
            gems:
              - Summon Raging Spirit
          - slot: Shield
            gems:
              - Clarity
          - slot: Helmet
            gems:
              - Flesh Offering
          - slot: Gloves
            gems:
              - Raise Zombie
          - slot: Boots
            gems:
              - Flame Dash
              - Arcane Surge
        flasks:
          - slot: life
            name: Medium Life Flask
            note: Small until level 3, then medium.
          - slot: mana
            name: Small Mana Flask
            note: Skeletons are expensive early.
          - slot: utility
            name: Quicksilver Flask
            note: Act 2 quest reward.
      - id: leveling-12-28
        level: 28
        main: Summon Skeletons
        grade: B
        trigger: { from: 12, skill: Summon Skeletons }
        measure: true
        aliases: [until-28]
        gems:
          - slot: Body Armour
            gems:
              - Summon Skeletons
              - Minion Damage
              - Melee Physical Damage
              - Minion Speed
          - slot: Weapon 1
            gems:
              - Flesh Offering
              - Desecrate
          - slot: Helmet
            gems:
              - Summon Raging Spirit
          - slot: Gloves
            gems:
              - Raise Zombie
          - slot: Shield
            gems:
              - Clarity
              - Convocation
          - slot: Boots
            gems:
              - Flame Dash
              - Faster Casting
              - Arcane Surge
        flasks:
          - slot: life
            name: Giant Life Flask
            note: Drops from level 24; medium is too small by now.
          - slot: mana
            name: Greater Mana Flask
            note: Drops from level 12.
          - slot: utility
            name: Amethyst Flask
            note: Chaos resistance from level 18.
          - slot: utility
            name: Quicksilver Flask
            note: Movement, not damage.
      - id: leveling-28-38
        level: 38
        main: Summon Skeletons
        grade: B
        trigger: { from: 28 }
        points: 42
        measure: true
        watch: >-
          Multistrike replaces Minion Speed in the four-link. Generosity, Desecrate and Cast when
          Damage Taken with Immortal Call come online; the fifth link waits for 68 and the sixth
          for red maps.
        gems:
          - slot: Body Armour
            gems:
              - Summon Skeletons
              - Minion Damage
              - Multistrike
              - Melee Physical Damage
          - slot: Weapon 1
            gems:
              - Flesh Offering
              - Generosity
          - slot: Shield
            gems:
              - Clarity
              - Convocation
          - slot: Helmet
            gems:
              - Desecrate
          - slot: Gloves
            gems:
              - name: Cast when Damage Taken
                maxLevel: 5
                note: 'Level 1-5 only: higher levels need bigger hits before it triggers.'
              - Immortal Call
          - slot: Boots
            gems:
              - Flame Dash
              - Faster Casting
              - Arcane Surge
        flasks:
          - slot: life
            name: Giant Life Flask
            note: Drops from level 24; medium is too small by now.
          - slot: mana
            name: Greater Mana Flask
            note: Drops from level 12.
          - slot: utility
            name: Amethyst Flask
            note: Chaos resistance from level 18.
          - slot: utility
            name: Quicksilver Flask
            note: Movement, not damage.
      - id: leveling-38-68
        level: 68
        main: Summon Skeletons
        grade: B
        trigger: { from: 38, link: 5 }
        measure: true
        aliases: [until-68]
        gems:
          - slot: Body Armour
            gems:
              - Summon Skeletons
              - Minion Damage
              - Multistrike
              - Melee Physical Damage
              - Brutality
          - slot: Weapon 1
            gems:
              - Flesh Offering
              - Generosity
          - slot: Shield
            gems:
              - Clarity
              - Convocation
          - slot: Helmet
            gems:
              - Desecrate
          - slot: Gloves
            gems:
              - name: Cast when Damage Taken
                maxLevel: 5
                note: 'Level 1-5 only: higher levels need bigger hits before it triggers.'
              - Immortal Call
          - slot: Boots
            gems:
              - Flame Dash
              - Faster Casting
              - Arcane Surge
        flasks:
          - slot: life
            name: Divine Life Flask
            note: Drops from level 60; instant prefix.
          - slot: mana
            name: Hallowed Mana Flask
            note: Drops from level 42.
          - slot: utility
            name: Granite Flask
            note: Armour against physical hits.
          - slot: utility
            name: Quartz Flask
            note: Phasing through your own minions.
          - slot: utility
            name: Amethyst Flask
            note: Chaos resistance until it is capped.
  maps:
    sub:
      - id: maps-white
        level: 80
        main: Summon Skeletons
        grade: A
        trigger: { from: 68 }
        measure: true
        aliases: [maps-early]
        gems:
          - slot: Body Armour
            gems:
              - Summon Skeletons
              - Minion Damage
              - Multistrike
              - Melee Physical Damage
              - Brutality
          - slot: Weapon 1
            gems:
              - Flesh Offering
              - Generosity
          - slot: Shield
            gems:
              - Clarity
              - Convocation
          - slot: Helmet
            gems:
              - Desecrate
          - slot: Gloves
            gems:
              - name: Cast when Damage Taken
                maxLevel: 5
                note: 'Level 1-5 only: higher levels need bigger hits before it triggers.'
              - Immortal Call
          - slot: Boots
            gems:
              - Flame Dash
              - Faster Casting
              - Arcane Surge
        flasks: &id002
          - slot: life
            name: Divine Life Flask
            note: Keep the instant prefix.
          - slot: mana
            name: Eternal Mana Flask
            note: Drops from level 65.
          - slot: utility
            name: Granite Flask
            note: Iron Skin suffix.
          - slot: utility
            name: Jade Flask
            note: Evasion against attack-based bosses.
          - slot: utility
            name: Amethyst Flask
            note: Swap for a damage flask once chaos is capped.
      - id: maps-red
        level: 90
        main: Summon Skeletons
        grade: A
        trigger: { from: 80 }
        measure: true
        gems:
          - slot: Body Armour
            gems:
              - Summon Skeletons
              - Minion Damage
              - Multistrike
              - Melee Physical Damage
              - Brutality
              - Feeding Frenzy
          - slot: Weapon 1
            gems:
              - Flesh Offering
              - Generosity
          - slot: Shield
            gems:
              - Clarity
              - Convocation
          - slot: Helmet
            gems:
              - Desecrate
          - slot: Gloves
            gems:
              - name: Cast when Damage Taken
                maxLevel: 5
                note: 'Level 1-5 only: higher levels need bigger hits before it triggers.'
              - Immortal Call
          - slot: Boots
            gems:
              - Flame Dash
              - Faster Casting
              - Arcane Surge
        flasks: *id002
  endgame:
    sub:
      - id: endgame-pinnacle
        level: 96
        main: Summon Skeletons
        grade: S
        trigger: { from: 90 }
        measure: true
        aliases: [pinnacle]
        gems:
          - slot: Body Armour
            gems:
              - Summon Skeletons
              - Minion Damage
              - Multistrike
              - Melee Physical Damage
              - Brutality
              - Feeding Frenzy
          - slot: Weapon 1
            gems:
              - Flesh Offering
              - Generosity
          - slot: Shield
            gems:
              - Clarity
              - Convocation
          - slot: Helmet
            gems:
              - Desecrate
          - slot: Gloves
            gems:
              - name: Cast when Damage Taken
                maxLevel: 5
                note: 'Level 1-5 only: higher levels need bigger hits before it triggers.'
              - Immortal Call
          - slot: Boots
            gems:
              - Flame Dash
              - Faster Casting
              - Arcane Surge
        flasks: *id002

ascendancyOrder:
  - node: mindless-aggression
    lab: 1
  - node: commander-of-darkness
    lab: 2
  - node: mistress-of-sacrifice
    lab: 3
  # Not Unnatural Strength: PoB resolves a minion with Unholy Might to an empty
  # skill list and reports 0 DPS, so a gate would measure a bug, not the build.
  - node: bone-barrier
    lab: 4

bandit: kill-all

pantheon:
  major: lunaris
  minor: gruthkul
  note: Swap the major to Solaris for pinnacle bosses with physical slams.

uniques:
  core: []
  optional: []
changelog:
  - season: covens
    date: "2026-11-26"
    notes:
      - "First guide for the Covens league."
  - season: covens
    date: "2026-11-27"
    notes:
      - "A 28-38 step now shows the four-link and the gems that unlock at 38; the fifth link waits for 68 and the sixth for red maps."
