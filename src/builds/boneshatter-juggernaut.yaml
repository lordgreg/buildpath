schemaVersion: 1
id: boneshatter-juggernaut
name: Boneshatter Juggernaut
class: Marauder
ascendancyId: juggernaut
family: melee
mainSkill: Boneshatter
summary: >-
  League-start melee build. Boneshatter trades a little life for stacks, so the
  gear is armour and resistances, the axe is a rare with attack speed, and the
  ascendancy makes the trauma survivable. No unique is required, which is what
  a strength build needs on day one of a solo league.

pros:
  - { weight: 3, text: "Very tanky: armour, endurance charges and Juggernaut recovery." }
  - { weight: 3, text: "No required unique; a rare two-handed axe is the whole damage slot." }
  - { weight: 2, text: "Strong single-target once trauma stacks are running." }
  - { weight: 2, text: "Cheap to gear because accuracy is solved by Resolute Technique." }
  - { weight: 2, text: "Trauma scaling rewards staying in the fight." }
  - { weight: 1, text: "A comfortable lab runner for the first two labyrinths." }
cons:
  - { weight: 3, text: "Trauma hurts you; mistakes and long fights tax your own life." }
  - { weight: 3, text: "Melee range means you eat mechanics a ranged build can walk away from." }
  - { weight: 2, text: "Attack speed is both damage and survival, so slow weapons feel bad." }
  - { weight: 2, text: "Clear speed is slower than a bow or a minion build." }
  - { weight: 1, text: "Mana is tight before leech and reduced cost are solved." }
  - { weight: 1, text: "Resolute Technique gives up critical strikes entirely." }

guide:
  summary:
    text: >-
      Boneshatter Juggernaut is a two-handed melee build that measures
      {{gates.maps-red.metrics.dps|dps}} at red maps and {{gates.pinnacle.metrics.dps|dps}} at
      pinnacle. The rare axe and armour carry the damage and defence, the
      ascendancy makes the trauma survivable, and no unique is required.
    facts: [mainSkill, ascendancyId, gates.maps-red.metrics.dps, gates.pinnacle.metrics.dps]
    signed: { by: maintainer, at: "2026-11-26T00:00:00Z" }
  leveling:
    text: >-
      Level with Cleave and the usual strength supports until Boneshatter is
      available, then switch to the two-handed axe. The first checkpoint
      measures {{gates.until-12.metrics.life|int}} life and
      {{gates.until-12.metrics.dps|dps}} damage; the second measures
      {{gates.until-28.metrics.dps|dps}}. Keep a life flask and a mana flask equipped
      until leech takes over.
    facts: [gates.until-12.metrics.life, gates.until-12.metrics.dps, gates.until-28.metrics.dps]
  maps:
    text: >-
      At red maps the build measures {{gates.maps-red.metrics.dps|dps}} damage,
      {{gates.maps-red.metrics.ehp|int}} effective life and
      {{gates.maps-red.metrics.maxHit|int}} physical max hit. Cap the elemental
      resistances, keep the axe current, and let the filter hide the rest.
    facts: [gates.maps-red.metrics.dps, gates.maps-red.metrics.ehp, gates.maps-red.metrics.maxHit]
  bossing:
    text: >-
      Pinnacle measures {{gates.pinnacle.metrics.dps|dps}} damage with
      {{gates.pinnacle.metrics.ehp|int}} effective life and
      {{gates.pinnacle.metrics.maxHit|int}} physical max hit. Use Enduring Cry before
      the burst and keep the trauma stacks running while you move out of the
      biggest slams.
    facts: [gates.pinnacle.metrics.dps, gates.pinnacle.metrics.ehp, gates.pinnacle.metrics.maxHit]

gearProfile: melee

# The family default is a one-hander and a shield, but Boneshatter needs an axe
# or mace and this build uses a two-hander. The filter follows the build (D15).
filter:
  slots:
    weapon:
      itemClasses: ["Two Hand Axe"]
    offhand: null

tree:
  # Resolute Technique is the SSF answer to accuracy: a strength build cannot
  # afford to miss, and the node is a short path from the Marauder start.
  keystones:
    - Resolute Technique
  targets:
    - increased physical damage
    - increased maximum life
    - increased attack speed
    - increased armour
    - increased melee damage

leveling:
  brackets:
    - until: 12
      skills:
        - Cleave
      skillGroups:
        - slot: Body Armour
          gems:
            - Cleave
            - Ruthless
            - Faster Attacks
        - slot: Weapon 1
          gems:
            - Leap Slam
            - Enduring Cry
        - slot: Helmet
          gems:
            - Decoy Totem
        - slot: Boots
          gems:
            - Blood and Sand
      flasks:
        - { slot: life, name: "Medium Life Flask", note: "Small until level 3, then medium." }
        - { slot: mana, name: "Small Mana Flask", note: "Slam attacks are mana-hungry before leech." }
        - { slot: utility, name: "Quicksilver Flask", note: "Act 2 quest reward." }

    - until: 28
      skills:
        - Boneshatter
        - Enduring Cry
      skillGroups:
        - slot: Body Armour
          gems:
            - Boneshatter
            - Melee Physical Damage
            - Close Combat
            - Faster Attacks
        - slot: Weapon 1
          gems:
            - Leap Slam
            - Enduring Cry
        - slot: Helmet
          gems:
            - Decoy Totem
            - Blood and Sand
        - slot: Boots
          gems:
            - Determination
      flasks:
        - { slot: life, name: "Giant Life Flask", note: "Drops from level 24; medium is too small by now." }
        - { slot: mana, name: "Greater Mana Flask", note: "Drops from level 12." }
        - { slot: utility, name: "Granite Flask", note: "Armour is the defensive layer." }
        - { slot: utility, name: "Basalt Flask", note: "Physical damage reduction, from level 27." }
        - { slot: utility, name: "Amethyst Flask", note: "Chaos resistance from level 18." }

    - until: 68
      skills:
        - Boneshatter
        - Enduring Cry
      skillGroups:
        - slot: Body Armour
          gems:
            - Boneshatter
            - Melee Physical Damage
            - Brutality
            - Pulverise
            - Faster Attacks
        - slot: Weapon 1
          gems:
            - Leap Slam
            - Enduring Cry
        - slot: Helmet
          gems:
            - Determination
            - Blood and Sand
        - slot: Gloves
          gems:
            - { name: Cast when Damage Taken, maxLevel: 5, note: "Level 1-5 only: higher levels need bigger hits before it triggers." }
            - Immortal Call
        - slot: Boots
          gems:
            - Decoy Totem
      flasks:
        - { slot: life, name: "Divine Life Flask", note: "Drops from level 60; instant prefix." }
        - { slot: mana, name: "Hallowed Mana Flask", note: "Drops from level 42." }
        - { slot: utility, name: "Granite Flask", note: "Iron Skin suffix once it is available." }
        - { slot: utility, name: "Basalt Flask", note: "The other half of the physical defence." }
        - { slot: utility, name: "Amethyst Flask", note: "Chaos resistance until it is capped." }

    - until: 100
      skills:
        - Boneshatter
        - Enduring Cry
      skillGroups:
        - slot: Body Armour
          gems:
            - Boneshatter
            - Melee Physical Damage
            - Brutality
            - Pulverise
            - Close Combat
            - Faster Attacks
        - slot: Weapon 1
          gems:
            - Leap Slam
            - Enduring Cry
        - slot: Helmet
          gems:
            - Determination
            - Blood and Sand
        - slot: Gloves
          gems:
            - { name: Cast when Damage Taken, maxLevel: 5, note: "Level 1-5 only: higher levels need bigger hits before it triggers." }
            - Immortal Call
        - slot: Boots
          gems:
            - Decoy Totem
      flasks:
        - { slot: life, name: "Divine Life Flask", note: "Keep the instant prefix." }
        - { slot: mana, name: "Eternal Mana Flask", note: "Drops from level 65." }
        - { slot: utility, name: "Granite Flask", note: "Iron Skin." }
        - { slot: utility, name: "Basalt Flask", note: "Physical damage reduction." }
        - { slot: utility, name: "Amethyst Flask", note: "Caps chaos resistance for pinnacle bosses." }

ascendancyOrder:
  - node: unflinching
    lab: 1
  - node: undeniable
    lab: 2
  - node: unbreakable
    lab: 3
  - node: unrelenting
    lab: 4

bandit: kill-all

pantheon:
  major: lunaris
  minor: gruthkul
  note: Gruthkul reduces physical damage taken, which is most of what kills a trauma stacker.

uniques:
  core: []
  optional: []
