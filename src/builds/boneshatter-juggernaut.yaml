schemaVersion: 1
season: covens
wickerman:
  profile: physical-melee
stepPlan: boneshatter
id: boneshatter-juggernaut
name: Boneshatter Juggernaut
class: Marauder
ascendancyId: juggernaut
family: melee
mainSkill: Boneshatter
summary: >-
  League-start melee build. Boneshatter trades a little life for stacks, so the
  gear is armour and resistances, the axe is a rare with attack speed, and the
  ascendancy makes the trauma survivable. Herald of Purity and Vulnerability turn the axe
  into damage, and no unique is required, which is what a strength build needs
  on day one of a solo league.

dad: true
# The Dad chip is a playstyle label, not a lower bar. This build is measured on
# the standard floors because a hit build can clear them; the Dad damage floor
# would hide how far the measured DPS is above the gate.
gateProfile: standard

pros:
  - { weight: 3, text: "Very tanky" }
  - { weight: 3, text: "No required unique" }
  - { weight: 2, text: "Great single target" }
  - { weight: 2, text: "Cheap to gear" }
  - { weight: 1, text: "Comfortable lab runner" }

cons:
  - { weight: 3, text: "Trauma hurts you" }
  - { weight: 3, text: "Melee range" }
  - { weight: 2, text: "Needs attack speed" }
  - { weight: 2, text: "Slow clear" }
  - { weight: 1, text: "Mana issues while leveling" }

ratings:
  # Tankiness and single target are 10s on the measured gates: both clear their
  # floors by a wide margin at every map checkpoint. Clear is 9 because
  # Pulverise plus a Melee Splash swap clears packs, but it is still slower than
  # a bow. Cost is 9: no unique, Resolute Technique and bench-craft rares; the
  # endgame axe, jewels, 21/20 gems and Perfect eldritch implicits are the real
  # bill.
  tankiness: 10
  singleTarget: 10
  clear: 9
  cost: 9

guide:
  summary:
    text: >-
      Boneshatter Juggernaut is a two-handed melee build that measures
      {{gates.maps-red.metrics.dps|dps}} at red maps and {{gates.endgame-pinnacle.metrics.dps|dps}} at
      pinnacle. The rare axe, armour rolls and Herald of Purity carry the damage, the
      ascendancy makes the trauma survivable, and no unique is required.
    facts: [mainSkill, ascendancyId, gates.maps-red.metrics.dps, gates.endgame-pinnacle.metrics.dps]
    signed: { by: "maintainer", at: "2026-11-27T00:00:00Z" }
  leveling:
    text: >-
      Level with Ground Slam and Ruthless until Sunder unlocks, then stay on
      Sunder for the measured stretch. Take Ground Slam as the Marauder reward,
      buy Ruthless after Mercy Mission, and add Added Fire when it unlocks.
      Brutality is already usable before the swap; the guide moves to
      Boneshatter at the next step, because the Sunder checkpoint is what the
      gate measures. A better two-handed axe is an upgrade, not a gate. The
      first checkpoint measures {{gates.leveling-1-12.metrics.life|int}} life and
      {{gates.leveling-1-12.metrics.dps|dps}} damage; the second measures
      {{gates.leveling-12-28.metrics.dps|dps}} with a self-cast Vulnerability. The mana
      flask covers you until the rare axe carries leech; the Silver Flask comes
      with that axe.
    facts: [gates.leveling-1-12.metrics.life, gates.leveling-1-12.metrics.dps, gates.leveling-12-28.metrics.dps]
  maps:
    text: >-
      At red maps the build measures {{gates.maps-red.metrics.dps|dps}} damage,
      {{gates.maps-red.metrics.ehp|int}} effective life and
      {{gates.maps-red.metrics.maxHit|int}} physical max hit. Herald of Purity is
      the damage aura; Vulnerability is self-cast and Cast when Damage Taken
      carries Immortal Call only, because the mana pool cannot pay both. The
      axe's mana leech keeps the quarter-full mana bar up. Cap the
      elemental resistances, keep the axe current, and swap Close Combat for
      Melee Splash when you want faster packs.
    facts: [gates.maps-red.metrics.dps, gates.maps-red.metrics.ehp, gates.maps-red.metrics.maxHit]
  bossing:
    text: >-
      Pinnacle measures {{gates.endgame-pinnacle.metrics.dps|dps}} damage with
      {{gates.endgame-pinnacle.metrics.ehp|int}} effective life and
      {{gates.endgame-pinnacle.metrics.maxHit|int}} physical max hit. Use Enduring Cry
      before the burst, keep Vulnerability up, and keep the trauma stacks running
      while you move out of the biggest slams.
    facts: [gates.endgame-pinnacle.metrics.dps, gates.endgame-pinnacle.metrics.ehp, gates.endgame-pinnacle.metrics.maxHit]

gearProfile: melee-boneshatter

# The family default is a one-hander and a shield, but Boneshatter needs an axe
# or mace and this build uses a two-hander. The filter follows the build (D15).
filter:
  slots:
    weapon:
      itemClasses: ["Two Hand Axe"]
    offhand: null

tree:
  # Resolute Technique is the SSF answer to accuracy: a strength build cannot
  # afford to miss, and the node is a short path from the Marauder start.
  keystones:
    - Resolute Technique
  # Axe-scoped patterns come first so points land on two-handed axe notables
  # instead of the one-hand and mace nodes the generic phrases also match. Life
  # and armour are weighted ahead of damage: the build is already far above the
  # damage gates, and the tankiness rating is the one that needs the margin.
  targets:
    - with axes
    - increased maximum life
    - increased physical damage
    - increased armour
    - increased attack speed
    - two handed

# Steps (PLAN-BUILDS.md §9.3). Each step is read and measured at its `level`;
# the six pre-refactor checkpoints survive as `aliases`, so an old share link
# still lands. The 28-38 stretch is the one the playtest found painful, so it is
# a step of its own with its own advice.
steps:
  leveling:
    sub:
      - id: leveling-1-12
        level: 12
        main: Ground Slam
        watch: >-
          Ground Slam with Ruthless and Added Fire Damage carries acts 1-2.
          Take Ground Slam as the Marauder reward, buy Ruthless after Mercy
          Mission, and add Added Fire at 8. Keep a mana flask, because slam
          attacks are mana-hungry before leech, and do not spend currency on a
          rare axe yet.
        measure: true
        gems:
          - slot: Body Armour
            gems:
              - Ground Slam
              - Ruthless
              - Added Fire Damage
          - slot: Weapon 1
            gems:
              - Leap Slam
              - Enduring Cry
          - slot: Helmet
            gems:
              - Decoy Totem
          - slot: Boots
            gems:
              - Blood and Sand
        flasks:
          - { slot: life, name: "Medium Life Flask", note: "Small until level 3, then medium." }
          - { slot: mana, name: "Small Mana Flask", note: "Slam attacks are mana-hungry before leech." }
          - { slot: utility, name: "Quicksilver Flask", note: "Act 2 quest reward." }

      - id: leveling-12-28
        level: 28
        main: Sunder
        trigger: { from: 12, skill: Sunder }
        watch: >-
          Sunder clears packs and hits single targets harder than Ground Slam,
          so it carries you from 12. Boneshatter unlocks at 28 but keeps the
          same four links and asks you to stand still and stack trauma, so it is
          not a damage jump until Brutality is in the link. Herald of Ash
          unlocks at 16; keep it off until the 28 step, because it reserves a
          quarter of the bar and Sunder is mana-hungry before leech. Stay on
          Sunder into the next step and do not fix the stretch with currency.
        measure: true
        gems:
          - slot: Body Armour
            gems:
              - Sunder
              - Melee Physical Damage
              - Added Fire Damage
              - Faster Attacks
          - slot: Weapon 1
            gems:
              - Leap Slam
              - Enduring Cry
          - slot: Helmet
            gems:
              - Decoy Totem
              - Blood and Sand
          - slot: Boots
            gems:
              - Determination
          - slot: Gloves
            gems:
              - { name: Vulnerability, note: "Self-cast on rares and bosses; CWDT will carry Immortal Call only." }
        flasks:
          - { slot: life, name: "Giant Life Flask", note: "Drops from level 24; medium is too small by now." }
          - { slot: mana, name: "Greater Mana Flask", note: "Drops from level 12; the magic axe cannot carry leech yet." }
          - { slot: utility, name: "Granite Flask", note: "Armour is the defensive layer." }
          - { slot: utility, name: "Basalt Flask", note: "Physical damage reduction, from level 27." }
          - { slot: utility, name: "Amethyst Flask", note: "Chaos resistance from level 18." }

      - id: leveling-28-38
        level: 38
        main: Sunder
        trigger: { from: 28 }
        # `bandFor` would inherit the level-28 budget (30 points) and draw the
        # same tree as the step before it. A level-38 character has 37 points
        # from levels alone, so the step overrides the band with the reviewed
        # 42-point budget: 37 level points plus the quest points available by
        # act 5, interpolated between until-28 (30) and until-68 (78) in
        # checkpoints.yaml. The gate thresholds stay the conservative until-28
        # floors.
        points: 42
        # The normal lab unlocks around level 33, so a level-38 character has
        # one ascendancy lab available; the band default (until-28) is zero.
        labs: 1
        watch: >-
          Stay on Sunder through 38: this step is the Sunder measurement, not a
          Boneshatter step. Brutality is already usable at 38, but the guide
          swaps at 39 when the next step opens. The four links and the missing
          rare axe are what make this stretch feel bad, so spend nothing to fix
          it and save for the axe. Cast when Damage Taken carries Immortal Call
          only: at 38 the unreserved pool is 67 mana, and Immortal Call plus
          Vulnerability would cost 109, so self-cast the curse. Herald of Ash
          and Determination are the auras here, with the mana flask paying for
          them until the axe has leech; swap Ash for Herald of Purity at 39 when
          Brutality replaces Added Fire.
        measure: true
        gems:
          - slot: Body Armour
            gems:
              - Sunder
              - Melee Physical Damage
              - Added Fire Damage
              - Faster Attacks
          - slot: Weapon 1
            gems:
              - Leap Slam
              - Enduring Cry
          - slot: Helmet
            gems:
              - { name: Herald of Ash, note: "Pre-Brutality aura; swap to Herald of Purity at 39." }
              - Determination
          - slot: Gloves
            gems:
              - { name: Cast when Damage Taken, maxLevel: 5, note: "Level 1-5 only: higher levels need bigger hits before it triggers." }
              - { name: Immortal Call, maxLevel: 7, note: "Level 7 is the highest a level-5 CWDT can support." }
          - slot: Boots
            gems:
              - Decoy Totem
              - { name: Vulnerability, note: "Self-cast on rares and bosses; CWDT cannot pay it and Immortal Call together." }
        flasks:
          - { slot: life, name: "Giant Life Flask", note: "Divine drops at 60, so the giant flask is what you have at 38." }
          - { slot: mana, name: "Greater Mana Flask", note: "The axe cannot carry leech yet, so keep this." }
          - { slot: utility, name: "Granite Flask", note: "Armour is the defensive layer." }
          - { slot: utility, name: "Basalt Flask", note: "Physical damage reduction." }
          - { slot: utility, name: "Amethyst Flask", note: "Chaos resistance." }

      - id: leveling-38-68
        level: 68
        main: Boneshatter
        trigger: { from: 38, skill: Boneshatter }
        watch: >-
          Boneshatter starts at 39, with Brutality replacing Added Fire Damage.
          The fifth link is Pulverise and it waits for 68. Herald of Purity and
          Determination are the auras; until the axe carries leech, run a mana
          flask in place of the Silver Flask and drop it once leech is online.
          CWDT carries Immortal Call only; self-cast Vulnerability on rares and
          bosses. Take the labs as they unlock: Unflinching at the normal lab,
          Unbreakable at the cruel lab.
        measure: true
        gems:
          - slot: Body Armour
            gems:
              - Boneshatter
              - Melee Physical Damage
              - Brutality
              - Pulverise
              - Faster Attacks
          - slot: Weapon 1
            gems:
              - Leap Slam
              - Enduring Cry
          - slot: Helmet
            gems:
              - Herald of Purity
              - Determination
          - slot: Gloves
            gems:
              - { name: Cast when Damage Taken, maxLevel: 5, note: "Level 1-5 only: higher levels need bigger hits before it triggers." }
              - { name: Immortal Call, maxLevel: 7, note: "Level 7 is the highest a level-5 CWDT can support." }
          - slot: Boots
            gems:
              - Decoy Totem
              - { name: Vulnerability, note: "Self-cast on rares and bosses; CWDT cannot pay it and Immortal Call together." }
        flasks:
          - { slot: life, name: "Divine Life Flask", note: "Drops from level 60; instant prefix." }
          - { slot: utility, name: "Silver Flask", note: "Onslaught is the damage flask now that leech covers mana." }
          - { slot: utility, name: "Granite Flask", note: "Iron Skin suffix once it is available." }
          - { slot: utility, name: "Basalt Flask", note: "The other half of the physical defence." }
          - { slot: utility, name: "Amethyst Flask", note: "Chaos resistance until it is capped." }

  maps:
    sub:
      - id: maps-white
        level: 80
        main: Boneshatter
        trigger: { from: 68, link: 5 }
        watch: >-
          The five-link clears white maps, so spend the first maps on the weapon
          and the resistances, not on the chest. Fit Herald of Purity with
          Determination once the axe has mana leech; before that the mana flask
          is what pays for attacks. CWDT carries Immortal Call only, so keep
          Vulnerability on a manual cast for rares and bosses.
        measure: true
        gems:
          - slot: Body Armour
            gems:
              - Boneshatter
              - Melee Physical Damage
              - Brutality
              - Pulverise
              - Faster Attacks
          - slot: Weapon 1
            gems:
              - Leap Slam
              - Enduring Cry
          - slot: Helmet
            gems:
              - Herald of Purity
              - Determination
          - slot: Gloves
            gems:
              - { name: Cast when Damage Taken, maxLevel: 5, note: "Level 1-5 only: higher levels need bigger hits before it triggers." }
              - { name: Immortal Call, maxLevel: 7, note: "Level 7 is the highest a level-5 CWDT can support." }
          - slot: Boots
            gems:
              - Decoy Totem
              - { name: Vulnerability, note: "Self-cast on rares and bosses; CWDT cannot pay it and Immortal Call together." }
        flasks:
          - { slot: life, name: "Divine Life Flask", note: "Instant prefix." }
          - { slot: utility, name: "Silver Flask", note: "Onslaught is the damage flask." }
          - { slot: utility, name: "Granite Flask", note: "Iron Skin." }
          - { slot: utility, name: "Basalt Flask", note: "Physical damage reduction." }
          - { slot: utility, name: "Amethyst Flask", note: "Chaos resistance." }

      - id: maps-yellow
        level: 85
        main: Boneshatter
        trigger: { from: 80, link: 6 }
        watch: >-
          The six-link is the only change here and red maps measure it, so do not
          buy a bad chest to get it early. Keep Close Combat for bosses and swap
          it for Melee Splash when the map is pack-heavy.
        reason: >-
          Same gear and gems as the white-map step; the six-link is measured at
          red maps, where it is the gate.
        gems:
          - slot: Body Armour
            gems:
              - Boneshatter
              - Melee Physical Damage
              - Brutality
              - Pulverise
              - Close Combat
              - Faster Attacks
          - slot: Weapon 1
            gems:
              - Leap Slam
              - Enduring Cry
          - slot: Helmet
            gems:
              - Herald of Purity
              - Determination
          - slot: Gloves
            gems:
              - { name: Cast when Damage Taken, maxLevel: 5, note: "Level 1-5 only: higher levels need bigger hits before it triggers." }
              - { name: Immortal Call, maxLevel: 7, note: "Level 7 is the highest a level-5 CWDT can support." }
          - slot: Boots
            gems:
              - Decoy Totem
              - { name: Vulnerability, note: "Self-cast on rares and bosses; CWDT cannot pay it and Immortal Call together." }
        flasks:
          - { slot: life, name: "Divine Life Flask", note: "Instant prefix." }
          - { slot: utility, name: "Silver Flask", note: "Onslaught." }
          - { slot: utility, name: "Granite Flask", note: "Iron Skin." }
          - { slot: utility, name: "Basalt Flask", note: "Physical damage reduction." }
          - { slot: utility, name: "Amethyst Flask", note: "Chaos resistance." }

      - id: maps-red
        level: 90
        main: Boneshatter
        trigger: { from: 85, budget: ssf-week1 }
        watch: >-
          The six-link, 20% quality gems and capped resistances are the red-map
          gate. Swap Close Combat for Melee Splash on pack-heavy layouts and keep
          it for bosses; Herald of Purity stays the damage aura, and
          Vulnerability is self-cast because CWDT carries Immortal Call only.
        measure: true
        gems:
          - slot: Body Armour
            gems:
              - Boneshatter
              - Melee Physical Damage
              - Brutality
              - Pulverise
              - Close Combat
              - Faster Attacks
          - slot: Weapon 1
            gems:
              - Leap Slam
              - Enduring Cry
          - slot: Helmet
            gems:
              - Herald of Purity
              - Determination
          - slot: Gloves
            gems:
              - { name: Cast when Damage Taken, maxLevel: 5, note: "Level 1-5 only: higher levels need bigger hits before it triggers." }
              - { name: Immortal Call, maxLevel: 7, note: "Level 7 is the highest a level-5 CWDT can support." }
          - slot: Boots
            gems:
              - Decoy Totem
              - { name: Vulnerability, note: "Self-cast on rares and bosses; CWDT cannot pay it and Immortal Call together." }
        flasks:
          - { slot: life, name: "Divine Life Flask", note: "Keep the instant prefix." }
          - { slot: utility, name: "Silver Flask", note: "Onslaught: attack speed and movement." }
          - { slot: utility, name: "Granite Flask", note: "Iron Skin." }
          - { slot: utility, name: "Basalt Flask", note: "Physical damage reduction." }
          - { slot: utility, name: "Amethyst Flask", note: "Caps chaos resistance for pinnacle bosses." }

  endgame:
    sub:
      - id: endgame-pinnacle
        level: 96
        main: Boneshatter
        trigger: { from: 90, budget: trade }
        watch: >-
          Cap chaos resistance and keep the trauma stacks running while you move
          out of the biggest slams. Enduring Cry before the burst; keep
          Vulnerability on a manual cast for the burst, and keep mana leech on
          the weapon because it is the last big purchase.
        measure: true
        gems:
          - slot: Body Armour
            gems:
              - Boneshatter
              - Melee Physical Damage
              - Brutality
              - Pulverise
              - Close Combat
              - Faster Attacks
          - slot: Weapon 1
            gems:
              - Leap Slam
              - Enduring Cry
          - slot: Helmet
            gems:
              - Herald of Purity
              - Determination
          - slot: Gloves
            gems:
              - { name: Cast when Damage Taken, maxLevel: 5, note: "Level 1-5 only: higher levels need bigger hits before it triggers." }
              - { name: Immortal Call, maxLevel: 7, note: "Level 7 is the highest a level-5 CWDT can support." }
          - slot: Boots
            gems:
              - Decoy Totem
              - { name: Vulnerability, note: "Self-cast on rares and bosses; CWDT cannot pay it and Immortal Call together." }
        flasks:
          - { slot: life, name: "Divine Life Flask", note: "Keep the instant prefix." }
          - { slot: utility, name: "Silver Flask", note: "Onslaught: attack speed and movement." }
          - { slot: utility, name: "Granite Flask", note: "Iron Skin." }
          - { slot: utility, name: "Basalt Flask", note: "Physical damage reduction." }
          - { slot: utility, name: "Amethyst Flask", note: "Caps chaos resistance for pinnacle bosses." }

ascendancyOrder:
  # Unflinching is the normal-lab step; Unbreakable is the cruel-lab step.
  # Undeniable still earns its point through attack speed, not accuracy,
  # because Resolute Technique makes the accuracy half irrelevant.
  - node: unflinching
    lab: 1
  - node: unbreakable
    lab: 2
  - node: undeniable
    lab: 3
  - node: unrelenting
    lab: 4

bandit: kill-all

pantheon:
  major: lunaris
  minor: gruthkul
  note: Gruthkul reduces physical damage taken, which is most of what kills a trauma stacker.

uniques:
  core: []
  optional: []
changelog:
  - season: covens
    date: "2026-11-26"
    notes:
      - "First guide for the Covens league."
      - "The two-handed gear profile no longer inherits a shield; armour rolls and a chaos belt raise life, EHP and max hit at every map checkpoint."
      - "Weapon-scoped tree targets stop points going to one-hand and mace-crit notables under Resolute Technique."
      - "Herald of Purity, Vulnerability, Added Fire Damage and a Silver Flask raise measured DPS; re-rated S+."
      - "The weapon carries mana leech, a mana flask covers the 28-67 stretch, and the gate report now publishes unreserved mana and mana cost."
      - "The leveling filter and step plans were corrected for Resolute Technique and the 5-link/6-link wording."
  - season: covens
    date: "2026-11-27"
    notes:
      - "The 28-38 step now has its own 41-point tree and stays on Sunder; Boneshatter starts at 39 with Brutality and its own gate report."
      - "The 39-68 step shows the support progression and keeps a mana flask until the axe carries leech."
      - "Ascendancy labs are named correctly: Unflinching, Unbreakable, Undeniable and Unrelenting."
  - season: covens
    date: "2026-11-28"
    notes:
      - "Ground Slam and Ruthless open the leveling; Sunder takes over at 12 and Boneshatter at 39."
      - "Herald of Ash covers the pre-Brutality Sunder stretch; Herald of Purity returns when Brutality replaces Added Fire."
      - "Cast when Damage Taken carries Immortal Call only; Vulnerability is self-cast because the 38 mana pool cannot pay both."
      - "The early and 68 checkpoints use level-legal gear, and the axe carries a Dexterity roll it can equip."
