schemaVersion: 1
season: covens
wickerman:
  profile: physical-flicker
stepPlan: flicker
id: flicker-strike-slayer
name: Flicker Strike Slayer
class: Duelist
ascendancyId: slayer
family: melee
mainSkill: Flicker Strike
flagship: false
summary: >-
  Flicker Strike on the Slayer shell. The build spends frenzy charges to
  teleport-strike through a pack, and Blood Rage plus Slayer leech keep the
  charges and life coming back. No required unique.

pros:
  - { weight: 3, text: "Flicker Strike teleports to enemies, so clear is fast and hands-off." }
  - { weight: 3, text: "No required unique; a rare two-handed axe carries the damage." }
  - { weight: 2, text: "Slayer leech and culling make the boss fight forgiving." }
  - { weight: 2, text: "Blood Rage supplies frenzy charges between packs." }
  - { weight: 2, text: "A fun, high-mobility melee build." }
  - { weight: 1, text: "The same armour and axe bases as the other melee builds." }
cons:
  - { weight: 3, text: "Flicker teleports you into danger; positioning is not fully yours." }
  - { weight: 3, text: "Frenzy charge downtime stops the build." }
  - { weight: 2, text: "Clear speed depends on keeping the chain going." }
  - { weight: 2, text: "Melee range means you eat mechanics." }
  - { weight: 1, text: "Mana is tight before leech and reduced cost are solved." }
  - { weight: 1, text: "A six-link is a large damage step." }

ratings:
  tankiness: 5
  singleTarget: 7
  clear: 9
  cost: 7

gearProfile: melee

# The melee family filter keeps a shield slot; this build is a two-hander.
filter:
  slots:
    weapon:
      itemClasses: ["Two Hand Axe"]
    offhand: null

config:
  - { name: useFrenzyCharges, value: 'boolean="true"' }
  - { name: overrideFrenzyCharges, value: 'number="3"' }

tree:
  keystones:
    - Resolute Technique
  targets:
    - increased physical damage
    - increased attack speed
    - increased maximum life
    - increased melee damage
    - increased area of effect

# Steps (PLAN-BUILDS.md §9.3). Each step is read and measured at its `level`;
# the pre-refactor checkpoints survive as `aliases`, so old links still land.
steps:
  leveling:
    sub:
      - id: leveling-1-12
        level: 12
        main: Double Strike
        measure: true
        aliases: [until-12]
        gems:
          - slot: Body Armour
            gems:
              - Double Strike
              - Melee Splash
              - Faster Attacks
          - slot: Weapon 1
            gems:
              - Leap Slam
              - Blood and Sand
          - slot: Helmet
            gems:
              - Decoy Totem
        flasks:
          - slot: life
            name: Medium Life Flask
            note: Small until level 3.
          - slot: mana
            name: Small Mana Flask
            note: Slam attacks are mana-hungry.
          - slot: utility
            name: Quicksilver Flask
            note: Act 2 quest reward.
      - id: leveling-12-28
        level: 28
        main: Flicker Strike
        trigger: { from: 12, skill: Flicker Strike }
        measure: true
        aliases: [until-28]
        gems:
          - slot: Body Armour
            gems:
              - Flicker Strike
              - Melee Splash
              - Melee Physical Damage
              - Close Combat
          - slot: Weapon 1
            gems:
              - Leap Slam
              - Blood Rage
          - slot: Helmet
            gems:
              - Decoy Totem
              - Blood and Sand
        flasks:
          - slot: life
            name: Giant Life Flask
            note: Drops from level 24.
          - slot: mana
            name: Greater Mana Flask
            note: Drops from level 12.
          - slot: utility
            name: Granite Flask
            note: Armour.
          - slot: utility
            name: Amethyst Flask
            note: Chaos resistance.
      - id: leveling-38-68
        level: 68
        main: Flicker Strike
        trigger: { from: 28 }
        measure: true
        aliases: [until-68]
        gems:
          - slot: Body Armour
            gems:
              - Flicker Strike
              - Melee Splash
              - Melee Physical Damage
              - Multistrike
              - Close Combat
              - Faster Attacks
          - slot: Weapon 1
            gems:
              - Leap Slam
              - Blood Rage
          - slot: Helmet
            gems:
              - Decoy Totem
              - Blood and Sand
          - slot: Gloves
            gems:
              - name: Cast when Damage Taken
                maxLevel: 5
                note: Level 1-5 only.
              - Immortal Call
        flasks:
          - slot: life
            name: Divine Life Flask
            note: Instant prefix.
          - slot: mana
            name: Hallowed Mana Flask
            note: Drops from level 42.
          - slot: utility
            name: Granite Flask
            note: Iron Skin.
          - slot: utility
            name: Amethyst Flask
            note: Chaos resistance.
  maps:
    sub:
      - id: maps-white
        level: 80
        main: Flicker Strike
        trigger: { from: 68 }
        measure: true
        aliases: [maps-early]
        gems: &id001
          - slot: Body Armour
            gems:
              - Flicker Strike
              - Melee Splash
              - Melee Physical Damage
              - Multistrike
              - Close Combat
              - Faster Attacks
          - slot: Weapon 1
            gems:
              - Leap Slam
              - Blood Rage
          - slot: Helmet
            gems:
              - Decoy Totem
              - Blood and Sand
          - slot: Gloves
            gems:
              - name: Cast when Damage Taken
                maxLevel: 5
                note: Level 1-5 only.
              - Immortal Call
        flasks: &id002
          - slot: life
            name: Divine Life Flask
            note: Keep the instant prefix.
          - slot: mana
            name: Eternal Mana Flask
            note: Drops from level 65.
          - slot: utility
            name: Granite Flask
            note: Iron Skin.
          - slot: utility
            name: Amethyst Flask
            note: Chaos resistance.
      - id: maps-red
        level: 90
        main: Flicker Strike
        trigger: { from: 80 }
        measure: true
        gems: *id001
        flasks: *id002
  endgame:
    sub:
      - id: endgame-pinnacle
        level: 96
        main: Flicker Strike
        trigger: { from: 90 }
        measure: true
        aliases: [pinnacle]
        gems: *id001
        flasks: *id002

ascendancyOrder:
  - { node: headsman, lab: 1 }
  - { node: brutal-fervour, lab: 2 }
  - { node: endless-hunger, lab: 3 }
  - { node: bane-of-legends, lab: 4 }

bandit: kill-all
pantheon:
  major: lunaris
  minor: gruthkul
  note: Gruthkul reduces physical damage taken, which is most of what kills a flicker build.
uniques:
  core: []
  optional: []

guide:
  summary:
    text: >-
      Flicker Strike Slayer is a fast melee build that measures
      {{gates.maps-red.metrics.dps|dps}} at red maps and
      {{gates.endgame-pinnacle.metrics.dps|dps}} at pinnacle. Blood Rage and Slayer
      leech keep the frenzy chain alive, and no unique is required.
    facts: [mainSkill, ascendancyId, gates.maps-red.metrics.dps, gates.endgame-pinnacle.metrics.dps]
  leveling:
    text: >-
      Level with Double Strike until Flicker Strike and Blood Rage are
      available. The first checkpoint measures {{gates.leveling-1-12.metrics.life|int}}
      life and {{gates.leveling-1-12.metrics.dps|dps}} damage; the second measures
      {{gates.leveling-12-28.metrics.dps|dps}}.
    facts: [gates.leveling-1-12.metrics.life, gates.leveling-1-12.metrics.dps, gates.leveling-12-28.metrics.dps]
  maps:
    text: >-
      At red maps the build measures {{gates.maps-red.metrics.dps|dps}} damage,
      {{gates.maps-red.metrics.ehp|int}} effective life and
      {{gates.maps-red.metrics.maxHit|int}} physical max hit. Keep Blood Rage
      up, cap the resistances, and let the filter hide the rest.
    facts: [gates.maps-red.metrics.dps, gates.maps-red.metrics.ehp, gates.maps-red.metrics.maxHit]
  bossing:
    text: >-
      Pinnacle measures {{gates.endgame-pinnacle.metrics.dps|dps}} damage with
      {{gates.endgame-pinnacle.metrics.ehp|int}} effective life and
      {{gates.endgame-pinnacle.metrics.maxHit|int}} physical max hit. Keep a frenzy
      source for the boss and use the Slayer leech window instead of standing
      still.
    facts: [gates.endgame-pinnacle.metrics.dps, gates.endgame-pinnacle.metrics.ehp, gates.endgame-pinnacle.metrics.maxHit]
changelog:
  - season: covens
    date: "2026-11-26"
    notes:
      - "First guide for the Covens league."
