schemaVersion: 1
season: covens
wickerman:
  profile: fire-dot
stepPlan: penance-brand
id: penance-brand-elementalist
name: Penance Brand Ignite Elementalist
class: Witch
ascendancyId: elementalist
family: caster
mainSkill: Penance Brand
flagship: false
gateProfile: dad
summary: >-
  Penance Brand attaches to a pack, charges up and then detonates for a large
  ignite. The Elementalist Shaper of Flames node makes every hit able to ignite,
  so the build is a fire-and-forget brand that keeps burning while you place the
  next one, and it needs no unique.

pros:
  - { weight: 3, text: "The brand keeps applying damage while you move and dodge." }
  - { weight: 3, text: "Ignite proliferation clears the pack from one detonation." }
  - { weight: 2, text: "No required unique; fire damage and gem levels carry the build." }
  - { weight: 2, text: "Brands can be pre-placed before a boss becomes targetable." }
  - { weight: 2, text: "The same fire sceptre serves Righteous Fire or any fire spell later." }
  - { weight: 1, text: "The damage-over-time playstyle is forgiving on reaction time." }
cons:
  - { weight: 3, text: "The brand has to charge before the big detonation lands." }
  - { weight: 3, text: "Ignite damage needs time to tick, so burst phases favour other builds." }
  - { weight: 2, text: "Brand attachment is a second thing to manage in a busy pack." }
  - { weight: 2, text: "Fire-resistant bosses slow the fight noticeably." }
  - { weight: 1, text: "The build wants a six-link for its best damage." }
  - { weight: 1, text: "Elemental reflect maps are a hard no." }

ratings:
  tankiness: 5
  singleTarget: 8
  clear: 7
  cost: 7

gearProfile: fire-dot

tree:
  targets:
    - increased maximum life
    - increased fire damage
    - burning damage
    - increased damage over time
    - increased cast speed
    - increased elemental damage

# Steps (PLAN-BUILDS.md §9.3). Each step is read and measured at its `level`;
# the pre-refactor checkpoints survive as `aliases`, so old links still land.
steps:
  leveling:
    sub:
      - id: leveling-1-12
        level: 12
        main: Rolling Magma
        grade: B
        measure: true
        aliases: [until-12]
        gems:
          - slot: Body Armour
            gems:
              - Rolling Magma
              - Added Fire Damage
              - Arcane Surge
          - slot: Weapon 1
            gems:
              - Flame Wall
          - slot: Helmet
            gems:
              - Clarity
        flasks:
          - slot: life
            name: Medium Life Flask
            note: Small until level 3.
          - slot: mana
            name: Small Mana Flask
            note: Spells are expensive early.
          - slot: utility
            name: Quicksilver Flask
            note: Act 2 quest reward.
      - id: leveling-12-28
        level: 28
        main: Rolling Magma
        grade: B
        trigger: { from: 12 }
        measure: true
        aliases: [until-28]
        gems:
          - slot: Body Armour
            gems:
              - Rolling Magma
              - Added Fire Damage
              - Arcane Surge
          - slot: Weapon 1
            gems:
              - Flame Wall
          - slot: Helmet
            gems:
              - Clarity
        flasks:
          - slot: life
            name: Medium Life Flask
            note: Small until level 3.
          - slot: mana
            name: Small Mana Flask
            note: Spells are expensive early.
          - slot: utility
            name: Quicksilver Flask
            note: Act 2 quest reward.
      - id: leveling-28-38
        level: 38
        main: Rolling Magma
        grade: C
        trigger: { from: 28 }
        points: 42
        measure: true
        watch: >-
          Stay on Rolling Magma through 38: Penance Brand only takes over at 39,
          when its supports are in the link. The fourth link adds Controlled
          Destruction, and Flame Dash, Determination and Clarity come online.
          The fifth link waits for 68 and the sixth for red maps.
        gems:
          - slot: Body Armour
            gems:
              - Rolling Magma
              - Added Fire Damage
              - Arcane Surge
              - Controlled Destruction
          - slot: Weapon 1
            gems:
              - Flame Wall
              - Flame Dash
          - slot: Shield
            gems:
              - Determination
              - Clarity
        flasks:
          - { slot: life, name: "Giant Life Flask", note: "Drops from level 24." }
          - { slot: mana, name: "Greater Mana Flask", note: "Drops from level 12; brands are mana-hungry." }
          - { slot: utility, name: "Quicksilver Flask", note: "Movement while the brand does the work." }
          - { slot: utility, name: "Granite Flask", note: "Armour." }
          - { slot: utility, name: "Amethyst Flask", note: "Chaos resistance." }
      - id: leveling-38-68
        level: 68
        main: Penance Brand
        grade: B
        trigger: { from: 38, skill: Penance Brand }
        watch: >-
          Penance Brand from 39, once Deadly Ailments, Unbound Ailments and
          Controlled Destruction are in the link. The fifth link waits for 68 and
          the sixth for red maps.
        measure: true
        aliases: [until-68]
        gems:
          - slot: Body Armour
            gems:
              - Penance Brand
              - Deadly Ailments
              - Unbound Ailments
              - Controlled Destruction
              - Burning Damage
          - slot: Weapon 1
            gems:
              - Flame Wall
              - Flame Dash
          - slot: Shield
            gems:
              - Determination
              - Clarity
        flasks:
          - slot: life
            name: Divine Life Flask
            note: Drops from level 60; instant prefix.
          - slot: mana
            name: Hallowed Mana Flask
            note: Drops from level 42.
          - slot: utility
            name: Granite Flask
            note: Armour against physical hits.
          - slot: utility
            name: Quartz Flask
            note: Phasing out of the pack.
          - slot: utility
            name: Amethyst Flask
            note: Chaos resistance until it is capped.
  maps:
    sub:
      - id: maps-white
        level: 80
        main: Penance Brand
        grade: A
        trigger: { from: 68 }
        measure: true
        aliases: [maps-early]
        gems:
          - slot: Body Armour
            gems:
              - Penance Brand
              - Swiftbrand
              - Deadly Ailments
              - Burning Damage
              - Ignite Proliferation
          - slot: Weapon 1
            gems:
              - Flame Wall
              - Flame Dash
          - slot: Shield
            gems:
              - Determination
              - Clarity
        flasks: &id002
          - slot: life
            name: Divine Life Flask
            note: Keep the instant prefix.
          - slot: mana
            name: Eternal Mana Flask
            note: Drops from level 65.
          - slot: utility
            name: Granite Flask
            note: Armour against physical hits.
          - slot: utility
            name: Quartz Flask
            note: Phasing out of the pack.
          - slot: utility
            name: Amethyst Flask
            note: Chaos resistance for pinnacle bosses.
      - id: maps-red
        level: 90
        main: Penance Brand
        grade: A
        trigger: { from: 80 }
        measure: true
        gems:
          - slot: Body Armour
            gems:
              - Penance Brand
              - Swiftbrand
              - Deadly Ailments
              - Burning Damage
              - Ignite Proliferation
              - Unbound Ailments
          - slot: Weapon 1
            gems:
              - Flame Wall
              - Flame Dash
          - slot: Shield
            gems:
              - Determination
              - Clarity
        flasks: *id002
  endgame:
    sub:
      - id: endgame-pinnacle
        level: 96
        main: Penance Brand
        grade: S
        trigger: { from: 90 }
        measure: true
        aliases: [pinnacle]
        gems:
          - slot: Body Armour
            gems:
              - Penance Brand
              - Swiftbrand
              - Deadly Ailments
              - Burning Damage
              - Ignite Proliferation
              - Unbound Ailments
          - slot: Weapon 1
            gems:
              - Flame Wall
              - Flame Dash
          - slot: Shield
            gems:
              - Determination
              - Clarity
        flasks: *id002

ascendancyOrder:
  - { node: shaper-of-flames, lab: 1 }
  - { node: mastermind-of-discord, lab: 2 }
  - { node: heart-of-destruction, lab: 3 }
  - { node: bastion-of-elements, lab: 4 }

bandit: kill-all
pantheon:
  major: lunaris
  minor: gruthkul
  note: Gruthkul reduces the physical hits that land while you place the next brand.
uniques:
  core: []
  optional: []

guide:
  summary:
    text: >-
      Penance Brand Ignite measures {{gates.maps-red.metrics.dps|dps}} at red
      maps and {{gates.endgame-pinnacle.metrics.dps|dps}} at pinnacle. One detonation
      ignites the pack, and Shaper of Flames makes every hit able to start it;
      no unique is required.
    facts: [mainSkill, ascendancyId, gates.maps-red.metrics.dps, gates.endgame-pinnacle.metrics.dps]
  leveling:
    text: >-
      Level with Rolling Magma and Flame Wall, then switch to Penance Brand as
      soon as it unlocks. The second checkpoint measures
      {{gates.leveling-12-28.metrics.life|int}} life and
      {{gates.leveling-12-28.metrics.dps|dps}} damage.
    facts: [gates.leveling-12-28.metrics.life, gates.leveling-12-28.metrics.dps]
  maps:
    text: >-
      At red maps the build measures {{gates.maps-red.metrics.dps|dps}} damage,
      {{gates.maps-red.metrics.ehp|int}} effective life and
      {{gates.maps-red.metrics.maxHit|int}} physical max hit. Place the brand on
      the pack, let the detonation ignite it, and move to the next group.
    facts: [gates.maps-red.metrics.dps, gates.maps-red.metrics.ehp, gates.maps-red.metrics.maxHit]
  bossing:
    text: >-
      Pinnacle measures {{gates.endgame-pinnacle.metrics.dps|dps}} damage with
      {{gates.endgame-pinnacle.metrics.ehp|int}} effective life and
      {{gates.endgame-pinnacle.metrics.maxHit|int}} physical max hit. Pre-place the brand
      before the boss is targetable, then refresh it after every immunity phase.
    facts: [gates.endgame-pinnacle.metrics.dps, gates.endgame-pinnacle.metrics.ehp, gates.endgame-pinnacle.metrics.maxHit]
changelog:
  - season: covens
    date: "2026-11-26"
    notes:
      - "First guide for the Covens league."
  - season: covens
    date: "2026-11-27"
    notes:
      - "A 28-38 step stays on Rolling Magma and adds Controlled Destruction; Penance Brand takes over at 39, once its supports are in the link."
