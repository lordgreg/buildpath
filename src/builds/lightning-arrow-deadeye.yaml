schemaVersion: 1
id: lightning-arrow-deadeye
name: Lightning Arrow Deadeye
class: Ranger
ascendancyId: deadeye
family: bow
mainSkill: Lightning Arrow
summary: >-
  League-start bow build. One skill in the body armour, a physical bow with
  attack speed, and gem levels carry the damage: nothing here needs a unique,
  so the same gear works on day one of a solo league. It is the second build the
  pipeline proves, and the first that is not a minion one.

gearProfile: bow

tree:
  targets:
    - increased damage with bows
    - increased projectile damage
    - increased maximum life
    - increased physical damage
    - increased attack speed
    - increased critical strike chance
    - critical strike multiplier
    - increased elemental damage

leveling:
  brackets:
    - until: 12
      skills:
        - Lightning Arrow
        - Sniper's Mark
      skillGroups:
        - slot: Body Armour
          gems:
            - Lightning Arrow
            - Added Lightning Damage
            - Faster Attacks
        - slot: Weapon 1
          gems:
            - Sniper's Mark
            - Flame Dash
        - slot: Helmet
          gems:
            - Precision
        - slot: Boots
          gems:
            - Clarity
      flasks:
        - { slot: life, name: "Medium Life Flask", note: "Small until level 3, then medium." }
        - { slot: mana, name: "Small Mana Flask", note: "Lightning Arrow is mana-hungry before leech." }
        - { slot: utility, name: "Quicksilver Flask", note: "Act 2 quest reward." }

    - until: 28
      skills:
        - Lightning Arrow
        - Sniper's Mark
        - Herald of Thunder
      skillGroups:
        - slot: Body Armour
          gems:
            - Lightning Arrow
            - Added Lightning Damage
            - Faster Attacks
            - Increased Critical Strikes
        - slot: Weapon 1
          gems:
            - Sniper's Mark
            - Herald of Thunder
        - slot: Helmet
          gems:
            - Precision
            - Flame Dash
        - slot: Gloves
          gems:
            - Frenzy
        - slot: Boots
          gems:
            - Grace
      flasks:
        - { slot: life, name: "Giant Life Flask", note: "Drops from level 24; medium is too small by now." }
        - { slot: mana, name: "Greater Mana Flask", note: "Drops from level 12." }
        - { slot: utility, name: "Diamond Flask", note: "Lucky crits, from level 27." }
        - { slot: utility, name: "Quicksilver Flask", note: "Movement, not damage." }
        - { slot: utility, name: "Amethyst Flask", note: "Chaos resistance from level 18." }

    - until: 68
      skills:
        - Lightning Arrow
        - Sniper's Mark
        - Herald of Thunder
      skillGroups:
        - slot: Body Armour
          gems:
            - Lightning Arrow
            - Added Lightning Damage
            - Elemental Damage with Attacks
            - Increased Critical Strikes
            - Faster Attacks
        - slot: Weapon 1
          gems:
            - Sniper's Mark
            - Herald of Thunder
        - slot: Helmet
          gems:
            - Grace
            - Precision
        - slot: Gloves
          gems:
            - { name: Cast when Damage Taken, maxLevel: 5, note: "Level 1-5 only: higher levels need bigger hits before it triggers." }
            - Immortal Call
        - slot: Boots
          gems:
            - Flame Dash
      flasks:
        - { slot: life, name: "Divine Life Flask", note: "Drops from level 60; instant prefix." }
        - { slot: mana, name: "Hallowed Mana Flask", note: "Drops from level 42." }
        - { slot: utility, name: "Diamond Flask", note: "Lucky crits; the biggest single damage flask." }
        - { slot: utility, name: "Silver Flask", note: "Onslaught: attack speed while it lasts." }
        - { slot: utility, name: "Quartz Flask", note: "Phasing to walk out of a pack." }

    - until: 100
      skills:
        - Lightning Arrow
        - Sniper's Mark
        - Herald of Thunder
      skillGroups:
        - slot: Body Armour
          gems:
            - Lightning Arrow
            - Added Lightning Damage
            - Elemental Damage with Attacks
            - Increased Critical Strikes
            - Increased Critical Damage
            - Faster Attacks
        - slot: Weapon 1
          gems:
            - Sniper's Mark
            - Herald of Thunder
        - slot: Helmet
          gems:
            - Grace
            - Precision
        - slot: Gloves
          gems:
            - { name: Cast when Damage Taken, maxLevel: 5, note: "Level 1-5 only: higher levels need bigger hits before it triggers." }
            - Immortal Call
        - slot: Boots
          gems:
            - Flame Dash
      flasks:
        - { slot: life, name: "Divine Life Flask", note: "Keep the instant prefix." }
        - { slot: mana, name: "Eternal Mana Flask", note: "Drops from level 65." }
        - { slot: utility, name: "Diamond Flask", note: "Lucky crits." }
        - { slot: utility, name: "Silver Flask", note: "Onslaught." }
        - { slot: utility, name: "Amethyst Flask", note: "Caps chaos resistance for pinnacle bosses." }

ascendancyOrder:
  - node: gathering-winds
    lab: 1
  - node: far-shot
    lab: 2
  - node: endless-munitions
    lab: 3
  - node: focal-point
    lab: 4

bandit: kill-all

pantheon:
  major: brineking
  minor: gruthkul
  note: Brineking stops the stun lock that ends a dodge build; swap the minor to Ralakesh if bleeding is the problem.

uniques:
  core: []
  optional: []
