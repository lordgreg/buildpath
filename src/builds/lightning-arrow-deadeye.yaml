schemaVersion: 1
season: covens
wickerman:
  profile: lightning-bow
stepPlan: lightning-arrow
id: lightning-arrow-deadeye
name: Lightning Arrow Deadeye
class: Ranger
ascendancyId: deadeye
family: bow
mainSkill: Lightning Arrow
summary: >-
  League-start bow build. One skill in the body armour, a physical bow with
  attack speed, and gem levels carry the damage: nothing here needs a unique,
  so the same gear works on day one of a solo league. It is the second build the
  pipeline proves, and the first that is not a minion one.

pros:
  - { weight: 3, text: "Fast ranged clear" }
  - { weight: 3, text: "Strong league starter" }
  - { weight: 2, text: "Scales hard into maps" }
  - { weight: 2, text: "Safe ranged play" }
  - { weight: 1, text: "Easy bow upgrades" }

cons:
  - { weight: 3, text: "Evasion can fail" }
  - { weight: 3, text: "Needs single-target investment" }
  - { weight: 2, text: "Expensive crit gear" }
  - { weight: 2, text: "Physical burst kills" }
  - { weight: 1, text: "Mana issues while leveling" }

ratings:
  tankiness: 4
  singleTarget: 7
  clear: 10
  cost: 8

guide:
  summary:
    text: >-
      Lightning Arrow Deadeye is a fast bow build that measures
      {{gates.maps-red.metrics.dps|dps}} at red maps and {{gates.endgame-pinnacle.metrics.dps|dps}} at
      pinnacle. A rare bow, added lightning and critical strikes carry the
      damage; no unique is required.
    facts: [mainSkill, ascendancyId, gates.maps-red.metrics.dps, gates.endgame-pinnacle.metrics.dps]
    signed: { by: "maintainer", at: "2026-11-27T00:00:00Z" }
  leveling:
    text: >-
      Level with Lightning Arrow and added lightning, then add the critical
      supports as they unlock. The first checkpoint measures
      {{gates.leveling-1-12.metrics.life|int}} life and {{gates.leveling-1-12.metrics.dps|dps}} damage;
      the second measures {{gates.leveling-12-28.metrics.dps|dps}}. Keep a mana flask until
      leech and reduced cost are online.
    facts: [gates.leveling-1-12.metrics.life, gates.leveling-1-12.metrics.dps, gates.leveling-12-28.metrics.dps]
  maps:
    text: >-
      At red maps the build measures {{gates.maps-red.metrics.dps|dps}} damage,
      {{gates.maps-red.metrics.ehp|int}} effective life and
      {{gates.maps-red.metrics.maxHit|int}} physical max hit. Keep the bow current,
      cap the elemental resistances, and let the filter hide the rest.
    facts: [gates.maps-red.metrics.dps, gates.maps-red.metrics.ehp, gates.maps-red.metrics.maxHit]
  bossing:
    text: >-
      Pinnacle measures {{gates.endgame-pinnacle.metrics.dps|dps}} damage with
      {{gates.endgame-pinnacle.metrics.ehp|int}} effective life and
      {{gates.endgame-pinnacle.metrics.maxHit|int}} physical max hit. Keep the mark up, fire
      from outside slam range, and do not treat evasion as a guarantee.
    facts: [gates.endgame-pinnacle.metrics.dps, gates.endgame-pinnacle.metrics.ehp, gates.endgame-pinnacle.metrics.maxHit]

gearProfile: bow

tree:
  targets:
    - increased damage with bows
    - increased projectile damage
    - increased maximum life
    - increased physical damage
    - increased attack speed
    - increased critical strike chance
    - critical strike multiplier
    - increased elemental damage

# Steps (PLAN-BUILDS.md §9.3). Each step is read and measured at its `level`;
# the pre-refactor checkpoints survive as `aliases`, so old links still land.
steps:
  leveling:
    sub:
      - id: leveling-1-12
        level: 12
        main: Lightning Arrow
        measure: true
        gems:
          - slot: Body Armour
            gems:
              - Lightning Arrow
              - Added Lightning Damage
              - Faster Attacks
          - slot: Weapon 1
            gems:
              - Sniper's Mark
              - Flame Dash
          - slot: Helmet
            gems:
              - Precision
          - slot: Boots
            gems:
              - Clarity
        flasks:
          - slot: life
            name: Medium Life Flask
            note: Small until level 3, then medium.
          - slot: mana
            name: Small Mana Flask
            note: Lightning Arrow is mana-hungry before leech.
          - slot: utility
            name: Quicksilver Flask
            note: Act 2 quest reward.
      - id: leveling-12-28
        level: 28
        main: Lightning Arrow
        trigger: { from: 12 }
        measure: true
        gems:
          - slot: Body Armour
            gems:
              - Lightning Arrow
              - Added Lightning Damage
              - Faster Attacks
              - Increased Critical Strikes
          - slot: Weapon 1
            gems:
              - Sniper's Mark
              - Herald of Thunder
          - slot: Helmet
            gems:
              - Precision
              - Flame Dash
          - slot: Gloves
            gems:
              - Frenzy
          - slot: Boots
            gems:
              - Grace
        flasks:
          - slot: life
            name: Giant Life Flask
            note: Drops from level 24; medium is too small by now.
          - slot: mana
            name: Greater Mana Flask
            note: Drops from level 12.
          - slot: utility
            name: Diamond Flask
            note: Lucky crits, from level 27.
          - slot: utility
            name: Quicksilver Flask
            note: Movement, not damage.
          - slot: utility
            name: Amethyst Flask
            note: Chaos resistance from level 18.
      - id: leveling-28-38
        level: 38
        main: Lightning Arrow
        trigger: { from: 28 }
        points: 42
        measure: true
        watch: >-
          Elemental Damage with Attacks replaces Faster Attacks in the four-link. Grace, Flame
          Dash and Cast when Damage Taken with Immortal Call come online; the fifth link waits for
          68 and the sixth for red maps.
        gems:
          - slot: Body Armour
            gems:
              - Lightning Arrow
              - Added Lightning Damage
              - Elemental Damage with Attacks
              - Increased Critical Strikes
          - slot: Weapon 1
            gems:
              - Sniper's Mark
              - Herald of Thunder
          - slot: Helmet
            gems:
              - Grace
              - Precision
          - slot: Gloves
            gems:
              - name: Cast when Damage Taken
                maxLevel: 5
                note: 'Level 1-5 only: higher levels need bigger hits before it triggers.'
              - Immortal Call
          - slot: Boots
            gems:
              - Flame Dash
        flasks:
          - slot: life
            name: Giant Life Flask
            note: Drops from level 24; medium is too small by now.
          - slot: mana
            name: Greater Mana Flask
            note: Drops from level 12.
          - slot: utility
            name: Diamond Flask
            note: Lucky crits, from level 27.
          - slot: utility
            name: Quicksilver Flask
            note: Movement, not damage.
          - slot: utility
            name: Amethyst Flask
            note: Chaos resistance from level 18.
      - id: leveling-38-68
        level: 68
        main: Lightning Arrow
        trigger: { from: 38, link: 5 }
        measure: true
        gems:
          - slot: Body Armour
            gems:
              - Lightning Arrow
              - Added Lightning Damage
              - Elemental Damage with Attacks
              - Increased Critical Strikes
              - Faster Attacks
          - slot: Weapon 1
            gems:
              - Sniper's Mark
              - Herald of Thunder
          - slot: Helmet
            gems:
              - Grace
              - Precision
          - slot: Gloves
            gems:
              - name: Cast when Damage Taken
                maxLevel: 5
                note: 'Level 1-5 only: higher levels need bigger hits before it triggers.'
              - Immortal Call
          - slot: Boots
            gems:
              - Flame Dash
        flasks:
          - slot: life
            name: Divine Life Flask
            note: Drops from level 60; instant prefix.
          - slot: mana
            name: Hallowed Mana Flask
            note: Drops from level 42.
          - slot: utility
            name: Diamond Flask
            note: Lucky crits; the biggest single damage flask.
          - slot: utility
            name: Silver Flask
            note: 'Onslaught: attack speed while it lasts.'
          - slot: utility
            name: Quartz Flask
            note: Phasing to walk out of a pack.
  maps:
    sub:
      - id: maps-white
        level: 80
        main: Lightning Arrow
        trigger: { from: 68 }
        measure: true
        gems:
          - slot: Body Armour
            gems:
              - Lightning Arrow
              - Added Lightning Damage
              - Elemental Damage with Attacks
              - Increased Critical Strikes
              - Increased Critical Damage
          - slot: Weapon 1
            gems:
              - Sniper's Mark
              - Herald of Thunder
          - slot: Helmet
            gems:
              - Grace
              - Precision
          - slot: Gloves
            gems:
              - name: Cast when Damage Taken
                maxLevel: 5
                note: 'Level 1-5 only: higher levels need bigger hits before it triggers.'
              - Immortal Call
          - slot: Boots
            gems:
              - Flame Dash
        flasks: &id002
          - slot: life
            name: Divine Life Flask
            note: Keep the instant prefix.
          - slot: mana
            name: Eternal Mana Flask
            note: Drops from level 65.
          - slot: utility
            name: Diamond Flask
            note: Lucky crits.
          - slot: utility
            name: Silver Flask
            note: Onslaught.
          - slot: utility
            name: Amethyst Flask
            note: Caps chaos resistance for pinnacle bosses.
      - id: maps-red
        level: 90
        main: Lightning Arrow
        trigger: { from: 80 }
        measure: true
        gems:
          - slot: Body Armour
            gems:
              - Lightning Arrow
              - Added Lightning Damage
              - Elemental Damage with Attacks
              - Increased Critical Strikes
              - Increased Critical Damage
              - Faster Attacks
          - slot: Weapon 1
            gems:
              - Sniper's Mark
              - Herald of Thunder
          - slot: Helmet
            gems:
              - Grace
              - Precision
          - slot: Gloves
            gems:
              - name: Cast when Damage Taken
                maxLevel: 5
                note: 'Level 1-5 only: higher levels need bigger hits before it triggers.'
              - Immortal Call
          - slot: Boots
            gems:
              - Flame Dash
        flasks: *id002
  endgame:
    sub:
      - id: endgame-pinnacle
        level: 96
        main: Lightning Arrow
        trigger: { from: 90 }
        measure: true
        gems:
          - slot: Body Armour
            gems:
              - Lightning Arrow
              - Added Lightning Damage
              - Elemental Damage with Attacks
              - Increased Critical Strikes
              - Increased Critical Damage
              - Faster Attacks
          - slot: Weapon 1
            gems:
              - Sniper's Mark
              - Herald of Thunder
          - slot: Helmet
            gems:
              - Grace
              - Precision
          - slot: Gloves
            gems:
              - name: Cast when Damage Taken
                maxLevel: 5
                note: 'Level 1-5 only: higher levels need bigger hits before it triggers.'
              - Immortal Call
          - slot: Boots
            gems:
              - Flame Dash
        flasks: *id002

