schemaVersion: 1
season: covens
id: lightning-arrow-deadeye
name: Lightning Arrow Deadeye
class: Ranger
ascendancyId: deadeye
family: bow
mainSkill: Lightning Arrow
summary: >-
  League-start bow build. One skill in the body armour, a physical bow with
  attack speed, and gem levels carry the damage: nothing here needs a unique,
  so the same gear works on day one of a solo league. It is the second build the
  pipeline proves, and the first that is not a minion one.

pros:
  - { weight: 3, text: "Fast clear: a single arrow covers a pack at range." }
  - { weight: 3, text: "Strong league starter with no required unique." }
  - { weight: 2, text: "Critical strikes and added lightning scale hard into maps." }
  - { weight: 2, text: "Ranged play keeps you out of most retaliation range." }
  - { weight: 2, text: "The filter and the build share the same bow and quiver bases." }
  - { weight: 1, text: "Gear upgrades are easy to compare because the rare bow is the main damage slot." }
cons:
  - { weight: 3, text: "Evasion is the defensive layer; a bad streak of hits ends the map." }
  - { weight: 3, text: "Single-target needs investment beyond the clear setup." }
  - { weight: 2, text: "Critical gear is expensive relative to a plain resistance set." }
  - { weight: 2, text: "Physical burst and spell damage are the common death causes." }
  - { weight: 1, text: "Mana is tight before leech and reduced cost are online." }
  - { weight: 1, text: "No built-in sustain; leech or life flasks have to cover it." }

ratings:
  tankiness: 4
  singleTarget: 7
  clear: 10
  cost: 8

guide:
  summary:
    text: >-
      Lightning Arrow Deadeye is a fast bow build that measures
      {{gates.maps-red.metrics.dps|dps}} at red maps and {{gates.pinnacle.metrics.dps|dps}} at
      pinnacle. A rare bow, added lightning and critical strikes carry the
      damage; no unique is required.
    facts: [mainSkill, ascendancyId, gates.maps-red.metrics.dps, gates.pinnacle.metrics.dps]
    signed: { by: maintainer, at: "2026-11-26T00:00:00Z" }
  leveling:
    text: >-
      Level with Lightning Arrow and added lightning, then add the critical
      supports as they unlock. The first checkpoint measures
      {{gates.until-12.metrics.life|int}} life and {{gates.until-12.metrics.dps|dps}} damage;
      the second measures {{gates.until-28.metrics.dps|dps}}. Keep a mana flask until
      leech and reduced cost are online.
    facts: [gates.until-12.metrics.life, gates.until-12.metrics.dps, gates.until-28.metrics.dps]
  maps:
    text: >-
      At red maps the build measures {{gates.maps-red.metrics.dps|dps}} damage,
      {{gates.maps-red.metrics.ehp|int}} effective life and
      {{gates.maps-red.metrics.maxHit|int}} physical max hit. Keep the bow current,
      cap the elemental resistances, and let the filter hide the rest.
    facts: [gates.maps-red.metrics.dps, gates.maps-red.metrics.ehp, gates.maps-red.metrics.maxHit]
  bossing:
    text: >-
      Pinnacle measures {{gates.pinnacle.metrics.dps|dps}} damage with
      {{gates.pinnacle.metrics.ehp|int}} effective life and
      {{gates.pinnacle.metrics.maxHit|int}} physical max hit. Keep the mark up, fire
      from outside slam range, and do not treat evasion as a guarantee.
    facts: [gates.pinnacle.metrics.dps, gates.pinnacle.metrics.ehp, gates.pinnacle.metrics.maxHit]

gearProfile: bow

tree:
  targets:
    - increased damage with bows
    - increased projectile damage
    - increased maximum life
    - increased physical damage
    - increased attack speed
    - increased critical strike chance
    - critical strike multiplier
    - increased elemental damage

leveling:
  brackets:
    - until: 12
      skills:
        - Lightning Arrow
        - Sniper's Mark
      skillGroups:
        - slot: Body Armour
          gems:
            - Lightning Arrow
            - Added Lightning Damage
            - Faster Attacks
        - slot: Weapon 1
          gems:
            - Sniper's Mark
            - Flame Dash
        - slot: Helmet
          gems:
            - Precision
        - slot: Boots
          gems:
            - Clarity
      flasks:
        - { slot: life, name: "Medium Life Flask", note: "Small until level 3, then medium." }
        - { slot: mana, name: "Small Mana Flask", note: "Lightning Arrow is mana-hungry before leech." }
        - { slot: utility, name: "Quicksilver Flask", note: "Act 2 quest reward." }

    - until: 28
      skills:
        - Lightning Arrow
        - Sniper's Mark
        - Herald of Thunder
      skillGroups:
        - slot: Body Armour
          gems:
            - Lightning Arrow
            - Added Lightning Damage
            - Faster Attacks
            - Increased Critical Strikes
        - slot: Weapon 1
          gems:
            - Sniper's Mark
            - Herald of Thunder
        - slot: Helmet
          gems:
            - Precision
            - Flame Dash
        - slot: Gloves
          gems:
            - Frenzy
        - slot: Boots
          gems:
            - Grace
      flasks:
        - { slot: life, name: "Giant Life Flask", note: "Drops from level 24; medium is too small by now." }
        - { slot: mana, name: "Greater Mana Flask", note: "Drops from level 12." }
        - { slot: utility, name: "Diamond Flask", note: "Lucky crits, from level 27." }
        - { slot: utility, name: "Quicksilver Flask", note: "Movement, not damage." }
        - { slot: utility, name: "Amethyst Flask", note: "Chaos resistance from level 18." }

    - until: 68
      skills:
        - Lightning Arrow
        - Sniper's Mark
        - Herald of Thunder
      skillGroups:
        - slot: Body Armour
          gems:
            - Lightning Arrow
            - Added Lightning Damage
            - Elemental Damage with Attacks
            - Increased Critical Strikes
            - Faster Attacks
        - slot: Weapon 1
          gems:
            - Sniper's Mark
            - Herald of Thunder
        - slot: Helmet
          gems:
            - Grace
            - Precision
        - slot: Gloves
          gems:
            - { name: Cast when Damage Taken, maxLevel: 5, note: "Level 1-5 only: higher levels need bigger hits before it triggers." }
            - Immortal Call
        - slot: Boots
          gems:
            - Flame Dash
      flasks:
        - { slot: life, name: "Divine Life Flask", note: "Drops from level 60; instant prefix." }
        - { slot: mana, name: "Hallowed Mana Flask", note: "Drops from level 42." }
        - { slot: utility, name: "Diamond Flask", note: "Lucky crits; the biggest single damage flask." }
        - { slot: utility, name: "Silver Flask", note: "Onslaught: attack speed while it lasts." }
        - { slot: utility, name: "Quartz Flask", note: "Phasing to walk out of a pack." }

    - until: 100
      skills:
        - Lightning Arrow
        - Sniper's Mark
        - Herald of Thunder
      skillGroups:
        - slot: Body Armour
          gems:
            - Lightning Arrow
            - Added Lightning Damage
            - Elemental Damage with Attacks
            - Increased Critical Strikes
            - Increased Critical Damage
            - Faster Attacks
        - slot: Weapon 1
          gems:
            - Sniper's Mark
            - Herald of Thunder
        - slot: Helmet
          gems:
            - Grace
            - Precision
        - slot: Gloves
          gems:
            - { name: Cast when Damage Taken, maxLevel: 5, note: "Level 1-5 only: higher levels need bigger hits before it triggers." }
            - Immortal Call
        - slot: Boots
          gems:
            - Flame Dash
      flasks:
        - { slot: life, name: "Divine Life Flask", note: "Keep the instant prefix." }
        - { slot: mana, name: "Eternal Mana Flask", note: "Drops from level 65." }
        - { slot: utility, name: "Diamond Flask", note: "Lucky crits." }
        - { slot: utility, name: "Silver Flask", note: "Onslaught." }
        - { slot: utility, name: "Amethyst Flask", note: "Caps chaos resistance for pinnacle bosses." }

ascendancyOrder:
  - node: gathering-winds
    lab: 1
  - node: far-shot
    lab: 2
  - node: endless-munitions
    lab: 3
  - node: focal-point
    lab: 4

bandit: kill-all

pantheon:
  major: brineking
  minor: gruthkul
  note: Brineking stops the stun lock that ends a dodge build; swap the minor to Ralakesh if bleeding is the problem.

uniques:
  core: []
  optional: []
changelog:
  - season: covens
    date: "2026-11-26"
    notes:
      - "First guide for the Covens league."
