schemaVersion: 1
season: covens
wickerman:
  profile: lightning-spell
stepPlan: arc
id: arc-elementalist
name: Arc Elementalist
class: Witch
ascendancyId: elementalist
family: caster
mainSkill: Arc
flagship: false
gateProfile: standard
summary: >-
  Arc Elementalist casts one lightning spell and lets the chains do the aiming,
  then pays for the single target with the tools the ascendancy already owns.
  Shaper of Storms guarantees the shock, Mastermind of Discord makes the Wave of
  Conviction exposure stronger, and Elemental Overload keeps its damage bonus up
  from Arc's own critical strikes. The defence is a large life pool, capped
  resistances, Saffell's Frame's maximum resistances, Determination armour,
  Arctic Armour while stationary and the endurance charges from Enduring Cry.
  Cerberus Limb and Saffell's Frame are the only required uniques, both cheap.

pros:
  - { weight: 3, text: "Arc clears packs without precise aiming; the chains finish what the first hit starts." }
  - { weight: 3, text: "Very hard to kill for a self-cast caster: capped chaos at pinnacle, maximum resistances, endurance charges and Arctic Armour." }
  - { weight: 3, text: "Single target is real once the exposure, curse and shock are up, and it holds up on a boss even when Convergence is down." }
  - { weight: 2, text: "Cerberus Limb and Saffell's Frame are both cheap uniques rather than build-defining chase items." }
  - { weight: 2, text: "The rare body armour is the expensive slot, and the same shell fits another lightning spell." }
  - { weight: 1, text: "Elementalist supplies the shock and deepens the exposure without a second six-link." }
cons:
  - { weight: 3, text: "Self-casting roots you while Arc repeats, so movement has to be planned around the cast; Arctic Armour rewards standing still." }
  - { weight: 3, text: "The big number assumes the exposure, curse and shock window with Convergence on top; lose a debuff and single target falls fast." }
  - { weight: 2, text: "Mana is tight: Inspiration and the mana flask are part of the build, not a luxury, and the boss rotation spends the bar." }
  - { weight: 2, text: "The physical layer is armour and endurance charges, not a conversion unique; keep Enduring Cry and the flasks up." }
  - { weight: 2, text: "The Amethyst Flask is mandatory at red maps: chaos resistance is positive with it and negative without it, while the endgame chaos suffixes reach the cap by pinnacle." }
  - { weight: 1, text: "Arc's chains are the whole clear mechanic; there is no second damage aura or explosion." }
  - { weight: 1, text: "The effective-life figure includes Bastion of Elements' Primal Aegis, which refreshes but does not cover a physical one-shot." }

ratings:
  # Measured by `builds:verify` on the corrected, legal jewel affixes, not
  # estimated. Pinnacle sits at 676k DPS, 6.8k life, 53.4k EHP and 14.0k
  # physical max hit with chaos capped; red maps measure 541k DPS. Tankiness is
  # 10: EHP is 36% above the corrected Boneshatter baseline (39.3k), life is
  # within 2% and the max hit is 8% below it, with capped chaos and maximum
  # resistances. The EHP figure includes Bastion of Elements' Primal Aegis,
  # which refreshes but covers no physical one-shot; the con list says so.
  # Single target is 10 at 676k against the same 660k baseline; both numbers
  # are snapshots (the baseline's trauma stacks, this build's Convergence
  # window). Convergence is 30% more, so with it off the same gear and tree
  # give 520k (676k / 1.30), still above the 500k bar: the 10 is a window rating
  # and the floor is cleared with or without it. Clear is 9 (chains, no aiming,
  # not bow-fast) and cost is 9 (two cheap uniques; the six-link and the 21/20
  # gems are the bill).
  tankiness: 10
  singleTarget: 10
  clear: 9
  cost: 9

gearProfile: spell

# Cerberus Limb (Blood Sceptre) and Saffell's Frame (Branded Kite Shield) are
# the two uniques in the measured gear. Saffell's base is a
# strength/intelligence shield while the leveling shields are intelligence
# bases, so the filter has to name every shield the build wears. D15: the filter
# follows the build.
filter:
  slots:
    offhand:
      itemClasses: ["Shield"]
      bases: ["Twig Spirit Shield", "Yew Spirit Shield", "Chiming Spirit Shield", "Branded Kite Shield"]

tree:
  # Elemental Overload is the cheap crit package: Arc already lands critical
  # strikes, and the keystone converts them into a flat more-multiplier without
  # spending points on critical multiplier. It is deferred at the first steps
  # and bought once the budget can afford the path.
  keystones:
    - Elemental Overload
  # Lightning first, then life, elemental, spell and cast speed; the
  # resistance passives come last because the gear and Saffell's cover most of
  # the cap. Mana is not a target: Determination and Arctic Armour reserve most
  # of the bar and the flask covers the rest.
  targets:
    - increased lightning damage
    - increased maximum life
    - increased elemental damage
    - increased spell damage
    - increased cast speed
    - resistance

# Steps (PLAN-BUILDS.md §9.3). Each step is read and measured at its `level`;
# the pre-refactor checkpoints survive as `aliases`, so old links still land.
steps:
  leveling:
    sub:
      - id: leveling-1-12
        level: 12
        main: Rolling Magma
        grade: B
        measure: true
        aliases: [until-12]
        gems:
          - slot: Body Armour
            gems:
              - Rolling Magma
              - Added Lightning Damage
              - Arcane Surge
          - slot: Weapon 1
            gems:
              - Flame Dash
          - slot: Helmet
            gems:
              - name: Clarity
                maxLevel: 5
                note: Low level keeps the reservation small.
        flasks:
          - slot: life
            name: Medium Life Flask
            note: Small until level 3.
          - slot: mana
            name: Small Mana Flask
            note: Spells are expensive early.
          - slot: utility
            name: Quicksilver Flask
            note: Act 1 quest reward.
      - id: leveling-12-28
        level: 28
        main: Arc
        grade: B
        trigger: { from: 12, skill: Arc }
        measure: true
        aliases: [until-28]
        gems:
          - slot: Body Armour
            gems:
              - Arc
              - Added Lightning Damage
              - Faster Casting
              - Arcane Surge
          - slot: Weapon 1
            gems:
              - Flame Dash
          - slot: Helmet
            gems:
              - name: Clarity
                maxLevel: 5
                note: Low level keeps the reservation small.
          - slot: Gloves
            gems:
              - Wave of Conviction
              - Physical to Lightning
        flasks:
          - slot: life
            name: Giant Life Flask
            note: Drops from level 24.
          - slot: mana
            name: Greater Mana Flask
            note: Drops from level 12.
          - slot: utility
            name: Quicksilver Flask
            note: Movement is a defensive stat while leveling.
          - slot: utility
            name: Amethyst Flask
            note: Chaos resistance.
      - id: leveling-28-38
        level: 38
        main: Arc
        grade: C
        trigger: { from: 28 }
        points: 42
        measure: true
        watch: >-
          Lightning Penetration replaces Faster Casting in the four-link. Determination,
          Conductivity and Enduring Cry come online; the fifth link waits for 68 and the sixth for
          red maps.
        gems:
          - slot: Body Armour
            gems:
              - Arc
              - Added Lightning Damage
              - Lightning Penetration
              - Arcane Surge
          - slot: Weapon 1
            gems:
              - Flame Dash
          - slot: Helmet
            gems:
              - name: Clarity
                maxLevel: 5
                note: Low level keeps the reservation small.
          - slot: Boots
            gems:
              - Determination
          - slot: Gloves
            gems:
              - Conductivity
              - Wave of Conviction
              - Physical to Lightning
              - Enduring Cry
        flasks:
          - slot: life
            name: Giant Life Flask
            note: Drops from level 24.
          - slot: mana
            name: Greater Mana Flask
            note: Drops from level 12.
          - slot: utility
            name: Quicksilver Flask
            note: Movement is a defensive stat while leveling.
          - slot: utility
            name: Amethyst Flask
            note: Chaos resistance.
      - id: leveling-38-68
        level: 68
        main: Arc
        grade: B
        trigger: { from: 38, link: 5 }
        measure: true
        aliases: [until-68]
        gems:
          - slot: Body Armour
            gems:
              - Arc
              - Added Lightning Damage
              - Lightning Penetration
              - Arcane Surge
              - Inspiration
          - slot: Weapon 1
            gems:
              - Flame Dash
          - slot: Helmet
            gems:
              - name: Clarity
                maxLevel: 5
                note: Low level keeps the reservation small.
          - slot: Boots
            gems:
              - Determination
          - slot: Gloves
            gems:
              - Conductivity
              - Wave of Conviction
              - Physical to Lightning
              - Enduring Cry
        flasks:
          - slot: life
            name: Divine Life Flask
            note: Instant prefix.
          - slot: mana
            name: Hallowed Mana Flask
            note: Drops from level 42.
          - slot: utility
            name: Granite Flask
            note: Armour is half of the physical layer.
          - slot: utility
            name: Quicksilver Flask
            note: The Basalt Flask starts at the map steps.
          - slot: utility
            name: Amethyst Flask
            note: Chaos resistance.
  maps:
    sub:
      - id: maps-white
        level: 80
        main: Arc
        grade: A
        trigger: { from: 68 }
        measure: true
        aliases: [maps-early]
        gems:
          - slot: Body Armour
            gems:
              - Arc
              - Added Lightning Damage
              - Lightning Penetration
              - Arcane Surge
              - Inspiration
          - slot: Weapon 1
            gems:
              - Flame Dash
          - slot: Helmet
            gems:
              - Arctic Armour
          - slot: Gloves
            gems:
              - Conductivity
              - Wave of Conviction
              - Physical to Lightning
              - Enduring Cry
          - slot: Boots
            gems:
              - Determination
        flasks:
          - slot: life
            name: Divine Life Flask
            note: Keep the instant prefix.
          - slot: mana
            name: Hallowed Mana Flask
            note: White maps still use the budget flask.
          - slot: utility
            name: Granite Flask
            note: Armour.
          - slot: utility
            name: Basalt Flask
            note: Physical damage reduction.
          - slot: utility
            name: Amethyst Flask
            note: Chaos resistance.
      - id: maps-red
        level: 90
        main: Arc
        grade: A
        trigger: { from: 80 }
        measure: true
        gems:
          - slot: Body Armour
            gems:
              - Arc
              - Added Lightning Damage
              - Lightning Penetration
              - Arcane Surge
              - Inspiration
              - Spell Echo
          - slot: Weapon 1
            gems:
              - Flame Dash
          - slot: Helmet
            gems:
              - Arctic Armour
          - slot: Gloves
            gems:
              - Conductivity
              - Wave of Conviction
              - Physical to Lightning
              - Enduring Cry
          - slot: Boots
            gems:
              - Determination
        flasks:
          - slot: life
            name: Divine Life Flask
            note: Keep the instant prefix.
          - slot: mana
            name: Eternal Mana Flask
            note: Drops from level 65.
          - slot: utility
            name: Granite Flask
            note: Armour.
          - slot: utility
            name: Basalt Flask
            note: Physical damage reduction.
          - slot: utility
            name: Amethyst Flask
            note: Chaos resistance.
  endgame:
    sub:
      - id: endgame-pinnacle
        level: 96
        main: Arc
        grade: S
        trigger: { from: 90 }
        measure: true
        aliases: [pinnacle]
        gems:
          - slot: Body Armour
            gems:
              - Arc
              - Added Lightning Damage
              - Lightning Penetration
              - Arcane Surge
              - Inspiration
              - Spell Echo
          - slot: Weapon 1
            gems:
              - Flame Dash
          - slot: Helmet
            gems:
              - Arctic Armour
          - slot: Gloves
            gems:
              - Conductivity
              - Wave of Conviction
              - Physical to Lightning
              - Enduring Cry
          - slot: Boots
            gems:
              - Determination
        flasks:
          - slot: life
            name: Divine Life Flask
            note: Keep the instant prefix.
          - slot: mana
            name: Eternal Mana Flask
            note: The build does not work without it.
          - slot: utility
            name: Granite Flask
            note: Armour.
          - slot: utility
            name: Basalt Flask
            note: Physical damage reduction.
          - slot: utility
            name: Amethyst Flask
            note: The measured set keeps it; the chaos suffixes already reach the cap, so it is the first slot to swap.

ascendancyOrder:
  - { node: shaper-of-storms, lab: 1 }
  - { node: heart-of-destruction, lab: 2 }
  - { node: mastermind-of-discord, lab: 3 }
  - { node: bastion-of-elements, lab: 4 }

bandit: kill-all
pantheon:
  major: lunaris
  minor: gruthkul
  note: Gruthkul reduces the physical hits that catch a caster in a bad position; Lunaris covers the projectiles you cannot see.
uniques:
  core:
    - displayName: "Cerberus Limb"
      slot: weapon
      baseType: "Blood Sceptre"
      ssfSource: "Common Delve boss drop; the spell damage and cast speed matter, the shield leech is a bonus."
    - displayName: "Saffell's Frame"
      slot: offhand
      baseType: "Branded Kite Shield"
      ssfSource: "Common map-tier drop; the maximum resistances matter more than the spell damage roll."
  optional: []

# What PoB was evaluated with. The seven input names and types were checked
# against the pinned PoB's ConfigOptions.lua: the three booleans are `check`,
# the three counts are `count` (conditionStationary is seconds, not a boolean)
# and the exposure selector is a `list`, so none of them is silently dropped.
# This config is global to every checkpoint: the early steps are measured with
# the same inputs even though their sources arrive later, and the early gates
# are far above their floors. Shaper of Storms makes every hit shock for at
# least the listed effect, and the Wave of Conviction cast applies the lightning
# exposure; the Physical to Lightning link is what makes that exposure lightning
# rather than fire. Both are debuffs this build applies itself. The socketed
# Conductivity carries the curse; removing the gloves group removes the curse
# and the exposure together. Heart of Destruction grants Convergence when you
# hit a unique enemy, so the pinnacle figure is the Convergence window; with
# Convergence off the same gear and tree give 520k (676k / 1.30). Enduring Cry
# fills the three charges a character can hold without a +1 maximum charge
# passive, and Arctic Armour only pays out while stationary, which is where a
# self-cast Arc stands. PoB treats a skill with any critical strike chance as
# having crit recently, so Elemental Overload needs no separate input; in game
# Arc lands enough hits in a pack, and the boss rotation wants a critical strike
# before the burst. The Onyx Amulet and the attribute passives leave the
# character at 184 strength and 422 intelligence, so the Blood Sceptre and
# Branded Kite Shield requirements are met.
config:
  - { name: conditionEnemyShocked, value: 'boolean="true"' }
  - { name: conditionShockEffect, value: 'number="25"' }
  - { name: waveOfConvictionExposureType, value: 'string="Lightning"' }
  - { name: useEnduranceCharges, value: 'boolean="true"' }
  - { name: overrideEnduranceCharges, value: 'number="3"' }
  - { name: conditionStationary, value: 'number="2"' }
  - { name: conditionConvergence, value: 'boolean="true"' }

guide:
  summary:
    text: >-
      Arc Elementalist casts one lightning spell and lets the chains do the
      aiming, then pays for the single target with the tools the ascendancy
      already owns. Shaper of Storms guarantees the shock, Mastermind of Discord
      makes the Wave of Conviction exposure stronger, and Elemental Overload
      keeps its damage bonus up from Arc's own critical strikes. The defence is
      a large life pool, capped resistances, Saffell's Frame's maximum
      resistances, Determination armour, Arctic Armour while stationary and the
      endurance charges from Enduring Cry. The build measures
      {{gates.endgame-pinnacle.metrics.dps|dps}} at pinnacle with
      {{gates.endgame-pinnacle.metrics.ehp|k}} effective life and
      {{gates.endgame-pinnacle.metrics.maxHit|k}} physical max hit. Two cheap uniques
      are required. The quoted map and pinnacle numbers assume the declared
      shock, exposure, Elemental Overload, Convergence, endurance charges,
      active flasks and stationary Arctic Armour.
    facts: [mainSkill, ascendancyId, gates.endgame-pinnacle.metrics.dps, gates.endgame-pinnacle.metrics.ehp, gates.endgame-pinnacle.metrics.maxHit]
    signed: { by: "maintainer", at: "2026-11-27T00:00:00Z" }
  leveling:
    text: >-
      Level with Rolling Magma until Arc unlocks, then hold Arc and let it
      chain. Wave of Conviction linked to Physical to Lightning applies the
      lightning exposure once the gem pair is available, Conductivity arrives
      with the curse package, and Determination plus Enduring Cry start the
      physical layer. The first checkpoint measures
      {{gates.leveling-1-12.metrics.life|k}} life; the second measures
      {{gates.leveling-12-28.metrics.life|k}} life. The gate strip's early damage
      numbers use the same global PoB config as the endgame steps, so read them
      as a like-for-like comparison rather than a leveling rotation. Drop
      Clarity for Arctic Armour when the reservation fits, and treat the mana
      flask as a slot you never remove.
    facts: [gates.leveling-1-12.metrics.life, gates.leveling-12-28.metrics.life]
    signed: { by: "maintainer", at: "2026-11-27T00:00:00Z" }
  maps:
    text: >-
      At red maps the build measures {{gates.maps-red.metrics.dps|dps}} damage,
      {{gates.maps-red.metrics.ehp|k}} effective life and
      {{gates.maps-red.metrics.maxHit|k}} physical max hit. Keep Conductivity
      and the Wave of Conviction exposure up, refresh the mana flask, and let
      the chains clear the pack. Keep the Physical to Lightning link: it is what
      makes the exposure lightning. The Onyx Amulet's attributes cover
      Cerberus Limb's strength requirement. The Amethyst Flask is what keeps
      chaos resistance positive at this step; Enduring Cry and the granite and
      basalt flasks are the physical layer, and Arctic Armour pays out while you
      stand and cast, so the effective life figure assumes the flasks are up and
      you are stationary.
    facts: [gates.maps-red.metrics.dps, gates.maps-red.metrics.ehp, gates.maps-red.metrics.maxHit]
    signed: { by: "maintainer", at: "2026-11-27T00:00:00Z" }
  bossing:
    text: >-
      Pinnacle measures {{gates.endgame-pinnacle.metrics.dps|dps}} damage with
      {{gates.endgame-pinnacle.metrics.ehp|k}} effective life and
      {{gates.endgame-pinnacle.metrics.maxHit|k}} physical max hit, and chaos
      resistance is capped at {{gates.endgame-pinnacle.metrics.chaosResist|res}} by the
      endgame chaos suffixes and Saffell's Frame's maximum resistances. Open
      with Wave of Conviction to apply the exposure, keep the Physical to
      Lightning link so the exposure is lightning, and reapply the wave between
      Arc bursts. Keep Conductivity on the boss and cast Arc through the shock
      and exposure window; land a critical strike first so Elemental Overload
      is up, because the measured damage includes it. The pinnacle figure is
      the Heart of Destruction Convergence window; without Convergence the
      damage is still above the single-target floor. The measured damage
      assumes the exposure, curse and shock this build applies itself, so apply
      them before the burst rather than casting into a naked target. The
      rotation spends the mana bar, so start it on a full flask.
    facts: [gates.endgame-pinnacle.metrics.dps, gates.endgame-pinnacle.metrics.ehp, gates.endgame-pinnacle.metrics.maxHit, gates.endgame-pinnacle.metrics.chaosResist]
    signed: { by: "maintainer", at: "2026-11-27T00:00:00Z" }

changelog:
  - season: covens
    date: "2026-11-26"
    notes:
      - "First guide for the Covens league."
  - season: covens
    date: "2026-11-27"
    notes:
      - "Re-measured the whole build after the jewel affix caps were fixed: the tree takes lightning and life first, Elemental Overload replaces the old support package, and the shock and exposure the ascendancy applies are declared in the PoB config."
      - "Added Wave of Conviction with Physical to Lightning so Mastermind of Discord's exposure is real, and kept Conductivity as the curse."
      - "Inspiration replaces Faster Casting in the measured six-link, which raises damage and cuts the mana cost; Spell Echo is part of the red-map set."
      - "The physical layer is Determination, Arctic Armour, Enduring Cry and the granite and basalt flasks; Cerberus Limb and Saffell's Frame are the two required uniques."
      - "Enduring Cry fills the three charges the tree can hold; the resistance passives pay for the strict resistance cap."
      - "Heart of Destruction's Convergence is declared for the pinnacle window; with Convergence off the same gear and tree give about 520k (676k / 1.30)."
      - "Pinnacle now measures 676k DPS, 6.8k life, 53.4k EHP, 14.0k physical max hit with chaos capped; red maps measure 541k DPS. Ratings 10/10/9/9."
      - "A 28-38 step now shows the four-link and the gems that unlock at 38; the fifth link waits for 68 and the sixth for red maps."
