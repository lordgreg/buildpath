schemaVersion: 1
season: covens
wickerman:
  profile: fire-dot
stepPlan: righteous-fire
id: righteous-fire-chieftain
name: Righteous Fire Chieftain
class: Marauder
ascendancyId: chieftain
family: caster
mainSkill: Righteous Fire
flagship: true
# The Dad chip is a playstyle label, not a lower bar. The measured build clears
# the standard floors at every checkpoint, so the damage floor is not relaxed.
gateProfile: standard
dad: true

summary: >-
  Righteous Fire on the Chieftain shell: a tanky fire aura that burns enemies
  while you walk, backed by armour, life regeneration and fire resistance. Fire
  Trap levels the character, then Righteous Fire comes online at red maps with
  Purity of Fire, Vitality and Enduring Cry making the self-burn net positive.
  Malevolence and Flammability carry the damage; the legal jewel caps keep the
  single-target and clear numbers modest, but the build is cheap, forgiving and
  has no required unique.

pros:
  - { weight: 3, text: "Fire Trap levels the campaign, then Righteous Fire burns while you move." }
  - { weight: 3, text: "Chieftain regeneration, armour and Enduring Cry charges make the self-burn forgiving." }
  - { weight: 3, text: "No required unique: the defensive slots are life and resistance rares." }
  - { weight: 3, text: "Purity of Fire and Vitality make the measured self-burn net positive at red maps and pinnacle." }
  - { weight: 2, text: "Hinekora explosions and the aura clear packs without aiming." }
  - { weight: 1, text: "The same strength armour bases as the melee builds." }
cons:
  - { weight: 3, text: "The Righteous Fire switch is late: red maps, not the campaign." }
  - { weight: 3, text: "It is a close-range bosser: stand in the aura and use the stationary windows, not a ranged hit build." }
  - { weight: 2, text: "Vitality has to stay at level 14 so the auras fit; the last levels eat the mana bar." }
  - { weight: 2, text: "Clear speed is slower than a bow build." }
  - { weight: 1, text: "Fire resistance and life are hard requirements, not upgrades." }
  - { weight: 1, text: "The red-map six-link and the endgame 21/20 gems are the real bill." }

ratings:
  # Tankiness 9: pinnacle measures 42.0k EHP and 13.4k physical max hit with
  # chaos capped, 80% fire resistance from Purity of Fire plus Barbarism,
  # three Enduring Cry charges (the config override; a lone rare enemy supplies
  # two), Basalt/Granite flasks and a net-positive self-burn. Not a 10: the
  # physical max hit is below the published Juggernaut line.
  #
  # Single target 7: the legal-jewel RF link measures 212k at pinnacle. It is
  # below the measured Arc and Boneshatter baselines; this is an aura build,
  # not a dedicated bosser.
  #
  # Clear 7: red maps measure 122k on the default link. The RF aura and
  # Hinekora explosions clear while you move, but the corrected jewels leave
  # the clear number below the dedicated clear builds.
  #
  # Cost 9: no required unique, no Awakened gem, and every defensive slot is a
  # life or resistance rare plus the load-bearing Eldritch implicits on boots
  # and helmet. The six-link body and 21/20 gems are the bill.
  tankiness: 9
  singleTarget: 7
  clear: 7
  cost: 9

gearProfile: rf

# Enduring Cry is the mitigation layer: three charges are 12% physical damage
# reduction and 12% less elemental damage taken, which includes the RF
# self-burn. The warcry is in every bracket from level 12, so the declared
# charges are a buff the build can apply.
config:
  - { name: useEnduranceCharges, value: 'boolean="true"' }
  - { name: overrideEnduranceCharges, value: 'number="3"' }

tree:
  # RF's damage is a percentage of maximum life, so life is a damage stat as
  # well as the defensive one. Fire and burning notables come first because
  # they multiply the life-derived base; the life and armour targets keep the
  # self-burn and physical hits survivable. The same fire/burning/life tree
  # supports Fire Trap through the campaign.
  targets:
    - increased fire damage
    - burning damage
    - increased maximum life
    - life regeneration
    - increased armour
    - fire resistance

leveling:
  brackets:
    - until: 12
      skills: [Rolling Magma]
      skillGroups:
        - slot: Body Armour
          gems: [Rolling Magma, Added Fire Damage, Arcane Surge]
        - slot: Weapon 1
          gems: [Flame Dash, Enduring Cry]
        - slot: Helmet
          gems: [Clarity]
      flasks:
        - { slot: life, name: "Medium Life Flask", note: "Small until level 3." }
        - { slot: mana, name: "Small Mana Flask", note: "Spells are expensive early." }
        - { slot: utility, name: "Quicksilver Flask", note: "Act 2 quest reward." }
    # Fire Trap is the campaign skill: it uses the same fire/burning/life tree
    # as RF and does enough damage to clear the act and white-map gates without
    # pretending a level-28 character can pay RF's self-burn.
    - until: 28
      skills: [Fire Trap]
      skillGroups:
        - slot: Body Armour
          gems: [Fire Trap, Elemental Focus, Efficacy, Concentrated Effect]
        - slot: Weapon 1
          gems: [Flame Dash, Arcane Surge, Enduring Cry]
        - slot: Helmet
          gems: [Malevolence]
        - slot: Gloves
          gems: [Flammability]
      flasks:
        - { slot: life, name: "Giant Life Flask", note: "Drops from level 24." }
        - { slot: mana, name: "Greater Mana Flask", note: "Drops from level 12; Fire Trap is mana-hungry." }
        - { slot: utility, name: "Sulphur Flask", note: "Damage and consecrated ground." }
        - { slot: utility, name: "Granite Flask", note: "Armour." }
    - until: 68
      skills: [Fire Trap]
      skillGroups:
        - slot: Body Armour
          gems: [Fire Trap, Burning Damage, Elemental Focus, Swift Affliction, Concentrated Effect]
        - slot: Weapon 1
          gems: [Flame Dash, Arcane Surge, Enduring Cry]
        - slot: Helmet
          gems: [Malevolence]
        - slot: Gloves
          gems: [Flammability]
      flasks:
        - { slot: life, name: "Divine Life Flask", note: "Instant prefix." }
        - { slot: utility, name: "Sulphur Flask", note: "Damage and consecrated ground." }
        - { slot: utility, name: "Granite Flask", note: "Iron Skin." }
        - { slot: utility, name: "Basalt Flask", note: "Physical damage reduction." }
        - { slot: utility, name: "Amethyst Flask", note: "Chaos resistance." }
    # White maps still run the five-link the ssf-start budget actually has. The
    # RF switch and the sixth link are the red-map step.
    - until: 80
      skills: [Fire Trap]
      skillGroups:
        - slot: Body Armour
          gems: [Fire Trap, Burning Damage, Elemental Focus, Swift Affliction, Concentrated Effect]
        - slot: Weapon 1
          gems: [Flame Dash, Arcane Surge, Enduring Cry]
        - slot: Helmet
          gems: [Malevolence]
        - slot: Gloves
          gems: [Flammability]
      flasks:
        - { slot: life, name: "Divine Life Flask", note: "Instant prefix." }
        - { slot: utility, name: "Sulphur Flask", note: "Damage and consecrated ground." }
        - { slot: utility, name: "Granite Flask", note: "Iron Skin." }
        - { slot: utility, name: "Basalt Flask", note: "Physical damage reduction." }
        - { slot: utility, name: "Amethyst Flask", note: "Chaos resistance." }
    # This is the red-map switch. Stay on Fire Trap until the red-map set is
    # complete: the six-link, capped fire resistance, three Enduring Cry charges
    # and the boots/helmet implicits. Purity of Fire, Vitality and the charges
    # make the measured self-burn net positive; Enduring Cry's regeneration adds
    # margin while the warcry buff is up. Vitality stays at 14 so Malevolence
    # and Purity of Fire fit the mana bar.
    - until: 90
      skills: [Righteous Fire]
      skillGroups:
        - slot: Body Armour
          gems: [Righteous Fire, Lifetap, Swift Affliction, Burning Damage, Elemental Focus, Concentrated Effect]
        - slot: Weapon 1
          gems: [Flame Dash, Lifetap, Enduring Cry]
        - slot: Helmet
          gems: [Malevolence, Purity of Fire, { name: Vitality, maxLevel: 14, note: "Level 14 is the reservation cap; higher levels eat the mana bar." }]
        - slot: Gloves
          gems: [Flammability, Lifetap]
      flasks:
        - { slot: life, name: "Divine Life Flask", note: "Instant prefix." }
        - { slot: utility, name: "Sulphur Flask", note: "Damage and consecrated ground." }
        - { slot: utility, name: "Granite Flask", note: "Iron Skin." }
        - { slot: utility, name: "Basalt Flask", note: "Physical damage reduction." }
        - { slot: utility, name: "Amethyst Flask", note: "Chaos resistance." }
    - until: 100
      skills: [Righteous Fire]
      skillGroups:
        - slot: Body Armour
          gems: [Righteous Fire, Lifetap, Swift Affliction, Burning Damage, Elemental Focus, Concentrated Effect]
        - slot: Weapon 1
          gems: [Flame Dash, Lifetap, Enduring Cry]
        - slot: Helmet
          gems: [Malevolence, Purity of Fire, { name: Vitality, maxLevel: 14, note: "Level 14 is the reservation cap; higher levels eat the mana bar." }]
        - slot: Gloves
          gems: [Flammability, Lifetap]
      flasks:
        - { slot: life, name: "Divine Life Flask", note: "Keep the instant prefix." }
        - { slot: utility, name: "Sulphur Flask", note: "Damage and consecrated ground." }
        - { slot: utility, name: "Granite Flask", note: "Iron Skin." }
        - { slot: utility, name: "Basalt Flask", note: "Physical damage reduction." }
        - { slot: utility, name: "Amethyst Flask", note: "Chaos resistance." }

ascendancyOrder:
  # Ngamahu's strength helps the life shell and its jewel conversion adds fire
  # damage; Tasalio turns the fire resistance into cold and lightning
  # resistance; Ramako is the stationary fire DoT resistance effect that the
  # boss link can use; Hinekora is the clear explosion.
  - { node: ngamahu-flame-s-advance, lab: 1 }
  - { node: tasalio-cleansing-water, lab: 2 }
  - { node: ramako-sun-s-light, lab: 3 }
  - { node: hinekora-death-s-fury, lab: 4 }

bandit: kill-all
pantheon:
  major: lunaris
  minor: gruthkul
  note: Gruthkul reduces physical damage taken, which is most of what kills a low-APM build.
uniques:
  core: []
  optional: []

guide:
  summary:
    text: >-
      Righteous Fire Chieftain is a low-APM fire aura build that levels with
      Rolling Magma, then Fire Trap, and switches to Righteous Fire at red maps.
      It measures
      {{gates.maps-red.metrics.dps|dps}} DPS at red maps and
      {{gates.pinnacle.metrics.dps|dps}} DPS at pinnacle. Purity of Fire,
      Vitality, three Enduring Cry charges and the boots' life-regeneration
      implicit keep the self-burn net positive; Enduring Cry's regeneration adds
      margin while the warcry buff is up. Malevolence and Flammability carry the
      bossing damage, and no unique is required.
    facts: [mainSkill, ascendancyId, config, leveling, uniques, gates.maps-red.metrics.dps, gates.pinnacle.metrics.dps, gates.maps-red.gems, gates.pinnacle.gems, gates.maps-red.gear, gates.pinnacle.gear]
    signed: { by: "maintainer", at: "2026-11-27T00:00:00Z" }
  leveling:
    text: >-
      Level with Rolling Magma into Fire Trap; the first checkpoint measures
      {{gates.until-12.metrics.life|int}} life and
      {{gates.until-12.metrics.dps|dps}} DPS, and the second measures
      {{gates.until-28.metrics.dps|dps}} DPS with Fire Trap. Fire Trap carries
      the campaign and white maps; stay on it until the red-map set is complete:
      the six-link, capped fire resistance, three Enduring Cry charges, and the
      boots life-regeneration and helmet reservation-efficiency implicits. The
      leveling panel opens the Righteous Fire bracket before that set; do not
      switch until it is complete. Without the charges the burn is net negative;
      with them, Purity of Fire and Vitality make the degen sustainable, and
      Enduring Cry's regeneration adds margin while the warcry buff is up.
    facts: [config, gates.until-12.metrics.life, gates.until-12.metrics.dps, gates.until-28.metrics.dps, gates.maps-red.gear, gates.maps-red.gems, gates.maps-red.metrics.resists]
    signed: { by: "maintainer", at: "2026-11-27T00:00:00Z" }
  maps:
    text: >-
      At red maps the build measures {{gates.maps-red.metrics.dps|dps}} DPS
      with {{gates.maps-red.metrics.ehp|k}} effective life and
      {{gates.maps-red.metrics.maxHit|k}} physical max hit. Those physical
      numbers assume three Enduring Cry charges and the listed flasks; the
      Amethyst Flask is what keeps chaos resistance positive here, and the
      measured pinnacle cap still uses it. Concentrated Effect is the default
      link; swap it for Increased Area of Effect when you want a wider aura, at
      the cost of the Concentrated Effect damage. Purity of Fire, Vitality,
      three Enduring Cry charges and the boots' life-regeneration Eldritch
      implicit keep the self-burn net positive, but the margin is thin.
      Enduring Cry's regeneration adds margin while the warcry buff is up, so
      recast it on cooldown; the charges are also the physical layer, so do not
      let them drop. The helmet's reservation efficiency implicit is part of the
      measured aura fit. Lifetap pays for Flame Dash, Flammability and the
      warcry; in the RF link it converts the cost to life, and its more-damage
      buff is not part of the measured number. The low mana bar does not stop
      the loop. The measured clear number is modest; the aura and Hinekora do
      the work. Keep Enduring Cry and Flammability up and let the filter hide
      the rest.
    facts: [config, gates.maps-red.metrics.dps, gates.maps-red.metrics.ehp, gates.maps-red.metrics.maxHit, gates.maps-red.metrics.chaosResist, gates.maps-red.metrics.resists, gates.maps-red.gear, gates.maps-red.gems, gates.maps-red.flasks]
    signed: { by: "maintainer", at: "2026-11-27T00:00:00Z" }
  bossing:
    text: >-
      Pinnacle measures {{gates.pinnacle.metrics.dps|dps}} DPS with
      {{gates.pinnacle.metrics.ehp|k}} effective life,
      {{gates.pinnacle.metrics.maxHit|k}} physical max hit and
      {{gates.pinnacle.metrics.chaosResist|res}} chaos resistance. Stand in the
      aura, keep Flammability on the boss, and move for the slams and the
      mechanics that would kill you; use the stationary windows only when the
      fight lets you. The measured damage does not include Ramako's stationary
      effect, which can override Flammability's fire-resistance curse rather
      than add to it, so do not count it as extra damage. The measured self-burn
      is net positive with Purity of Fire, Vitality, three Enduring Cry charges
      and the boots' life-regeneration Eldritch implicit, but the margin is
      thin. Enduring Cry's regeneration adds margin while the warcry buff is up;
      the charges are also the physical layer, so do not let them drop. The
      physical and self-burn numbers assume three charges (the config override;
      a lone rare enemy supplies two) and the listed flasks; the aura fit
      assumes the helmet's reservation efficiency implicit. The measured damage
      does not include the Lifetap buff. The Amethyst Flask is part of the
      measured chaos resistance at red maps and the chaos cap at pinnacle; do
      not drop it for a damage flask unless the gear adds the missing chaos
      resistance. The measured single-target number is below the dedicated boss
      builds.
    facts: [config, ascendancyOrder, gates.pinnacle.metrics.dps, gates.pinnacle.metrics.ehp, gates.pinnacle.metrics.maxHit, gates.pinnacle.metrics.chaosResist, gates.pinnacle.metrics.resists, gates.pinnacle.gear, gates.pinnacle.gems, gates.pinnacle.flasks]
    signed: { by: "maintainer", at: "2026-11-27T00:00:00Z" }

changelog:
  - season: covens
    date: "2026-11-26"
    notes:
      - "First guide for the Covens league."
  - season: covens
    date: "2026-11-27"
    notes:
      - "The measured build now passes the standard gate profile at every checkpoint, not only the Dad floors."
      - "Fire Trap levels the campaign and white maps; Righteous Fire comes online at red maps when capped resistance, Purity of Fire, Vitality and three Enduring Cry charges make the self-burn net positive."
      - "The endgame link uses Lifetap, Swift Affliction, Burning Damage, Elemental Focus and Concentrated Effect; Controlled Destruction did nothing for RF's damage, and Increased Area of Effect widens the aura at a damage cost."
      - "Purity of Fire, a level-14 Vitality and three Enduring Cry charges are the steady sustain package; the boots' life-regeneration implicit adds margin, and Enduring Cry's regeneration adds more while the warcry buff is up. The measured net life regeneration is positive at red maps and pinnacle, and Vitality stays at 14 so the auras fit the mana bar."
      - "Malevolence is the damage aura and Flammability is the fire-resistance curse; Enduring Cry charges and the listed flasks keep the physical and self-burn numbers honest, and the build still needs no unique and no Awakened gem."
      - "The shared jewel-affix correction replaced the illegal weapon-scale jewel rolls with legal jewel caps. The corrected build measures 212.0k RF DPS at pinnacle and 122.1k at red maps; ratings are tankiness 9, single target 7, clear 7, cost 9 (S), not S+."
      - "Sustain was measured with the pinned oracle plus a scratch copy that prints LifeRegenRecovery and NetLifeRegen: maps-red gross 1,286.6/s, degen 1,181.5/s and net +105.1/s; pinnacle gross 1,577/s, degen 1,437/s and net +140/s; the Fire Trap checkpoints have no RF degen. The degen uses 90% of maximum life and 70% of maximum energy shield per second, 80% fire resistance and three endurance charges (12% less elemental damage taken)."
