# Checkpoints: what a build is measured at, and how much it has to work with.
#
# The leveling entries line up with the seed's leveling brackets, so a guide
# step *is* a bracket: "until level 28" shows the gems and gear you have at 28.
# `points` is a reviewed per-patch budget (D30), never derived from a quest
# count at runtime, because that is what breaks every league.
schemaVersion: 1
treeVersion: "3_30"
checkpoints:
  until-12:
    level: 12
    points: 12
    labs: 0
    budget: starting
    gemLevel: 4
    supportLevel: 1
  until-28:
    level: 28
    points: 30
    labs: 1
    budget: early
    gemLevel: 9
    supportLevel: 5
  until-68:
