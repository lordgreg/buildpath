# Checkpoints: what a build is measured at, and how much it has to work with.
#
# A guide step *is* a checkpoint. `level` is the character level; gem levels are
# derived from the gem's own required-level table (src/generated/gem-levels.json)
# so a step can never claim a gem level the character cannot hold. `gemLevelCap`
# only limits how far the derivation may go — 21 is a corrupted gem, which is a
# trade item, not something you level into.
#
# `points` is a reviewed per-patch leveling budget (D30), not a quest count.
# `labs` is how many ascendancy labs are reachable by that checkpoint.
# `enemyLevel` is what the gate measures against: PoB defaults to level 83, which
# would ask a level-12 character to hit a red-map monster.
schemaVersion: 1
treeVersion: "3_30"
checkpoints:
  until-12:
    level: 12
    points: 12
    labs: 0
    budget: starting
    gemLevelCap: 20
    gemQuality: 0
    enemyLevel: 13
  until-28:
    level: 28
    points: 30
    labs: 1
    budget: early
    gemLevelCap: 20
    gemQuality: 0
    enemyLevel: 28
  until-68:
    level: 68
    points: 78
    labs: 3
    budget: ssf-start
    gemLevelCap: 20
    gemQuality: 10
    enemyLevel: 68
  maps-early:
