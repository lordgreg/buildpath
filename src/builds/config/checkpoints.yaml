# Checkpoints: what a build is measured at, and how much it has to work with.
#
# `points` is the passive-point budget. It is a reviewed per-patch table (D30),
# never derived from a quest count at runtime, because that is what breaks every
# league. Values are deliberately conservative.
schemaVersion: 1
treeVersion: "3_30"
bossTarget: "Pinnacle boss (single target, no ailment help from another build)"
