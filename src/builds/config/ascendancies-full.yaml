      - { id: mistress-of-sacrifice, name: "Mistress of Sacrifice", notable: true, effect: ["Your Offering Skills also affect you", "Your Offerings have 50% reduced Effect on you", "40% increased Skill Effect Duration"] }
      - { id: essence-glutton, name: "Essence Glutton", notable: true, effect: ["For each corpse within 6 metres, you and Allies Regenerate 0.2% of Energy Shield per second, up to 2.0%", "For each corpse within 6 metres, you and Allies Regenerate 5 Mana per second, up to 50", "Regenerate 8% of Energy Shield over 2 seconds when you Consume a corpse"] }
      - { id: commander-of-darkness, name: "Commander of Darkness", notable: true, effect: ["Auras from your Skills grant 3% increased Attack and Cast Speed to you and Allies", "You and Allies within 6 metres deal 30% increased Damage", "You and Allies within 6 metres have +30% to Elemental Resistances"] }
