# Full ascendancy node sets for the builds in the catalogue.
#
# The small passives are the path nodes between the notables; the notables are
# the choices a player actually picks. The graph is rendered as a circle with
# every node visible and the build's four choices lit. Data reviewed against
# poedb's ascendancy pages; no game art is shipped.
schemaVersion: 1
ascendancies:
  necromancer:
    name: Necromancer
    class: Witch
    nodes:
      - { id: minion-damage-and-life, name: "Minion Damage and Life", notable: false, effect: ["Minions have 10% increased maximum Life", "Minions deal 10% increased Damage"] }
      - { id: minion-damage-skill-duration, name: "Minion Damage, Skill Duration", notable: false, effect: ["10% increased Skill Effect Duration", "Minions deal 10% increased Damage"] }
      - { id: minion-damage-cast-speed, name: "Minion Damage, Cast Speed", notable: false, effect: ["4% increased Cast Speed", "Minions deal 10% increased Damage"] }
      - { id: minion-damage-mana, name: "Minion Damage, Mana", notable: false, effect: ["8% increased maximum Mana", "Minions deal 10% increased Damage"] }
