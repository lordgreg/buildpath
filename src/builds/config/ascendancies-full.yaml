      - { id: armour-and-energy-shield-shrine-buff-effect, name: "Armour and Energy Shield, Shrine Buff Effect", notable: false, effect: ["14% increased Armour", "5% increased maximum Energy Shield", "10% increased Effect of Shrine Buffs on you"] }
