  # Penance Brand ignite. Fire DoT gear, brand placement and enough life to
  # stand still for the detonation are the three things the steps ask about.
  penance-brand:
    until-12:
      goals:
        - "Level with Rolling Magma and Flame Wall; life and a 3-link first."
        - "Do not buy brand gear before Penance Brand is available."
      lookFor:
        - slot: "Weapon"
          mods: ["Fire damage", "Spell damage"]
          note: "Any fire sceptre."
        - slot: "Body Armour"
          mods: ["Life", "Elemental resistances"]
          note: "A 3-link is enough."
        - slot: "Boots"
          mods: ["Movement speed", "Life"]
          note: "Movement speed is defence."
    until-28:
      goals:
        - "Switch to Penance Brand with Deadly Ailments and Unbound Ailments."
        - "Take the first two labs when they unlock; Shaper of Flames ignites everything."
      lookFor:
        - slot: "Weapon"
          mods: ["Fire damage", "Cast speed"]
          note: "A rare fire sceptre."
        - slot: "Shield"
          mods: ["Life", "Elemental resistances"]
          note: "Stay defensive; the ignite does the damage."
        - slot: "Body Armour"
          mods: ["4-link", "Life"]
          note: "Four links carry the brand."
      crafting:
        - slot: "Weapon"
          mods: ["Fire damage"]
          note: "Bench fire damage on a free prefix."
    until-68:
      goals:
        - "Five-link the brand and reach 2,000 life; cap elemental resistances first."
        - "Add Burning Damage and keep Flame Wall for the added fire damage."
      lookFor:
