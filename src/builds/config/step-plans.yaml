# Per-checkpoint step plans: goals, attributes to look for, and crafting.
# Keyed by build profile; every profile covers all six checkpoints.
schemaVersion: 1
profiles:
  absolution:
    until-12:
      goals:
        - "Level with Absolution; life and a 3-link matter more than minion damage in Act 1."
        - "Keep the weapon current, but do not spend currency on a rare yet."
      lookFor:
        - slot: "Weapon"
          mods: ["Minion gem levels", "Cast speed"]
          note: "A +1 minion wand is the first real upgrade."
        - slot: "Body Armour"
          mods: ["Life", "Elemental resistances"]
          note: "A 3-link is enough."
        - slot: "Boots"
          mods: ["Movement speed", "Life"]
          note: "Movement speed is defence while leveling."
    until-28:
      goals:
        - "Swap to Absolution and add Minion Damage; the minions start carrying packs."
        - "Take the first two labs when they unlock; the relics are a large damage step."
      lookFor:
        - slot: "Weapon"
          mods: ["+1 to Level of all Minion Skill Gems", "Minion Damage", "Cast speed"]
          note: "Gem levels beat added damage for minions."
        - slot: "Shield"
          mods: ["Life", "Elemental resistances"]
          note: "Stay defensive; the minions do the damage."
        - slot: "Jewels"
          mods: ["Minion Damage", "Minion Life"]
          note: "Any minion jewel is useful."
      crafting:
        - slot: "Weapon"
          mods: ["Minion Damage"]
          note: "Bench minion damage on a free suffix."
    until-68:
      goals:
        - "Six-link Absolution and reach 2,000 life; cap elemental resistances first."
        - "The 6-link is the largest damage step; do not skip it for a rare chest."
      lookFor:
        - slot: "Body Armour"
          mods: ["6-link", "Life", "Elemental resistances"]
          note: "The 6-link is the damage step."
        - slot: "Weapon"
          mods: ["+1 to Level of all Minion Skill Gems", "Minion Damage", "Cast speed"]
          note: "Do not replace a +1 wand with a rare without it."
        - slot: "Jewels"
          mods: ["Minion Damage", "Minion Life", "Life"]
          note: "Minion life keeps the sentinels alive through bosses."
      crafting:
        - slot: "Body Armour"
          mods: ["Life", "Elemental resistances"]
          note: "Craft the missing resistance; do not chase minion mods on the chest."
    maps-early:
      goals:
        - "A 5-link clears white maps; start saving for the 6-link body."
        - "Cap resistances and reach 3,000 life before red maps."
      lookFor:
        - slot: "Weapon"
          mods: ["+1 to Level of all Minion Skill Gems", "Minion Damage", "Cast speed"]
          note: "The wand is the stable damage slot."
        - slot: "Body Armour"
          mods: ["5-link", "Life", "Elemental resistances"]
          note: "5-link now, 6-link next."
        - slot: "Rings"
          mods: ["Life", "Elemental resistances", "Minion Damage"]
          note: "Rings fix resists cheaply."
      crafting:
        - slot: "Weapon"
          mods: ["Minion Damage"]
          note: "Bench minion damage if the wand has a free suffix."
    maps-red:
      goals:
        - "Six-link the main skill and move to 20% quality gems from this step."
        - "Reach 4,500 life and 6,000 physical max hit; the minions do not tank for you."
      lookFor:
        - slot: "Weapon"
          mods: ["+1 to Level of all Minion Skill Gems", "Minion Damage", "Cast speed"]
          note: "This is the last slot to downgrade for defence."
        - slot: "Body Armour"
          mods: ["6-link", "Life", "Elemental resistances"]
          note: "The 6-link is the red-map damage gate."
        - slot: "Jewels"
          mods: ["Minion Damage", "Minion Life", "Life"]
          note: "Minion life keeps the sentinels alive through bosses."
      crafting:
        - slot: "Weapon"
          mods: ["Minion Damage"]
          note: "Bench minion damage; keep a spare before corrupting."
    pinnacle:
      goals:
        - "Cap chaos resistance at 75% and reach 5,000 life before pinnacle bosses."
        - "Use 21/20 Absolution and awakened minion supports; defence stays the priority."
      lookFor:
        - slot: "Weapon"
          mods: ["+1 to Level of all Minion Skill Gems", "Minion Damage", "Cast speed"]
          note: "A +2 minion wand is the endgame goal."
        - slot: "Amulet"
          mods: ["+1 to Level of all Minion Skill Gems", "Life", "Chaos resistance"]
          note: "Use the amulet to fix chaos resistance."
        - slot: "Jewels"
          mods: ["Minion Damage", "Minion Life", "Life"]
          note: "Minion life keeps the sentinels alive through bosses."
      crafting:
        - slot: "Amulet"
          mods: ["Chaos resistance", "Life"]
          note: "Bench chaos resistance if the amulet has a free suffix."
