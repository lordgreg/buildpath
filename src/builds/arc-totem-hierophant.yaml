schemaVersion: 1
season: covens
wickerman:
  profile: lightning-totem
stepPlan: arc-totem
id: arc-totem-hierophant
name: Arc Totem Hierophant
class: Templar
ascendancyId: hierophant
family: caster
# The default measured link is Lightning Tendrils of Eccentricity on two Spell
# Totems; Arc keeps the four-link helmet for open layouts. The gate measures one
# totem casting the default link, and the guide says the number is per totem.
# The id stays arc-totem-hierophant because it is a frozen share-link slug, and
# the name stays because Arc is still the guide's clear swap.
mainSkill: Lightning Tendrils of Eccentricity
flagship: false
# The Dad chip is a playstyle label, not a lower bar. The build clears the
# standard floors at every checkpoint, so it is measured on them; the Dad
# damage floor would hide how far the measured numbers sit above the gate.
gateProfile: standard
dad: true
summary: >-
  The Tendrils totem is the default link: Lightning Tendrils of Eccentricity
  channels a semicircle in front of the totem, and every fifth pulse is stronger
  (a much larger area and an automatic critical strike). Marylene's Fallacy
  multiplies that guaranteed critical strike into the boss hit and Lioneye's
  Remorse is the armour and life behind the flasks; Arc sits in the four-link
  helmet for open layouts. The measured damage is per totem. Both required
  uniques are cheap common drops; there is no expensive required unique.

# The gem tables list 20 levels for every gem, so the two late brackets cap the
# Awakened supports at 5 and Awakened Empower at 4 explicitly. Without the cap
# the gate measures gem levels the game cannot produce, which is how this build
# once published a 917k pinnacle that a legal character could not reach.

pros:
  - { weight: 3, text: "Two totems clear and boss from one six-link body, and the stronger pulse does the boss damage." }
  - { weight: 3, text: "The required uniques are cheap: a Lapis Amulet and a strength shield, both common drops." }
  - { weight: 2, text: "Lioneye's Remorse, Determination, the flasks and the endurance charges give the life pool a real physical layer." }
  - { weight: 2, text: "Totems channel while you move, so positioning is far less punishing than self-cast." }
  - { weight: 2, text: "No expensive required unique; the pinnacle bill is the six-link, the 21/20 gems and the Awakened supports, with Awakened Empower the priciest." }
  - { weight: 1, text: "Arc chains to a whole pack, so the clear swap needs no aiming." }
cons:
  - { weight: 3, text: "Both totems must survive the whole fight; area damage deletes them and the damage stops." }
  - { weight: 3, text: "The default link needs a transfigured gem from the Divine Font or trade, and the pinnacle damage needs an Awakened Empower." }
  - { weight: 2, text: "Clear is a totem's clear, not a bow build's; you walk between packs and wait for placement." }
  - { weight: 2, text: "Blasphemy, Determination and Clarity leave only a few casts of unreserved mana; the mana flask is part of the rotation." }
  - { weight: 2, text: "Two uniques are required for the measured red-map and pinnacle sets; they are cheap but they are not optional." }
  - { weight: 1, text: "The tree's fire and cold walkers are planner artifacts with dead damage lines." }

ratings:
  # Measured on legal gems and not doubled for the second totem. Tankiness is
  # 10: pinnacle sits at 8.1k life, 46.0k EHP and 14.1k physical max hit with
  # chaos capped and the armour of Lioneye's Remorse, Determination and the
  # flasks behind it. The rating covers the player, not totem durability, which
  # the gates do not measure. Single target is 8: pinnacle measures 295k per
  # totem on the default link, below the 449k Cyclone carries into a 9, though
  # both totems together are about 590k, but they must both stay alive and
  # channel to reach it, so the rating stays on the measured per-totem number.
  # Clear is 8: the default link is also what clears, and red maps measure 187k
  # per totem on it; both totems and the Arc four-link put it a step above the
  # 7-rated slow clears. The rating is editorial: the Increased Area and Arc
  # setups are not measured, and the 187k runs Concentrated Effect for damage,
  # so swap the support for Increased Area of Effect (or use the Arc helmet)
  # when a pack is spread; it is a totem's clear speed, not a bow's. Cost is 9:
  # both required uniques are common drops and the rares are rolled rares with
  # the step plan's bench crafts; the pinnacle bill is the six-link, the 21/20
  # gems and the Awakened supports, with Awakened Empower the priciest.
  tankiness: 10
  singleTarget: 8
  clear: 8
  cost: 9

gearProfile: spell

tree:
  # Life first: the life pool is what turns the flask and Determination layer
  # into a real max hit. Lightning and cast speed come next so the default link
  # keeps its damage, and mana raises the Hierophant recovery margin. The
  # rejected orders were tested and lose more than they gain: elemental before
  # lightning and dropping cast speed both cost life and EHP without a damage
  # gain, and spell damage instead of elemental is flat. The fire and cold
  # walkers this order buys are a shared-planner artifact (their damage and
  # cast-speed lines are fire/cold-scoped), not a damage claim.
  targets:
    - increased maximum life
    - increased lightning damage
    - increased cast speed
    - increased elemental damage
    - increased maximum mana
    - totem damage

# Steps (PLAN-BUILDS.md §9.3). Each step is read and measured at its `level`;
# the pre-refactor checkpoints survive as `aliases`, so old links still land.
steps:
  leveling:
    sub:
      - id: leveling-1-12
        level: 12
        main: Rolling Magma
        measure: true
        aliases: [until-12]
        gems:
          - slot: Body Armour
            gems:
              - Rolling Magma
              - Added Lightning Damage
              - Arcane Surge
          - slot: Weapon 1
            gems:
              - Flame Dash
          - slot: Helmet
            gems:
              - Clarity
        flasks:
          - slot: life
            name: Medium Life Flask
            note: Small until level 3.
          - slot: mana
            name: Small Mana Flask
            note: Spells are expensive early.
          - slot: utility
            name: Quicksilver Flask
            note: Act 2 quest reward.
      - id: leveling-12-28
        level: 28
        main: Lightning Tendrils
        trigger: { from: 12, skill: Lightning Tendrils }
        measure: true
        aliases: [until-28]
        gems:
          - slot: Body Armour
            gems:
              - Lightning Tendrils
              - Added Lightning Damage
              - Controlled Destruction
              - Arcane Surge
          - slot: Weapon 1
            gems:
              - Flame Dash
          - slot: Helmet
            gems:
              - Clarity
        flasks:
          - slot: life
            name: Giant Life Flask
            note: Drops from level 24.
          - slot: mana
            name: Greater Mana Flask
            note: Drops from level 12.
          - slot: utility
            name: Amethyst Flask
            note: Chaos resistance from level 18.
          - slot: utility
            name: Quicksilver Flask
            note: Movement, not damage.
      - id: leveling-38-68
        level: 68
        main: Lightning Tendrils
        trigger: { from: 28 }
        measure: true
        aliases: [until-68]
        gems:
          - slot: Body Armour
            gems:
              - Lightning Tendrils
              - Spell Totem
              - Added Lightning Damage
              - Lightning Penetration
              - Controlled Destruction
          - slot: Helmet
            gems:
              - Arc
              - Spell Totem
              - Added Lightning Damage
          - slot: Weapon 1
            gems:
              - Flame Dash
              - Arcane Surge
              - name: Clarity
                maxLevel: 5
                note: 'Keep it low: the reservation buys regeneration, not a pool.'
          - slot: Boots
            gems:
              - Determination
        flasks:
          - slot: life
            name: Divine Life Flask
            note: Drops from level 60; instant prefix.
          - slot: mana
            name: Eternal Mana Flask
            note: Drops from level 65.
          - slot: utility
            name: Granite Flask
            note: Armour against physical hits.
          - slot: utility
            name: Basalt Flask
            note: Physical damage reduction.
          - slot: utility
            name: Amethyst Flask
            note: Chaos resistance until it is capped.
  maps:
    sub:
      - id: maps-white
        level: 80
        main: Lightning Tendrils of Eccentricity
        trigger: { from: 68, skill: Lightning Tendrils of Eccentricity }
        measure: true
        aliases: [maps-early]
        gems:
          - slot: Body Armour
            gems:
              - name: Lightning Tendrils of Eccentricity
                note: 'Transfigured gem: Divine Font in the Merciless Labyrinth or trade, not the Act 1 quest row.'
              - Spell Totem
              - Added Lightning Damage
              - Lightning Penetration
              - Elemental Focus
          - slot: Helmet
            gems:
              - Arc
              - Spell Totem
              - Added Lightning Damage
          - slot: Weapon 1
            gems:
              - Flame Dash
              - Arcane Surge
              - name: Clarity
                maxLevel: 5
                note: Keep it low.
          - slot: Boots
            gems:
              - Determination
        flasks:
          - slot: life
            name: Divine Life Flask
            note: Instant prefix.
          - slot: mana
            name: Eternal Mana Flask
            note: Drops from level 65.
          - slot: utility
            name: Granite Flask
            note: Armour against physical hits.
          - slot: utility
            name: Basalt Flask
            note: Physical damage reduction.
          - slot: utility
            name: Amethyst Flask
            note: Chaos resistance until it is capped.
      - id: maps-red
        level: 90
        main: Lightning Tendrils of Eccentricity
        trigger: { from: 80 }
        measure: true
        gems:
          - slot: Body Armour
            gems:
              - name: Lightning Tendrils of Eccentricity
                note: 'Transfigured gem: Divine Font in the Merciless Labyrinth or trade, not the Act 1 quest row.'
              - Spell Totem
              - name: Awakened Added Lightning Damage
                maxLevel: 5
              - Lightning Penetration
              - name: Empower
                maxLevel: 3
              - Concentrated Effect
          - slot: Helmet
            gems:
              - Arc
              - Spell Totem
              - Added Lightning Damage
              - Faster Casting
          - slot: Weapon 1
            gems:
              - Flame Dash
              - Arcane Surge
              - name: Clarity
                maxLevel: 1
                note: Low reservation; buy a fresh level 1, since the campaign gem cannot be unlevelled.
          - slot: Gloves
            gems:
              - Conductivity
              - Blasphemy
          - slot: Boots
            gems:
              - Determination
        flasks:
          - slot: life
            name: Divine Life Flask
            note: Keep the instant prefix.
          - slot: mana
            name: Eternal Mana Flask
            note: The aura package leaves little room.
          - slot: utility
            name: Granite Flask
            note: Armour.
          - slot: utility
            name: Basalt Flask
            note: Physical damage reduction.
          - slot: utility
            name: Amethyst Flask
            note: Chaos resistance.
  endgame:
    sub:
      - id: endgame-pinnacle
        level: 96
        main: Lightning Tendrils of Eccentricity
        trigger: { from: 90 }
        measure: true
        aliases: [pinnacle]
        gems:
          - slot: Body Armour
            gems:
              - name: Lightning Tendrils of Eccentricity
                note: 'Transfigured gem: Divine Font in the Merciless Labyrinth or trade, not the Act 1 quest row.'
              - Spell Totem
              - name: Awakened Added Lightning Damage
                maxLevel: 5
              - name: Awakened Lightning Penetration
                maxLevel: 5
              - name: Awakened Elemental Focus
                maxLevel: 5
              - name: Awakened Empower
                maxLevel: 4
          - slot: Helmet
            gems:
              - Arc
              - Spell Totem
              - name: Awakened Added Lightning Damage
                maxLevel: 5
              - Faster Casting
          - slot: Weapon 1
            gems:
              - Flame Dash
              - Arcane Surge
              - name: Clarity
                maxLevel: 1
                note: Low reservation; a fresh level 1.
          - slot: Gloves
            gems:
              - Conductivity
              - Blasphemy
          - slot: Boots
            gems:
              - Determination
        flasks:
          - slot: life
            name: Divine Life Flask
            note: Instant prefix.
          - slot: mana
            name: Eternal Mana Flask
            note: The aura package leaves little room.
          - slot: utility
            name: Granite Flask
            note: Armour.
          - slot: utility
            name: Basalt Flask
            note: Physical damage reduction.
          - slot: utility
            name: Amethyst Flask
            note: Chaos resistance.

ascendancyOrder:
  # Pursuit of Faith is the second totem, so it comes first. Ritual of
  # Awakening and Arcane Blessing are the damage layer; Conviction of Power
  # is the endurance charges that make the life pool stay up.
  - { node: pursuit-of-faith, lab: 1 }
  - { node: ritual-of-awakening, lab: 2 }
  - { node: arcane-blessing, lab: 3 }
  - { node: conviction-of-power, lab: 4 }

bandit: kill-all
pantheon:
  major: lunaris
  minor: gruthkul
  note: Gruthkul reduces the physical hits that catch you while the next totem is placed.
uniques:
  # Both are common drops. The amulet turns the guaranteed critical strike into
  # the boss hit; the shield is the armour and life behind the flasks.
  core:
    - displayName: "Marylene's Fallacy"
      slot: amulet
      baseType: "Lapis Amulet"
      ssfSource: "Common unique amulet; any Lapis Amulet."
    - displayName: "Lioneye's Remorse"
      slot: offhand
      baseType: "Pinnacle Tower Shield"
      ssfSource: "Common unique shield; any Pinnacle Tower Shield."
  optional: []

# The filter follows the build (D15): the uniques drop on their own bases, so
# highlight those next to the leveling rares the same slots use.
filter:
  slots:
    amulet:
      itemClasses: ["Amulet"]
      bases: ["Lapis Amulet", "Onyx Amulet"]
    offhand:
      itemClasses: ["Shield"]
      bases:
        ["Pinnacle Tower Shield", "Chiming Spirit Shield", "Twig Spirit Shield", "Yew Spirit Shield"]

guide:
  summary:
    signed: { by: "maintainer", at: "2026-11-27T00:00:00Z" }
    text: >-
      Arc Totem Hierophant runs Lightning Tendrils of Eccentricity on two Spell
      Totems as its default clear and boss link, with Marylene's Fallacy
      multiplying the stronger pulse's guaranteed critical strike and Lioneye's
      Remorse for the armour, and keeps
      Arc in a four-link helmet for open layouts. The measured link runs
      {{gates.maps-red.metrics.dps|dps}} at red maps and
      {{gates.endgame-pinnacle.metrics.dps|dps}} at pinnacle per totem. The channel
      covers a semicircle in front of the totem, and every fifth pulse is
      stronger (a much larger area and an automatic critical strike), so the
      same link clears packs and delivers the boss hit. No expensive unique is
      required.
    facts: [mainSkill, ascendancyId, uniques.core, gates.maps-red.metrics.dps, gates.endgame-pinnacle.metrics.dps]
  leveling:
    signed: { by: "maintainer", at: "2026-11-27T00:00:00Z" }
    text: >-
      Level with Rolling Magma, then self-cast Lightning Tendrils: the channel
      hits harder than self-cast Arc before the totem links, and it is the same
      skill the default link upgrades. The first checkpoint measures
      {{gates.leveling-1-12.metrics.life|int}} life and
      {{gates.leveling-1-12.metrics.dps|dps}} damage; the second measures
      {{gates.leveling-12-28.metrics.dps|dps}} damage. Put the Tendrils on Spell
      Totem, put Arc in the helmet as a three-link alongside the totem body,
      transfigure a Tendrils at the Divine Font in the Merciless Labyrinth for
      the upgraded version, and add Faster Casting when the helmet becomes a
      four-link at red maps.
    facts: [gates.leveling-1-12.metrics.life, gates.leveling-1-12.metrics.dps, gates.leveling-12-28.metrics.dps]
  maps:
    signed: { by: "maintainer", at: "2026-11-27T00:00:00Z" }
    text: >-
      At red maps the default link measures {{gates.maps-red.metrics.dps|dps}}
      per totem with {{gates.maps-red.metrics.ehp|int}} effective life and
      {{gates.maps-red.metrics.maxHit|int}} physical max hit. It runs
      Concentrated Effect for that number, so swap the support for Increased
      Area of Effect (or use the Arc helmet) when a pack is spread; the swap
      costs some damage, and the Arc helmet's damage is not measured here. This
      is the step where the uniques arrive: Marylene's Fallacy multiplies the
      guaranteed critical strike on the stronger pulse into the boss hit and
      Lioneye's Remorse is the armour and life behind the flasks. The channel
      covers a semicircle in front of the totem, so the totem clears the pack it
      is placed in; Arc swaps into the four-link helmet when an open layout wants
      a chain. Blasphemy with Conductivity is the damage aura, and Determination
      with a Granite and a Basalt flask is the physical layer. Cap the elemental
      resistances and keep both Tendrils totems ahead of you; the Arc helmet
      shares the two-totem cap, so carrying it costs one Tendrils totem. The
      week-one budget covers the rares; the paste's Awakened support and Empower
      are trade or drop gems, and the solo-self-found substitutes are not
      measured, so expect less than this number. The tree's fire and cold
      walkers are planner artifacts: their damage and cast-speed lines are
      fire/cold-scoped, so a hand-built tree should cut them for a lightning or
      life cluster.
    facts: [gates.maps-red.metrics.dps, gates.maps-red.metrics.ehp, gates.maps-red.metrics.maxHit, uniques.core]
  bossing:
    signed: { by: "maintainer", at: "2026-11-27T00:00:00Z" }
    text: >-
      Pinnacle measures {{gates.endgame-pinnacle.metrics.dps|dps}} per totem with
      {{gates.endgame-pinnacle.metrics.ehp|int}} effective life and
      {{gates.endgame-pinnacle.metrics.maxHit|int}} physical max hit. Place both
      Tendrils totems before the burst (they expire on a timer, so recast them
      before they run out) and keep Conductivity on the boss. Replace a totem
      after every phase that clears the arena; the stronger pulse is the damage
      window, so the totem has to be channelling before the boss commits to a
      slam. Awakened Empower in the six-link is the pinnacle damage bill; the
      red-map paste uses the regular support and keeps the import cheap.
      Awakened Elemental Focus cannot inflict ailments, so this link does not
      shock; the red-map link can.
    facts: [gates.endgame-pinnacle.metrics.dps, gates.endgame-pinnacle.metrics.ehp, gates.endgame-pinnacle.metrics.maxHit]
changelog:
  - season: covens
    date: "2026-11-26"
    notes:
      - "First guide for the Covens league."
  - season: covens
    date: "2026-11-27"
    notes:
      - "The default link is Lightning Tendrils of Eccentricity on Spell Totems: its wide pulse clears and its stronger pulse bosses. Arc keeps the four-link helmet for open layouts."
      - "The gate report measures the default link at red maps and pinnacle; the published paste holds both links, and the four-link Arc is the clear swap."
      - "Lightning Tendrils, self-cast and then on Spell Totem, carries the campaign; the transfigured version takes over at the Merciless Labyrinth."
      - "Arcane Blessing and Blasphemy with Conductivity are the damage layers; Determination, a Granite flask, a Basalt flask and Conviction of Power are the physical layer."
      - "The tree buys life first; chaos resistance reaches 75% at pinnacle only, and every checkpoint passes the standard floors rather than the lower Dad damage floor."
      - "Withdrew the S+: the gate had measured level-16 Awakened supports and Empower, and the game caps Awakened supports at 5 and Awakened Empower at 4. The late links now cap those levels explicitly."
      - "On legal gems pinnacle measures 295k per totem and red maps 187k per totem; every checkpoint still passes its standard floor."
      - "Ratings are 10/8/8/9 and the medal is S: tankiness stays 10 on 46.0k EHP and 14.1k max hit, while single target and clear drop to 8."
      - "Two cheap common-drop uniques are required at red maps and pinnacle; the leveling steps stay unique-free, and the bill is the six-link, the 21/20 gems and the Awakened supports."
