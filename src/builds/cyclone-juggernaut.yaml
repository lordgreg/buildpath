                note: Level 1-5 only.
              - Immortal Call
          - slot: Boots
            gems:
              - Decoy Totem
        flasks: &id002
          - slot: life
            name: Divine Life Flask
            note: Keep the instant prefix.
          - slot: mana
            name: Eternal Mana Flask
            note: Drops from level 65.
          - slot: utility
            name: Granite Flask
            note: Iron Skin.
          - slot: utility
            name: Basalt Flask
            note: Physical reduction.
          - slot: utility
            name: Amethyst Flask
            note: Chaos resistance.
      - id: maps-red
        level: 90
        main: Cyclone
        grade: A
        trigger: { from: 80 }
        measure: true
        gems:
          - slot: Body Armour
            gems:
              - Cyclone
              - Melee Physical Damage
              - Brutality
              - Pulverise
              - Close Combat
              - Faster Attacks
          - slot: Weapon 1
            gems:
              - Leap Slam
              - Enduring Cry
          - slot: Helmet
            gems:
              - Determination
              - Blood and Sand
          - slot: Gloves
            gems:
              - name: Cast when Damage Taken
                maxLevel: 5
                note: Level 1-5 only.
              - Immortal Call
          - slot: Boots
            gems:
              - Decoy Totem
        flasks: *id002
  endgame:
    sub:
      - id: endgame-pinnacle
        level: 96
        main: Cyclone
        grade: S
        trigger: { from: 90 }
        measure: true
        aliases: [pinnacle]
        gems:
          - slot: Body Armour
            gems:
              - Cyclone
              - Melee Physical Damage
              - Brutality
