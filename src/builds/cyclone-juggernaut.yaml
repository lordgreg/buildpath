schemaVersion: 1
season: covens
wickerman:
  profile: physical-melee
stepPlan: cyclone
id: cyclone-juggernaut
name: Cyclone Juggernaut
class: Marauder
ascendancyId: juggernaut
family: melee
mainSkill: Cyclone
summary: >-
  Two-handed Cyclone on the Juggernaut shell. The axe and the budget armour are
  the damage and defence; the ascendancy supplies endurance charges, recovery
  and stun immunity. No required unique.

pros:
  - { weight: 3, text: "Very tanky through armour, endurance charges and Juggernaut recovery." }
  - { weight: 3, text: "No required unique; a rare two-handed axe is the damage slot." }
  - { weight: 2, text: "Cyclone hits while moving, so clear and defence happen together." }
  - { weight: 2, text: "Strong single-target once the axe and attack speed are online." }
  - { weight: 2, text: "Endurance charges make the mitigation forgiving while learning fights." }
  - { weight: 1, text: "A comfortable lab runner for the first two labyrinths." }
cons:
  - { weight: 3, text: "Melee range means you eat mechanics a ranged build can walk away from." }
  - { weight: 3, text: "Attack speed is both damage and survival, so slow weapons feel bad." }
  - { weight: 2, text: "Clear speed is slower than a bow or a minion build." }
  - { weight: 2, text: "Cyclone locks your movement into the spin." }
  - { weight: 1, text: "Mana is tight before leech and reduced cost are solved." }
  - { weight: 1, text: "Resolute Technique gives up critical strikes entirely." }

ratings:
  tankiness: 8
  singleTarget: 9
  clear: 8
  cost: 8

guide:
  summary:
    text: >-
      Cyclone Juggernaut is a two-handed melee build that measures
      {{gates.maps-red.metrics.dps|dps}} at red maps and {{gates.endgame-pinnacle.metrics.dps|dps}} at
      pinnacle. Armour, endurance charges and the ascendancy carry the defence;
      the rare axe carries the damage, and no unique is required.
    facts: [mainSkill, ascendancyId, gates.maps-red.metrics.dps, gates.endgame-pinnacle.metrics.dps]
    signed: { by: "maintainer", at: "2026-11-27T00:00:00Z" }
  leveling:
    text: >-
      Level with Cleave until Cyclone unlocks, then switch to the two-handed
      axe and keep spinning. The first checkpoint measures
      {{gates.leveling-1-12.metrics.life|int}} life and {{gates.leveling-1-12.metrics.dps|dps}} damage;
      the second measures {{gates.leveling-12-28.metrics.dps|dps}}. Enduring Cry and a mana
      flask cover the early sustain.
    facts: [gates.leveling-1-12.metrics.life, gates.leveling-1-12.metrics.dps, gates.leveling-12-28.metrics.dps]
  maps:
    text: >-
      At red maps the build measures {{gates.maps-red.metrics.dps|dps}} damage,
      {{gates.maps-red.metrics.ehp|int}} effective life and
      {{gates.maps-red.metrics.maxHit|int}} physical max hit. Keep the axe current,
      cap elemental resistances, and use the filter to hide the rest.
    facts: [gates.maps-red.metrics.dps, gates.maps-red.metrics.ehp, gates.maps-red.metrics.maxHit]
  bossing:
    text: >-
      Pinnacle measures {{gates.endgame-pinnacle.metrics.dps|dps}} damage with
      {{gates.endgame-pinnacle.metrics.ehp|int}} effective life and
      {{gates.endgame-pinnacle.metrics.maxHit|int}} physical max hit. Hold the spin through
      small hits, then move out of the telegraphed slams instead of trying to
      out-armour them.
    facts: [gates.endgame-pinnacle.metrics.dps, gates.endgame-pinnacle.metrics.ehp, gates.endgame-pinnacle.metrics.maxHit]

gearProfile: melee

# The melee family filter keeps a shield slot; this build is a two-hander.
filter:
  slots:
    weapon:
      itemClasses: ["Two Hand Axe"]
    offhand: null

tree:
  keystones:
    - Resolute Technique
  targets:
    - increased physical damage
    - increased attack speed
    - increased maximum life
    - increased armour
    - increased area of effect
    - increased melee damage

# Steps (PLAN-BUILDS.md §9.3). Each step is read and measured at its `level`;
# the pre-refactor checkpoints survive as `aliases`, so old links still land.
steps:
  leveling:
    sub:
      - id: leveling-1-12
        level: 12
        main: Cleave
        grade: B
        measure: true
        aliases: [until-12]
        gems:
          - slot: Body Armour
            gems:
              - Cleave
              - Ruthless
              - Faster Attacks
          - slot: Weapon 1
            gems:
              - Leap Slam
              - Enduring Cry
          - slot: Helmet
            gems:
              - Decoy Totem
          - slot: Boots
            gems:
              - Blood and Sand
        flasks:
          - slot: life
            name: Medium Life Flask
            note: Small until level 3.
          - slot: mana
            name: Small Mana Flask
            note: Slam attacks are mana-hungry.
          - slot: utility
            name: Quicksilver Flask
            note: Act 2 quest reward.
      - id: leveling-12-28
        level: 28
        main: Cyclone
        grade: B
        trigger: { from: 12, skill: Cyclone }
        measure: true
        aliases: [until-28]
        gems:
          - slot: Body Armour
            gems:
              - Cyclone
              - Melee Physical Damage
              - Close Combat
              - Faster Attacks
          - slot: Weapon 1
            gems:
              - Leap Slam
              - Enduring Cry
          - slot: Helmet
            gems:
              - Decoy Totem
              - Blood and Sand
          - slot: Boots
            gems:
              - Determination
        flasks:
          - slot: life
            name: Giant Life Flask
            note: Drops from level 24.
          - slot: mana
            name: Greater Mana Flask
            note: Drops from level 12.
          - slot: utility
            name: Granite Flask
            note: Armour is the defensive layer.
          - slot: utility
            name: Basalt Flask
            note: Physical reduction.
          - slot: utility
            name: Amethyst Flask
            note: Chaos resistance.
      - id: leveling-28-38
        level: 38
        main: Cyclone
        grade: C
        trigger: { from: 28 }
        points: 42
        measure: true
        watch: >-
          Brutality and Pulverise replace Close Combat and Faster Attacks in the four-link.
          Determination and Cast when Damage Taken with Immortal Call come online; the fifth link
          waits for 68 and the sixth for red maps.
        gems:
          - slot: Body Armour
            gems:
              - Cyclone
              - Melee Physical Damage
              - Brutality
              - Pulverise
          - slot: Weapon 1
            gems:
              - Leap Slam
              - Enduring Cry
          - slot: Helmet
            gems:
              - Determination
              - Blood and Sand
          - slot: Gloves
            gems:
              - name: Cast when Damage Taken
                maxLevel: 5
                note: Level 1-5 only.
              - Immortal Call
          - slot: Boots
            gems:
              - Decoy Totem
        flasks:
          - slot: life
            name: Giant Life Flask
            note: Drops from level 24.
          - slot: mana
            name: Greater Mana Flask
            note: Drops from level 12.
          - slot: utility
            name: Granite Flask
            note: Armour is the defensive layer.
          - slot: utility
            name: Basalt Flask
            note: Physical reduction.
          - slot: utility
            name: Amethyst Flask
            note: Chaos resistance.
      - id: leveling-38-68
        level: 68
        main: Cyclone
        grade: B
        trigger: { from: 38, link: 5 }
        measure: true
        aliases: [until-68]
        gems:
          - slot: Body Armour
            gems:
              - Cyclone
              - Melee Physical Damage
              - Brutality
              - Pulverise
              - Faster Attacks
          - slot: Weapon 1
            gems:
              - Leap Slam
              - Enduring Cry
          - slot: Helmet
            gems:
              - Determination
              - Blood and Sand
          - slot: Gloves
            gems:
              - name: Cast when Damage Taken
                maxLevel: 5
                note: Level 1-5 only.
              - Immortal Call
          - slot: Boots
            gems:
              - Decoy Totem
        flasks:
          - slot: life
            name: Divine Life Flask
            note: Instant prefix.
          - slot: mana
            name: Hallowed Mana Flask
            note: Drops from level 42.
          - slot: utility
            name: Granite Flask
            note: Iron Skin suffix.
          - slot: utility
            name: Basalt Flask
            note: Physical reduction.
          - slot: utility
            name: Amethyst Flask
            note: Chaos resistance.
  maps:
    sub:
      - id: maps-white
        level: 80
        main: Cyclone
        grade: A
        trigger: { from: 68 }
        measure: true
        aliases: [maps-early]
        gems:
          - slot: Body Armour
            gems:
              - Cyclone
              - Melee Physical Damage
              - Brutality
              - Pulverise
              - Close Combat
          - slot: Weapon 1
            gems:
              - Leap Slam
              - Enduring Cry
          - slot: Helmet
            gems:
              - Determination
              - Blood and Sand
          - slot: Gloves
            gems:
              - name: Cast when Damage Taken
