schemaVersion: 1
season: covens
wickerman:
  profile: lightning-totem
stepPlan: storm-burst-totems
id: storm-burst-repulsion-hierophant
name: Storm Burst of Repulsion Totems
class: Templar
ascendancyId: hierophant
family: caster
mainSkill: Storm Burst of Repulsion
flagship: false
gateProfile: dad
dad: true
summary: >-
  Storm Burst of Repulsion on Spell Totem: the totems channel orbs that bounce
  away from the target and detonate when the channel ends, so the damage keeps
  landing while you walk. The Hierophant totem and mana package pays for the
  channel, and no unique is required.

pros:
  - { weight: 3, text: "Totems channel while you move" }
  - { weight: 3, text: "Shared spell gear" }
  - { weight: 2, text: "Good pack coverage" }
  - { weight: 2, text: "Mana recovery" }
  - { weight: 1, text: "No required unique" }

cons:
  - { weight: 3, text: "Totem uptime" }
  - { weight: 3, text: "Both totems needed for bosses" }
  - { weight: 2, text: "Mobile bosses dodge orbs" }
  - { weight: 2, text: "Tight mana early" }
  - { weight: 1, text: "Area damage kills totems" }

ratings:
  tankiness: 6
  singleTarget: 7
  clear: 7
  cost: 7

gearProfile: spell

tree:
  targets:
    - totem damage
    - increased maximum life
    - increased lightning damage
    - increased cast speed
    - increased maximum mana
    - increased elemental damage

# Steps (PLAN-BUILDS.md §9.3). Each step is read and measured at its `level`;
# the pre-refactor checkpoints survive as `aliases`, so old links still land.
steps:
  leveling:
    sub:
      - id: leveling-1-12
        level: 12
        main: Rolling Magma
        measure: true
        gems:
          - slot: Body Armour
            gems:
              - Rolling Magma
              - Added Lightning Damage
              - Arcane Surge
          - slot: Weapon 1
            gems:
              - Flame Dash
          - slot: Helmet
            gems:
              - Clarity
        flasks:
          - slot: life
            name: Medium Life Flask
            note: Small until level 3.
          - slot: mana
            name: Small Mana Flask
            note: Spells are expensive early.
          - slot: utility
            name: Quicksilver Flask
            note: Act 2 quest reward.
      - id: leveling-12-28
        level: 28
        main: Rolling Magma
        trigger: { from: 12 }
        measure: true
        gems:
          - slot: Body Armour
            gems:
              - Rolling Magma
              - Added Lightning Damage
              - Faster Casting
              - Controlled Destruction
          - slot: Weapon 1
            gems:
              - Flame Dash
              - Arcane Surge
          - slot: Shield
            gems:
              - Clarity
        flasks:
          - slot: life
            name: Giant Life Flask
            note: Drops from level 24.
          - slot: mana
            name: Greater Mana Flask
            note: Drops from level 12.
          - slot: utility
            name: Amethyst Flask
            note: Chaos resistance from level 18.
          - slot: utility
            name: Quicksilver Flask
            note: Movement, not damage.
      - id: leveling-28-38
        level: 38
        main: Rolling Magma
        trigger: { from: 28 }
        points: 42
        measure: true
        watch: >-
          Spell Totem and Lightning Penetration replace Faster Casting and Controlled Destruction
          in the four-link. Determination, Clarity and a second Spell Totem come online; the fifth
          link waits for 68 and the sixth for red maps.
        gems:
          - slot: Body Armour
            gems:
              - Rolling Magma
              - Spell Totem
              - Added Lightning Damage
              - Lightning Penetration
          - slot: Weapon 1
            gems:
              - Flame Dash
              - Arcane Surge
          - slot: Shield
            gems:
              - Determination
          - slot: Helmet
            gems:
              - Clarity
        flasks:
          - slot: life
            name: Giant Life Flask
            note: Drops from level 24.
          - slot: mana
            name: Greater Mana Flask
            note: Drops from level 12.
          - slot: utility
            name: Amethyst Flask
            note: Chaos resistance from level 18.
          - slot: utility
            name: Quicksilver Flask
            note: Movement, not damage.
      - id: leveling-38-68
        level: 68
        main: Rolling Magma
        trigger: { from: 38, link: 5 }
        measure: true
        gems:
          - slot: Body Armour
            gems:
              - Rolling Magma
              - Spell Totem
              - Added Lightning Damage
              - Lightning Penetration
              - Controlled Destruction
          - slot: Weapon 1
            gems:
              - Flame Dash
              - Arcane Surge
          - slot: Shield
            gems:
              - Determination
          - slot: Helmet
            gems:
              - Clarity
        flasks:
          - slot: life
            name: Divine Life Flask
            note: Drops from level 60; instant prefix.
          - slot: mana
            name: Hallowed Mana Flask
            note: Drops from level 42.
          - slot: utility
            name: Granite Flask
            note: Armour against physical hits.
          - slot: utility
            name: Quartz Flask
            note: Phasing out of a pack.
          - slot: utility
            name: Amethyst Flask
            note: Chaos resistance until it is capped.
        watch: After the campaign, transform a Storm Burst at the Divine Font in the Merciless Labyrinth or buy the gem in trade.
  maps:
    sub:
      - id: maps-white
        level: 80
        main: Storm Burst of Repulsion
        trigger: { from: 68, skill: Storm Burst of Repulsion }
        measure: true
        gems:
          - slot: Body Armour
            gems:
              - Storm Burst of Repulsion
              - Spell Totem
              - Added Lightning Damage
              - Lightning Penetration
              - Controlled Destruction
          - slot: Weapon 1
            gems:
              - Flame Dash
              - Arcane Surge
          - slot: Shield
            gems:
              - Determination
          - slot: Helmet
            gems:
              - Clarity
        flasks: &id002
          - slot: life
            name: Divine Life Flask
            note: Keep the instant prefix.
          - slot: mana
            name: Eternal Mana Flask
            note: Drops from level 65.
          - slot: utility
            name: Granite Flask
            note: Armour against physical hits.
          - slot: utility
            name: Quartz Flask
            note: Phasing out of a pack.
          - slot: utility
            name: Amethyst Flask
            note: Chaos resistance for pinnacle bosses.
      - id: maps-red
        level: 90
        main: Storm Burst of Repulsion
        trigger: { from: 80 }
        measure: true
        gems:
          - slot: Body Armour
            gems:
              - Storm Burst of Repulsion
              - Spell Totem
              - Added Lightning Damage
              - Lightning Penetration
              - Controlled Destruction
              - Elemental Focus
          - slot: Weapon 1
            gems:
              - Flame Dash
              - Arcane Surge
          - slot: Shield
            gems:
              - Determination
          - slot: Helmet
            gems:
              - Clarity
        flasks: *id002
  endgame:
    sub:
      - id: endgame-pinnacle
        level: 96
        main: Storm Burst of Repulsion
        trigger: { from: 90 }
        measure: true
        gems:
          - slot: Body Armour
            gems:
              - Storm Burst of Repulsion
              - Spell Totem
              - Added Lightning Damage
              - Lightning Penetration
              - Controlled Destruction
              - Elemental Focus
          - slot: Weapon 1
            gems:
              - Flame Dash
              - Arcane Surge
          - slot: Shield
            gems:
              - Determination
          - slot: Helmet
            gems:
              - Clarity
        flasks: *id002

ascendancyOrder:
  - { node: pursuit-of-faith, lab: 1 }
  - { node: ritual-of-awakening, lab: 2 }
  - { node: divine-guidance, lab: 3 }
  - { node: sanctuary-of-thought, lab: 4 }

bandit: kill-all
pantheon:
  major: lunaris
  minor: gruthkul
  note: Gruthkul reduces the physical hits that catch you while you place the next totem.
uniques:
  core: []
  optional: []

guide:
  summary:
    text: >-
      Storm Burst of Repulsion Totems measure {{gates.maps-red.metrics.dps|dps}}
      at red maps and {{gates.endgame-pinnacle.metrics.dps|dps}} at pinnacle. Two Spell
      Totems channel the bouncing orbs while you position, and the build needs
      no unique.
    facts: [mainSkill, ascendancyId, gates.maps-red.metrics.dps, gates.endgame-pinnacle.metrics.dps]
  leveling:
    text: >-
      Rolling Magma carries the campaign. Storm Burst of
      Repulsion is transfigured, so it only arrives from the Divine Font in the
      Merciless Labyrinth or from trade after the campaign. The first checkpoint
      measures {{gates.leveling-1-12.metrics.life|int}} life and
      {{gates.leveling-1-12.metrics.dps|dps}} damage; the second measures
      {{gates.leveling-12-28.metrics.dps|dps}}.
    facts: [gates.leveling-1-12.metrics.life, gates.leveling-1-12.metrics.dps, gates.leveling-12-28.metrics.dps]
  maps:
    text: >-
      At red maps the build measures {{gates.maps-red.metrics.dps|dps}} damage,
      {{gates.maps-red.metrics.ehp|int}} effective life and
      {{gates.maps-red.metrics.maxHit|int}} physical max hit. Keep both totems
      down, recast them ahead of the pack, and let the orbs finish the clear.
    facts: [gates.maps-red.metrics.dps, gates.maps-red.metrics.ehp, gates.maps-red.metrics.maxHit]
  bossing:
    text: >-
      Pinnacle measures {{gates.endgame-pinnacle.metrics.dps|dps}} damage with
      {{gates.endgame-pinnacle.metrics.ehp|int}} effective life and
      {{gates.endgame-pinnacle.metrics.maxHit|int}} physical max hit. Place both totems
      before the burst window and refresh them after every immunity phase.
    facts: [gates.endgame-pinnacle.metrics.dps, gates.endgame-pinnacle.metrics.ehp, gates.endgame-pinnacle.metrics.maxHit]
changelog:
  - season: covens
    date: "2026-11-26"
    notes:
      - "First guide for the Covens league."
  - season: covens
    date: "2026-11-27"
    notes:
      - "A 28-38 step now shows the four-link and the gems that unlock at 38; the fifth link waits for 68 and the sixth for red maps."
