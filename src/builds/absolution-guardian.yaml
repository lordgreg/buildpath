schemaVersion: 1
season: covens
wickerman:
  profile: minion
stepPlan: absolution
id: absolution-guardian
name: Absolution Guardian
class: Templar
ascendancyId: guardian
family: minion
mainSkill: Absolution
flagship: false
gateProfile: dad
summary: >-
  Absolution turns a single cast into a squad of lightning sentinels that keep
  attacking while you move. The Guardian shell supplies the defences and the
  relic army, so the build is a relaxed mapper that still has a real boss
  rotation, and it needs no unique.

pros:
  - { weight: 3, text: "Minions fight for you" }
  - { weight: 3, text: "Forgiving Guardian defences" }
  - { weight: 2, text: "No required unique" }
  - { weight: 2, text: "Good pack clear" }
  - { weight: 1, text: "Relaxed league starter" }

cons:
  - { weight: 3, text: "Minion AI" }
  - { weight: 3, text: "Needs setup for bosses" }
  - { weight: 2, text: "Recasting loses damage" }
  - { weight: 2, text: "Slower mapper" }
  - { weight: 1, text: "No elemental reflect" }

ratings:
  tankiness: 7
  singleTarget: 8
  clear: 6
  cost: 8

gearProfile: caster
minionCount: 3

tree:
  targets:
    - minions deal increased damage
    - minion damage
    - minions have increased attack speed
    - increased lightning damage
    - maximum life

# Steps (PLAN-BUILDS.md §9.3). Each step is read and measured at its `level`;
# the pre-refactor checkpoints survive as `aliases`, so old links still land.
steps:
  leveling:
    sub:
      - id: leveling-1-12
        level: 12
        main: Absolution
        measure: true
        gems:
          - slot: Body Armour
            gems:
              - Absolution
              - Added Lightning Damage
          - slot: Weapon 1
            gems:
              - Holy Flame Totem
          - slot: Helmet
            gems:
              - Clarity
          - slot: Boots
            gems:
              - Flame Dash
              - Arcane Surge
        flasks:
          - slot: life
            name: Medium Life Flask
            note: Small until level 3.
          - slot: mana
            name: Small Mana Flask
            note: Sentinels are expensive early.
          - slot: utility
            name: Quicksilver Flask
            note: Act 2 quest reward.
      - id: leveling-12-28
        level: 28
        main: Absolution
        trigger: { from: 12 }
        measure: true
        gems:
          - slot: Body Armour
            gems:
              - Absolution
              - Added Lightning Damage
              - Minion Damage
              - Elemental Focus
          - slot: Weapon 1
            gems:
              - Holy Flame Totem
          - slot: Shield
            gems:
              - Determination
              - Convocation
          - slot: Helmet
            gems:
              - Clarity
          - slot: Boots
            gems:
              - Flame Dash
              - Arcane Surge
        flasks:
          - slot: life
            name: Giant Life Flask
            note: Drops from level 24.
          - slot: mana
            name: Greater Mana Flask
            note: Drops from level 12.
          - slot: utility
            name: Amethyst Flask
            note: Chaos resistance from level 18.
          - slot: utility
            name: Quicksilver Flask
            note: Movement, not damage.
      - id: leveling-28-38
        level: 38
        main: Absolution
        trigger: { from: 28 }
        points: 42
        measure: true
        watch: >-
          The four-link is unchanged at 38. Convocation, Clarity, Desecrate and Cast when Damage
          Taken with Immortal Call come online; the fifth link waits for 68 and the sixth for red
          maps.
        gems:
          - slot: Body Armour
            gems:
              - Absolution
              - Added Lightning Damage
              - Minion Damage
              - Elemental Focus
          - slot: Weapon 1
            gems:
              - Convocation
              - Clarity
          - slot: Shield
            gems:
              - Determination
          - slot: Helmet
            gems:
              - Desecrate
          - slot: Gloves
            gems:
              - name: Cast when Damage Taken
                maxLevel: 5
                note: 'Level 1-5 only: higher levels need bigger hits before it triggers.'
              - Immortal Call
          - slot: Boots
            gems:
              - Flame Dash
              - Arcane Surge
        flasks:
          - slot: life
            name: Giant Life Flask
            note: Drops from level 24.
          - slot: mana
            name: Greater Mana Flask
            note: Drops from level 12.
          - slot: utility
            name: Amethyst Flask
            note: Chaos resistance from level 18.
          - slot: utility
            name: Quicksilver Flask
            note: Movement, not damage.
      - id: leveling-38-68
        level: 68
        main: Absolution
        trigger: { from: 38, link: 5 }
        measure: true
        gems:
          - slot: Body Armour
            gems:
              - Absolution
              - Added Lightning Damage
              - Minion Damage
              - Elemental Focus
              - Controlled Destruction
          - slot: Weapon 1
            gems:
              - Convocation
              - Clarity
          - slot: Shield
            gems:
              - Determination
          - slot: Helmet
            gems:
              - Desecrate
          - slot: Gloves
            gems:
              - name: Cast when Damage Taken
                maxLevel: 5
                note: 'Level 1-5 only: higher levels need bigger hits before it triggers.'
              - Immortal Call
          - slot: Boots
            gems:
              - Flame Dash
              - Arcane Surge
        flasks:
          - slot: life
            name: Divine Life Flask
            note: Drops from level 60; instant prefix.
          - slot: mana
            name: Hallowed Mana Flask
            note: Drops from level 42.
          - slot: utility
            name: Granite Flask
            note: Armour against physical hits.
          - slot: utility
            name: Quartz Flask
            note: Phasing through the sentinels.
          - slot: utility
            name: Amethyst Flask
            note: Chaos resistance until it is capped.
  maps:
    sub:
      - id: maps-white
        level: 80
        main: Absolution
        trigger: { from: 68 }
        measure: true
        gems:
          - slot: Body Armour
            gems:
              - Absolution
              - Added Lightning Damage
              - Minion Damage
              - Elemental Focus
              - Predator
          - slot: Weapon 1
            gems:
              - Convocation
              - Clarity
          - slot: Shield
            gems:
              - Determination
          - slot: Helmet
            gems:
              - Desecrate
          - slot: Gloves
            gems:
              - name: Cast when Damage Taken
                maxLevel: 5
                note: 'Level 1-5 only: higher levels need bigger hits before it triggers.'
              - Immortal Call
          - slot: Boots
            gems:
              - Flame Dash
              - Arcane Surge
        flasks: &id002
          - slot: life
            name: Divine Life Flask
            note: Keep the instant prefix.
          - slot: mana
            name: Eternal Mana Flask
            note: Drops from level 65.
          - slot: utility
            name: Granite Flask
            note: Armour against physical hits.
          - slot: utility
            name: Quartz Flask
            note: Phasing through the sentinels.
          - slot: utility
            name: Amethyst Flask
            note: Chaos resistance for pinnacle bosses.
      - id: maps-red
        level: 90
        main: Absolution
        trigger: { from: 80 }
        measure: true
        gems:
          - slot: Body Armour
            gems:
              - Absolution
              - Added Lightning Damage
              - Minion Damage
              - Elemental Focus
              - Predator
              - Lightning Penetration
          - slot: Weapon 1
            gems:
              - Convocation
              - Clarity
          - slot: Shield
            gems:
              - Determination
          - slot: Helmet
            gems:
              - Desecrate
          - slot: Gloves
            gems:
              - name: Cast when Damage Taken
                maxLevel: 5
                note: 'Level 1-5 only: higher levels need bigger hits before it triggers.'
              - Immortal Call
          - slot: Boots
            gems:
              - Flame Dash
              - Arcane Surge
        flasks: *id002
  endgame:
    sub:
      - id: endgame-pinnacle
        level: 96
        main: Absolution
        trigger: { from: 90 }
        measure: true
        gems:
          - slot: Body Armour
            gems:
              - Absolution
              - Added Lightning Damage
              - Minion Damage
              - Elemental Focus
              - Predator
              - Lightning Penetration
          - slot: Weapon 1
            gems:
              - Convocation
              - Clarity
          - slot: Shield
            gems:
              - Determination
          - slot: Helmet
            gems:
              - Desecrate
          - slot: Gloves
            gems:
              - name: Cast when Damage Taken
                maxLevel: 5
                note: 'Level 1-5 only: higher levels need bigger hits before it triggers.'
              - Immortal Call
          - slot: Boots
            gems:
              - Flame Dash
              - Arcane Surge
        flasks: *id002

ascendancyOrder:
  - { node: time-of-need, lab: 1 }
  - { node: radiant-crusade, lab: 2 }
  - { node: bastion-of-hope, lab: 3 }
  - { node: unwavering-crusade, lab: 4 }

bandit: kill-all
pantheon:
  major: lunaris
  minor: gruthkul
  note: Gruthkul reduces the physical hits that catch a caster in a bad position.
uniques:
  core: []
  optional: []

guide:
  summary:
    text: >-
      Absolution Guardian turns one cast into a squad of lightning sentinels
      that keep attacking while you move. It measures
      {{gates.maps-red.metrics.dps|dps}} at red maps and
      {{gates.endgame-pinnacle.metrics.dps|dps}} at pinnacle, and needs no unique.
    facts: [mainSkill, ascendancyId, gates.maps-red.metrics.dps, gates.endgame-pinnacle.metrics.dps]
  leveling:
    text: >-
      Level with Holy Flame Totem until Absolution is available, then keep the
      sentinels between you and the pack. The first checkpoint measures
      {{gates.leveling-1-12.metrics.life|int}} life and
      {{gates.leveling-1-12.metrics.dps|dps}} damage; the second measures
      {{gates.leveling-12-28.metrics.dps|dps}}.
    facts: [gates.leveling-1-12.metrics.life, gates.leveling-1-12.metrics.dps, gates.leveling-12-28.metrics.dps]
  maps:
    text: >-
      At red maps the build measures {{gates.maps-red.metrics.dps|dps}} damage,
      {{gates.maps-red.metrics.ehp|int}} effective life and
      {{gates.maps-red.metrics.maxHit|int}} physical max hit. Keep the sentinels
      refreshed ahead of the pack and let the filter hide the rest.
    facts: [gates.maps-red.metrics.dps, gates.maps-red.metrics.ehp, gates.maps-red.metrics.maxHit]
  bossing:
    text: >-
      Pinnacle measures {{gates.endgame-pinnacle.metrics.dps|dps}} damage with
      {{gates.endgame-pinnacle.metrics.ehp|int}} effective life and
      {{gates.endgame-pinnacle.metrics.maxHit|int}} physical max hit. Recast Absolution
      before the burst, keep Convocation ready, and move when the slam lands.
    facts: [gates.endgame-pinnacle.metrics.dps, gates.endgame-pinnacle.metrics.ehp, gates.endgame-pinnacle.metrics.maxHit]
changelog:
  - season: covens
    date: "2026-11-26"
    notes:
      - "First guide for the Covens league."
  - season: covens
    date: "2026-11-27"
    notes:
      - "A 28-38 step now shows the four-link and the gems that unlock at 38; the fifth link waits for 68 and the sixth for red maps."
