# Reviewed affix catalogue for synthesised budget gear.
#
# Every line is validated by effect in the PoB oracle: a line PoB cannot parse
# is dropped silently (S6), so the gate report asserts each item's parsed mod
# count. Tiers are 1 (best) to 3 (worst); a budget picks the worst tier it
# allows and the synthesiser emits the midpoint value.
life:
  mod: "+{v} to maximum Life"
  # Tier 4 is early-act gear: what actually drops before level 30.
  tiers: { 1: 100, 2: 80, 3: 60, 4: 25 }
resist-fire:
  mod: "+{v}% to Fire Resistance"
  tiers: { 1: 45, 2: 40, 3: 30, 4: 12 }
resist-cold:
  mod: "+{v}% to Cold Resistance"
  tiers: { 1: 45, 2: 40, 3: 30, 4: 12 }
resist-lightning:
  mod: "+{v}% to Lightning Resistance"
  tiers: { 1: 45, 2: 40, 3: 30, 4: 12 }
resist-chaos:
  mod: "+{v}% to Chaos Resistance"
  tiers: { 1: 30, 2: 20, 3: 10, 4: 5 }
energy-shield:
  mod: "+{v} to maximum Energy Shield"
  tiers: { 1: 80, 2: 55, 3: 35, 4: 12 }
energy-shield-pct:
  mod: "{v}% increased Energy Shield"
  tiers: { 1: 60, 2: 40, 3: 25, 4: 10 }
armour:
  mod: "+{v} to Armour"
  tiers: { 1: 300, 2: 200, 3: 120 }
attribute-int:
  mod: "+{v} to Intelligence"
  tiers: { 1: 40, 2: 25, 3: 15, 4: 8 }
minion-gem-level:
  mod: "+{v} to Level of all Minion Skill Gems"
  tiers: { 1: 1, 2: 1, 3: 1 }
minion-damage:
  mod: "Minions deal {v}% increased Damage"
  tiers: { 1: 70, 2: 55, 3: 40, 4: 20 }
movement-speed:
  mod: "{v}% increased Movement Speed"
  tiers: { 1: 30, 2: 25, 3: 20, 4: 15 }
minion-attack-speed:
  mod: "Minions have {v}% increased Attack Speed"
  tiers: { 1: 18, 2: 14, 3: 10, 4: 5 }
minion-life:
  mod: "Minions have {v}% increased maximum Life"
  tiers: { 1: 40, 2: 30, 3: 20, 4: 10 }
# Attack builds: a local weapon roll and the global speed/damage rolls that
# make an unremarkable rare hit hard enough to clear a map. `added-lightning` is
# a range, so it is written as a pair (low, high).
phys-pct:
  mod: "{v}% increased Physical Damage"
  tiers: { 1: 170, 2: 140, 3: 110, 4: 60 }
added-phys:
  mod: "Adds {v} to {v2} Physical Damage"
  tiers:
    1: [40, 80]
    2: [30, 60]
    3: [20, 40]
    4: [8, 16]
added-lightning:
  mod: "Adds {v} to {v2} Lightning Damage"
  tiers:
    1: [15, 250]
    2: [12, 180]
    3: [8, 110]
    4: [3, 40]
attack-speed:
  mod: "{v}% increased Attack Speed"
  tiers: { 1: 17, 2: 13, 3: 9, 4: 5 }
added-lightning-attack:
  mod: "Adds {v} to {v2} Lightning Damage to Attacks"
  tiers:
    1: [10, 100]
    2: [8, 75]
    3: [5, 50]
    4: [2, 20]
# Jewels roll a much smaller physical damage roll than a weapon; sharing the
# weapon key would hand a jewel a 140% local-looking modifier.
phys-damage-jewel:
  mod: "{v}% increased Physical Damage"
  tiers: { 1: 16, 2: 14, 3: 12, 4: 8 }
projectile-damage:
  mod: "{v}% increased Projectile Damage"
  tiers: { 1: 40, 2: 30, 3: 22, 4: 12 }
crit-multi:
  mod: "+{v}% to Critical Strike Multiplier"
  tiers: { 1: 35, 2: 25, 3: 18, 4: 12 }
