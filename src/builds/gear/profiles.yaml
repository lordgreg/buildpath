        boots: { base: "Titan Greaves", affixes: [movement-speed, life, resist-cold, resist-lightning] }
    ssf-week1:
      slots:
        weapon: { base: "Opal Sceptre", affixes: [fire-damage, dot-multi] }
        offhand: { base: "Archon Kite Shield", affixes: [life, resist-fire, resist-cold] }
        body: { base: "Legion Plate", affixes: [life, armour, resist-lightning, resist-cold] }
