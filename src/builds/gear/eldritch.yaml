# Eldritch implicits for the endgame budgets.
#
# Embers apply Searing Exarch implicits; Ichors apply Eater of Worlds implicits.
# These are implicit modifiers, not ordinary prefixes or suffixes. The lines are
# PoB display text, checked by effect: the oracle counts the implicits PoB
# parses, so a typo fails the build instead of quietly making a weaker item.
#
# `ssf-week1` is the red-map budget and uses the Exceptional (tier 4) roll;
# `trade` is the pinnacle budget and uses Perfect (tier 6). A slot may carry one
# of each influence.
schemaVersion: 1
profiles:
  bow:
    ssf-week1:
      body:
        - { currency: ember, mod: "+(26-27)% to Critical Strike Multiplier for Attack Damage" }
        - { currency: ichor, mod: "Grace has (28-30)% increased Aura Effect" }
      helmet:
        - { currency: ember, mod: "(31-32)% increased Mana Cost Efficiency" }
        - { currency: ichor, mod: "Damage Penetrates 5% Lightning Resistance" }
      gloves:
        - { currency: ember, mod: "11% increased Attack Speed" }
        - { currency: ichor, mod: "+8% chance to Suppress Spell Damage" }
      boots:
        - { currency: ember, mod: "8% increased Movement Speed" }
        - { currency: ichor, mod: "(24-26)% chance to Avoid Elemental Ailments" }
    trade:
      body:
        - { currency: ember, mod: "+(30-31)% to Critical Strike Multiplier for Attack Damage" }
