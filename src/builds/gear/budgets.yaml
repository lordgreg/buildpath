# Gear budgets: constraints, not item lists (PLAN-BUILDS.md §7.7).
#
# `tier` is the worst affix tier a budget allows; the synthesiser emits the
# midpoint of that tier. `links` caps the largest socket group, `ilvl` sets the
# item level each item is generated at. Every base is checked against
# known-base-types.json, so a renamed base fails the build instead of the gate.
#
# Resistances are deliberately spread over many slots: the game applies a -60%
# penalty by act 10, so "capped" means roughly 135% of raw resistance across
# fire, cold and lightning. A budget that does not reach that is not a budget a
# player could actually run.
leveling:
  tier: 3
  ilvl: 45
  links: 4
  slots:
    weapon: { base: "Driftwood Wand", affixes: [minion-gem-level] }
    helmet: { base: "Hubris Circlet", affixes: [life, resist-fire, resist-cold] }
    body: { base: "Vaal Regalia", affixes: [life, energy-shield-pct] }
    gloves: { base: "Sorcerer Gloves", affixes: [life, resist-fire] }
    boots: { base: "Sorcerer Boots", affixes: [life, resist-cold, resist-lightning] }
    belt: { base: "Chain Belt", affixes: [life, resist-fire, resist-lightning] }
    amulet: { base: "Onyx Amulet", affixes: [resist-lightning, resist-fire, life] }
    ring1: { base: "Opal Ring", affixes: [life, resist-cold, resist-lightning] }
    ring2: { base: "Opal Ring", affixes: [life, resist-lightning, resist-fire] }
