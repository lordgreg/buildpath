schemaVersion: 1
season: covens
wickerman:
  profile: cold-spell
stepPlan: ice-nova
id: ice-nova-elementalist
name: Ice Nova Elementalist
class: Witch
ascendancyId: elementalist
family: caster
mainSkill: Ice Nova
flagship: false
gateProfile: dad
summary: >-
  Ice Nova is a self-cast cold nova: the Elementalist shell turns every hit into
  chill and freeze, so packs stop moving before they reach you. The build is a
  straightforward crit caster with no required unique, and the same sceptre and
  spirit shield carry it from white maps to pinnacle.

pros:
  - { weight: 3, text: "Freeze and chill defence" }
  - { weight: 3, text: "No required unique" }
  - { weight: 2, text: "Simple aiming" }
  - { weight: 2, text: "Gear slots for defences" }
  - { weight: 1, text: "Easy spell pivot" }

cons:
  - { weight: 3, text: "Must stand in the pack" }
  - { weight: 3, text: "Slow vs cold bosses" }
  - { weight: 2, text: "Expensive crit gear" }
  - { weight: 2, text: "Mana hungry" }
  - { weight: 1, text: "No elemental reflect" }

ratings:
  tankiness: 5
  singleTarget: 7
  clear: 8
  cost: 6

gearProfile: cold-spell

tree:
  targets:
    - increased maximum life
    - increased cold damage
    - increased critical strike multiplier
    - increased critical strike chance
    - increased spell damage
    - increased cast speed

# Steps (PLAN-BUILDS.md §9.3). Each step is read and measured at its `level`;
# the pre-refactor checkpoints survive as `aliases`, so old links still land.
steps:
  leveling:
    sub:
      - id: leveling-1-12
        level: 12
        main: Freezing Pulse
        measure: true
        gems:
          - slot: Body Armour
            gems:
              - Freezing Pulse
              - Added Cold Damage
          - slot: Weapon 1
            gems:
              - Frost Bomb
          - slot: Helmet
            gems:
              - Clarity
          - slot: Boots
            gems:
              - Frostblink
              - Arcane Surge
        flasks:
          - slot: life
            name: Medium Life Flask
            note: Small until level 3.
          - slot: mana
            name: Small Mana Flask
            note: Spells are expensive early.
          - slot: utility
            name: Quicksilver Flask
            note: Act 2 quest reward.
      - id: leveling-12-28
        level: 28
        main: Ice Nova
        trigger: { from: 12, skill: Ice Nova }
        measure: true
        gems:
          - slot: Body Armour
            gems:
              - Ice Nova
              - Added Cold Damage
              - Controlled Destruction
              - Faster Casting
          - slot: Weapon 1
            gems:
              - Frost Bomb
              - Frostblink
          - slot: Shield
            gems:
              - Hatred
              - Clarity
          - slot: Helmet
            gems:
              - Herald of Ice
        flasks:
          - slot: life
            name: Giant Life Flask
            note: Drops from level 24.
          - slot: mana
            name: Greater Mana Flask
            note: Drops from level 12.
          - slot: utility
            name: Amethyst Flask
            note: Chaos resistance from level 18.
          - slot: utility
            name: Quicksilver Flask
            note: Movement, not damage.
      - id: leveling-28-38
        level: 38
        main: Ice Nova
        trigger: { from: 28 }
        points: 42
        measure: true
        watch: >-
          Spell Echo and Increased Critical Strikes replace Controlled Destruction and Faster
          Casting in the four-link. Determination, Clarity and Cast when Damage Taken with
          Immortal Call come online; the fifth link waits for 68 and the sixth for red maps.
        gems:
          - slot: Body Armour
            gems:
              - Ice Nova
              - Added Cold Damage
              - Spell Echo
              - Increased Critical Strikes
          - slot: Weapon 1
            gems:
              - Frost Bomb
              - Frostblink
          - slot: Shield
            gems:
              - Hatred
              - Determination
          - slot: Helmet
            gems:
              - Herald of Ice
              - Clarity
          - slot: Gloves
            gems:
              - name: Cast when Damage Taken
                maxLevel: 5
                note: 'Level 1-5 only: higher levels need bigger hits before it triggers.'
              - Immortal Call
        flasks:
          - slot: life
            name: Giant Life Flask
            note: Drops from level 24.
          - slot: mana
            name: Greater Mana Flask
            note: Drops from level 12.
          - slot: utility
            name: Amethyst Flask
            note: Chaos resistance from level 18.
          - slot: utility
            name: Quicksilver Flask
            note: Movement, not damage.
      - id: leveling-38-68
        level: 68
        main: Ice Nova
        trigger: { from: 38, link: 5 }
        measure: true
        gems:
          - slot: Body Armour
            gems:
              - Ice Nova
              - Added Cold Damage
              - Spell Echo
              - Increased Critical Strikes
              - Cold Penetration
          - slot: Weapon 1
            gems:
              - Frost Bomb
              - Frostblink
          - slot: Shield
            gems:
              - Hatred
              - Determination
          - slot: Helmet
            gems:
              - Herald of Ice
              - Clarity
          - slot: Gloves
            gems:
              - name: Cast when Damage Taken
                maxLevel: 5
                note: 'Level 1-5 only: higher levels need bigger hits before it triggers.'
              - Immortal Call
        flasks:
          - slot: life
            name: Divine Life Flask
            note: Drops from level 60; instant prefix.
          - slot: mana
            name: Hallowed Mana Flask
            note: Drops from level 42.
          - slot: utility
            name: Granite Flask
            note: Armour against physical hits.
          - slot: utility
            name: Quartz Flask
            note: Phasing out of the pack.
          - slot: utility
            name: Amethyst Flask
            note: Chaos resistance until it is capped.
  maps:
    sub:
      - id: maps-white
        level: 80
        main: Ice Nova
        trigger: { from: 68 }
        measure: true
        gems:
          - slot: Body Armour
            gems:
              - Ice Nova
              - Added Cold Damage
              - Spell Echo
              - Increased Critical Strikes
              - Increased Critical Damage
          - slot: Weapon 1
            gems:
              - Frost Bomb
              - Frostblink
          - slot: Shield
            gems:
              - Hatred
              - Determination
          - slot: Helmet
            gems:
              - Herald of Ice
              - Clarity
          - slot: Gloves
            gems:
              - name: Cast when Damage Taken
                maxLevel: 5
                note: 'Level 1-5 only: higher levels need bigger hits before it triggers.'
              - Immortal Call
        flasks: &id002
          - slot: life
            name: Divine Life Flask
            note: Keep the instant prefix.
          - slot: mana
            name: Eternal Mana Flask
            note: Drops from level 65.
          - slot: utility
            name: Granite Flask
            note: Armour against physical hits.
          - slot: utility
            name: Quartz Flask
            note: Phasing out of the pack.
          - slot: utility
            name: Amethyst Flask
            note: Chaos resistance for pinnacle bosses.
      - id: maps-red
        level: 90
        main: Ice Nova
        trigger: { from: 80 }
        measure: true
        gems:
          - slot: Body Armour
            gems:
              - Ice Nova
              - Added Cold Damage
              - Spell Echo
              - Increased Critical Strikes
              - Increased Critical Damage
              - Cold Penetration
          - slot: Weapon 1
            gems:
              - Frost Bomb
              - Frostblink
          - slot: Shield
            gems:
              - Hatred
              - Determination
          - slot: Helmet
            gems:
              - Herald of Ice
              - Clarity
          - slot: Gloves
            gems:
              - name: Cast when Damage Taken
                maxLevel: 5
                note: 'Level 1-5 only: higher levels need bigger hits before it triggers.'
              - Immortal Call
        flasks: *id002
  endgame:
    sub:
      - id: endgame-pinnacle
        level: 96
        main: Ice Nova
        trigger: { from: 90 }
        measure: true
        gems:
          - slot: Body Armour
            gems:
              - Ice Nova
              - Added Cold Damage
              - Spell Echo
              - Increased Critical Strikes
              - Increased Critical Damage
              - Cold Penetration
          - slot: Weapon 1
            gems:
              - Frost Bomb
              - Frostblink
          - slot: Shield
            gems:
              - Hatred
              - Determination
          - slot: Helmet
            gems:
              - Herald of Ice
              - Clarity
          - slot: Gloves
            gems:
              - name: Cast when Damage Taken
                maxLevel: 5
                note: 'Level 1-5 only: higher levels need bigger hits before it triggers.'
              - Immortal Call
        flasks: *id002

ascendancyOrder:
  - { node: shaper-of-winter, lab: 1 }
  - { node: heart-of-destruction, lab: 2 }
  - { node: mastermind-of-discord, lab: 3 }
  - { node: bastion-of-elements, lab: 4 }

bandit: kill-all
pantheon:
  major: lunaris
  minor: gruthkul
  note: Gruthkul reduces the physical hits that land while you stand in the pack.
uniques:
  core: []
  optional: []

guide:
  summary:
    text: >-
      Ice Nova Elementalist measures {{gates.maps-red.metrics.dps|dps}} at red
      maps and {{gates.endgame-pinnacle.metrics.dps|dps}} at pinnacle. Critical strikes
      and the Elementalist cold package carry the build, and no unique is
      required.
    facts: [mainSkill, ascendancyId, gates.maps-red.metrics.dps, gates.endgame-pinnacle.metrics.dps]
  leveling:
    text: >-
      Level with Freezing Pulse, then switch to Ice Nova as soon as it unlocks.
      The first checkpoint measures {{gates.leveling-1-12.metrics.life|int}} life and
      {{gates.leveling-1-12.metrics.dps|dps}} damage; the second measures
      {{gates.leveling-12-28.metrics.dps|dps}}.
    facts: [gates.leveling-1-12.metrics.life, gates.leveling-1-12.metrics.dps, gates.leveling-12-28.metrics.dps]
  maps:
    text: >-
      At red maps the build measures {{gates.maps-red.metrics.dps|dps}} damage,
      {{gates.maps-red.metrics.ehp|int}} effective life and
      {{gates.maps-red.metrics.maxHit|int}} physical max hit. Step into the pack,
      cast once, and keep moving while the freeze buys the next cast.
    facts: [gates.maps-red.metrics.dps, gates.maps-red.metrics.ehp, gates.maps-red.metrics.maxHit]
  bossing:
    text: >-
      Pinnacle measures {{gates.endgame-pinnacle.metrics.dps|dps}} damage with
      {{gates.endgame-pinnacle.metrics.ehp|int}} effective life and
      {{gates.endgame-pinnacle.metrics.maxHit|int}} physical max hit. Keep the boss
      chilled, recast Frost Bomb for exposure, and burst inside the freeze
      window.
    facts: [gates.endgame-pinnacle.metrics.dps, gates.endgame-pinnacle.metrics.ehp, gates.endgame-pinnacle.metrics.maxHit]
changelog:
  - season: covens
    date: "2026-11-26"
    notes:
      - "First guide for the Covens league."
  - season: covens
    date: "2026-11-27"
    notes:
      - "A 28-38 step now shows the four-link and the gems that unlock at 38; the fifth link waits for 68 and the sixth for red maps."
