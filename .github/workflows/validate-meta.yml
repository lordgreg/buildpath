name: Validate meta snapshot

on:
  pull_request:
    paths:
      - 'src/presets/**'
      - 'src/generated/**'
      - 'src/meta/**'
      - 'scripts/build-presets.mjs'
      - 'scripts/meta-add.mjs'
      - '.github/workflows/validate-meta.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test