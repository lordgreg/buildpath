name: Validate meta snapshot

on:
  pull_request:
    paths:
      - 'src/presets/**'
      - 'src/generated/**'
      - 'src/meta/**'
      - 'src/core/audit/**'
      - 'scripts/build-presets.mjs'
      - 'scripts/meta-add.mjs'
      - '.github/workflows/validate-meta.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build the behaviour audit page
        run: npm run build
      - name: Upload the behaviour audit report
        uses: actions/upload-artifact@v7
        with:
          name: behaviour-audit
          # The whole build, so tests.html loads its own scripts and styles when
          # the artifact is opened locally.
          path: dist
          if-no-files-found: error