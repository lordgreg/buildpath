name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # Build runs tsc -b before vite build.
      - run: npm run build
      # Fails on changed and on new untracked generated files alike.
      - name: Committed generated data matches the sources
        run: |
          git status --porcelain -- src/generated
          test -z "$(git status --porcelain -- src/generated)"
