name: Refresh economy tiers

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run economy:refresh
      - name: Regenerate golden filters when tiers changed
        run: |
          if git diff --quiet -- src/generated/economy.json; then
            echo "No tier changes; golden filters left untouched."
            exit 0
          fi
          # Golden filters embed economy-derived tiers, so a tier change rewrites
          # them. The commit and the PR review carry the golden diff.
          GOLDEN_WRITE=1 npm test
      - run: npm test
      - name: Open a PR when tiers changed
        run: |
          if git diff --quiet -- src/generated/economy.json; then
            echo "No tier changes."
            exit 0
          fi

          base_branch="chore/economy-$(date -u +%Y-%m-%d)"
          branch="$base_branch"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            if [ "$(gh pr list --head "$branch" --state open --json number --jq 'length')" != "0" ]; then
              echo "An open PR already exists for $branch; nothing to do."
              exit 0
            fi
            branch="$base_branch-${{ github.run_number }}-${{ github.run_attempt }}"
            echo "Branch $base_branch exists without an open PR; using $branch."
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add src/generated/economy.json src/core/filter/__golden__
          git commit -m "chore(economy): refresh tiers"
          git push -u origin "$branch"

          body="Automated poe.ninja economy refresh.

          - Source: https://poe.ninja/poe1/economy
          - Generated by the daily workflow
          - Golden filters regenerated to match the new tiers; review that diff too
          - Review the tier changes; overrides in src/presets/economy-overrides.yaml win."

          gh pr create \
            --title "chore(economy): refresh tiers" \
            --body "$body" \
            --base master \
            --head "$branch"