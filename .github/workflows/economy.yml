name: Refresh economy tiers

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # ETags and last bodies per endpoint; an unchanged endpoint answers 304.
      - uses: actions/cache@v5
        with:
          path: .cache/economy
          key: economy-cache-${{ github.run_id }}
          restore-keys: |
            economy-cache-
      - run: npm ci
      - run: npm run economy:refresh
      - name: Regenerate golden filters when tiers changed
        run: |
          if git diff --quiet -- src/generated/economy.json; then
            echo "No tier changes; golden filters left untouched."
            exit 0
          fi
          # Golden filters and the behaviour summary both embed economy-derived
          # tiers, so a tier change rewrites them. The commit and the PR review
          # carry both diffs.
          GOLDEN_WRITE=1 AUDIT_WRITE=1 npm test
      - run: npm test
      # PRs opened with GITHUB_TOKEN wait for maintainer approval before CI
      # runs, so the producer validates the build here as well.
      - run: npm run build
      - name: Compiled presets match the YAML sources
        run: git diff --exit-code -- src/generated/presets.json
      - name: Open or update the rolling PR
        run: |
          if git diff --quiet -- src/generated/economy.json; then
            echo "No tier changes."
            exit 0
          fi

          branch="chore/economy"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add src/generated/economy.json src/core/filter/__golden__
          git add src/core/audit/__golden__
          git commit -m "chore(economy): refresh tiers"

          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            # One rolling PR: replace the branch so the open PR picks up today's
            # tiers instead of a new PR per day.
            git push --force-with-lease origin "$branch"
            if [ "$(gh pr list --head "$branch" --state open --json number --jq 'length')" != "0" ]; then
              echo "Updated the open economy PR for $branch."
              exit 0
            fi
          else
            git push -u origin "$branch"
          fi

          body="Automated poe.ninja economy refresh.

          - Source: https://poe.ninja/poe1/economy
          - Generated by the daily workflow; one rolling PR, force-updated with each change
          - Golden filters and the behaviour summary regenerated to match the new tiers; review those diffs too
          - CI on this PR needs a maintainer to approve the run (bot-opened PR)
          - Review the tier changes; overrides in src/presets/economy-overrides.yaml win."

          gh pr create \
            --title "chore(economy): refresh tiers" \
            --body "$body" \
            --base master \
            --head "$branch"