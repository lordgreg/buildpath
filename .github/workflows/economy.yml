name: Refresh economy tiers

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run economy:refresh
      - run: npm test
      - name: Open a PR when tiers changed
        run: |
          if git diff --quiet -- src/generated/economy.json; then
            echo "No tier changes."
            exit 0
          fi

          branch="chore/economy-$(date -u +%Y-%m-%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add src/generated/economy.json
          git commit -m "chore(economy): refresh tiers"
          git push -u origin "$branch"

          body="Automated poe.ninja economy refresh.

          - Source: https://poe.ninja/poe1/economy
          - Generated by the daily workflow
          - Review the tier changes; overrides in src/presets/economy-overrides.yaml win."

          gh pr create \
            --title "chore(economy): refresh tiers" \
            --body "$body" \
            --base master \
            --head "$branch"