name: Refresh guide feedback

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Creates a labelled issue for a build that has none, then reads the
      # 👍/👎 reactions. The site only ever reads the committed JSON.
      - run: npm run feedback:refresh
      - run: npm test
      - run: npm run build
      - name: Open or update the rolling PR
        run: |
          if git diff --quiet -- src/generated/feedback.json; then
            echo "No feedback changes."
            exit 0
          fi

          branch="chore/feedback"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add src/generated/feedback.json
          git commit -m "chore(feedback): refresh guide votes"

          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            # One rolling PR, so a changed count updates the open PR instead of
            # opening a new one every week.
            git push --force-with-lease origin "$branch"
            if [ "$(gh pr list --head "$branch" --state open --json number --jq 'length')" != "0" ]; then
              echo "Updated the open feedback PR for $branch."
              exit 0
            fi
          else
            git push -u origin "$branch"
          fi

          body="Automated guide feedback refresh.

          - Source: 👍/👎 reactions on the per-build \`guide-feedback\` issues
          - Generated by the weekly workflow; one rolling PR, force-updated with each change
          - \`fetchedAt\` only moves when a count changes, so a quiet week opens nothing
          - Votes are feedback, not a ranking: the catalogue order and ratings are untouched
          - New verified builds get their feedback issue created by this job
          - CI on this PR needs a maintainer to approve the run (bot-opened PR)."

          gh pr create \
            --title "chore(feedback): refresh guide votes" \
            --body "$body" \
            --base master \
            --head "$branch"
